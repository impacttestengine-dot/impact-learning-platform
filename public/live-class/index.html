<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Impact Live Classroom</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Sorts+Mill+Goudy&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
}

body{
display:flex;
align-items:center;
justify-content:center;
background:#05060b;
font-family:Inter,sans-serif;
color:white;
overflow:hidden;
}

.card{

width:min(680px,92vw);

padding:60px;

border-radius:34px;

background:rgba(255,255,255,.07);

border:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(24px);

text-align:center;

box-shadow:
0 30px 80px rgba(0,0,0,.35),
inset 0 1px 0 rgba(255,255,255,.08);

}

h1{

font-family:"Sorts Mill Goudy",serif;

font-size:3rem;

margin-bottom:18px;

font-weight:400;

}

p{

opacity:.72;

font-size:1rem;

line-height:1.7;

margin-bottom:36px;

}

a{

display:inline-flex;

align-items:center;

justify-content:center;

padding:14px 28px;

border-radius:18px;

text-decoration:none;

color:white;

font-weight:800;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.18);

transition:.25s;

}

a:hover{

transform:translateY(-2px);

background:rgba(255,255,255,.13);

}

</style>

</head>

<body>

<div class="card">

<h1>Impact Live Classroom</h1>

<p>
Video conferencing will be available here.
</p>

<a href="/teacher/dashboard.html">
Return to Dashboard
</a>

</div>

</body>

</html>
