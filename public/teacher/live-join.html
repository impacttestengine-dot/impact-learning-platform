<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Join Class | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/impact-global-bg.css">
<link rel="stylesheet" href="/css/live-classroom.css">
</head>
<body>
<script src="/js/impact-global-bg.js"></script>

<div class="join-page">
  <div class="join-card">
    <div class="meeting-badge" id="meetingBadge">Loading...</div>
    <h1 id="meetingTitle">Impact Live Class</h1>
    <p class="join-sub" id="hostLine">Hosted by —</p>

    <div class="join-preview">
      <video id="previewVideo" autoplay playsinline muted></video>
      <div class="join-preview-placeholder" id="previewPlaceholder">
        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        <span id="previewText">Requesting camera access...</span>
      </div>
    </div>

    <p class="perm-note" id="permNote">Your browser will ask for camera and microphone permission. Please click <b>Allow</b>.</p>

    <div class="join-controls-row">
      <button class="join-ctrl" id="prevCamBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        Camera On
      </button>
      <button class="join-ctrl" id="prevMicBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        Mic On
      </button>
    </div>

    <input class="lc-input" id="nameInput" type="text" placeholder="Your name" maxlength="40" autocomplete="name">
    <input class="lc-input" id="passkeyInput" type="password" placeholder="Staff passkey (optional)" maxlength="40" autocomplete="off" style="margin-top:8px;font-size:.82rem;opacity:.88">
    <p style="font-size:.66rem;color:rgba(255,255,255,.4);margin:5px 2px 0;text-align:left">Teachers: enter your passkey to unlock host controls in this class.</p>
    <button class="lc-btn lc-btn-success" id="joinBtn" type="button" style="margin-top:10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Join Class
    </button>
    <div class="error-msg" id="errMsg"></div>
  </div>
</div>

<div class="lc-toast-wrap"><div class="lc-toast" id="toast"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script type="module">
  import { validatePasskey } from "/js/passkey-auth.js?v=learner-gate-fixed-001";
  window.__validatePasskey = validatePasskey;
</script>

<script>
document.addEventListener("DOMContentLoaded", async function(){
  const db = firebase.firestore();
  const params = new URLSearchParams(location.search);
  const MEETING_ID = (params.get("id") || params.get("join") || "").toUpperCase();
  const IS_HOST = params.get("host") === "true";
  const PRESET_NAME = params.get("name") ? decodeURIComponent(params.get("name")) : "";

  if(!MEETING_ID){ location.href = "/teacher/live-classroom.html"; return; }

  function toast(msg){
    const t=document.getElementById("toast");
    t.textContent=msg;t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),3200);
  }

  // Load meeting info
  try{
    const snap = await db.collection("meetings").doc(MEETING_ID).get();
    if(!snap.exists || snap.data().status === "ended"){
      document.getElementById("meetingTitle").textContent = "Meeting Not Found";
      document.getElementById("hostLine").textContent = "This meeting has ended or does not exist.";
      document.getElementById("joinBtn").disabled = true;
      document.getElementById("permNote").style.display = "none";
      return;
    }
    const d = snap.data();
    document.getElementById("meetingBadge").textContent = MEETING_ID;
    document.getElementById("meetingTitle").textContent = d.title || "Impact Live Class";
    document.getElementById("hostLine").textContent = IS_HOST
      ? "You are the host"
      : "Hosted by " + (d.hostName || "Your teacher");
    document.title = (d.title || "Join Class") + " | Impact";
  }catch(e){
    document.getElementById("hostLine").textContent = "Could not load meeting details.";
  }

  if(PRESET_NAME) document.getElementById("nameInput").value = PRESET_NAME;

  // ── Camera/mic preview with correct permission handling ────
  let previewStream = null;
  let camOn = true;
  let micOn = true;
  const previewText = document.getElementById("previewText");
  const permNote     = document.getElementById("permNote");

  async function startPreview(){
    try{
      previewStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720} },
        audio:{ echoCancellation:true, noiseSuppression:true }
      });
      const vid = document.getElementById("previewVideo");
      vid.srcObject = previewStream;
      vid.style.display = "block";
      document.getElementById("previewPlaceholder").style.display = "none";
      permNote.style.display = "none";
    }catch(err){
      console.warn("getUserMedia (video+audio) failed:", err.name);
      // Try audio only
      try{
        previewStream = await navigator.mediaDevices.getUserMedia({ audio:true });
        camOn = false;
        document.getElementById("prevCamBtn").classList.add("off");
        previewText.textContent = "Camera unavailable";
        toast("Camera not available — joining with mic only.");
      }catch(err2){
        camOn = false; micOn = false;
        document.getElementById("prevCamBtn").classList.add("off");
        document.getElementById("prevMicBtn").classList.add("off");
        if(err.name === "NotAllowedError" || err2.name === "NotAllowedError"){
          previewText.textContent = "Permission denied";
          permNote.innerHTML = "⚠️ Camera/mic access was blocked. Click the 🔒 icon in your address bar and allow access, then reload this page.";
          permNote.style.color = "#feb2b2";
          permNote.style.display = "block";
        }else{
          previewText.textContent = "No camera or mic found";
        }
      }
      permNote.style.display = permNote.innerHTML.includes("blocked") ? "block" : "none";
    }
  }

  await startPreview();

  document.getElementById("prevCamBtn").onclick = function(){
    camOn = !camOn;
    if(previewStream) previewStream.getVideoTracks().forEach(t=>t.enabled=camOn);
    this.classList.toggle("off",!camOn);
    this.innerHTML = camOn
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> Camera On`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><line x1="1" y1="1" x2="23" y2="23"/><path d="M21 21H3a2 2 0 0 1-2-2V8"/><path d="M16 13l7 4V7l-7 4"/></svg> Camera Off`;
  };

  document.getElementById("prevMicBtn").onclick = function(){
    micOn = !micOn;
    if(previewStream) previewStream.getAudioTracks().forEach(t=>t.enabled=micOn);
    this.classList.toggle("off",!micOn);
    this.innerHTML = micOn
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Mic On`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Mic Off`;
  };

  if(!PRESET_NAME) document.getElementById("nameInput").focus();
  document.getElementById("nameInput").addEventListener("keydown", function(e){
    if(e.key === "Enter") document.getElementById("joinBtn").click();
  });

  document.getElementById("joinBtn").onclick = async function(){
    const name = document.getElementById("nameInput").value.trim();
    const passkeyValue = document.getElementById("passkeyInput").value.trim();
    const err  = document.getElementById("errMsg");
    if(!name){ err.textContent = "Please enter your name."; return; }
    err.textContent = "";

    // window.open() must be the very first synchronous action for mobile
    // Safari to allow it -- open a blank placeholder now, validate the
    // passkey (if any) afterward, then redirect this already-open tab.
    const newTab = window.open("", "_blank");
    if(newTab){
      newTab.document.write("<!DOCTYPE html><html><head><title>Impact Live Class</title></head><body style=\"background:#05060b;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0\">Joining class...</body></html>");
    }

    let effectiveHost = IS_HOST;
    if(passkeyValue){
      try{
        const result = await window.__validatePasskey(passkeyValue, "teacher");
        if(result && result.ok && String(result.role || "").toLowerCase() !== "learner"){
          effectiveHost = true;
          sessionStorage.setItem("impactPersonnelRole", result.role || "Teacher");
          sessionStorage.setItem("impactAccessName", result.ownerName || name);
        }else{
          err.textContent = "Passkey not recognized -- joining as a regular participant.";
        }
      }catch(e){
        err.textContent = "Could not verify passkey -- joining as a regular participant.";
      }
    }

    if(previewStream) previewStream.getTracks().forEach(t=>t.stop());

    const roomUrl = `/teacher/live-room.html?id=${MEETING_ID}&name=${encodeURIComponent(name)}&host=${effectiveHost}&cam=${camOn}&mic=${micOn}`;
    if(newTab){
      newTab.location.href = roomUrl;
    }else{
      location.href = roomUrl;
    }
    toast("Opening class in a new tab...");
  };
});
</script>
</body>
</html>
