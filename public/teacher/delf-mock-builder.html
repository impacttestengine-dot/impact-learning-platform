<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DELF Mock Builder | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/impact-global-bg.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;overflow-x:hidden}
body{font-family:Inter,system-ui,sans-serif;color:#fff;background:#05060b}
.lp-nav{position:fixed;top:24px;left:28px;z-index:99999;display:flex;gap:12px}
.lp-icon-btn{width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px)}
.lp-icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.page{position:relative;z-index:20;width:min(1320px,96vw);margin:0 auto;padding:108px 0 80px}
.workspace{display:grid;grid-template-columns:270px minmax(0,1fr) 250px;gap:18px;height:calc(100vh - 108px)}
.panel{border-radius:28px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);box-shadow:0 24px 70px rgba(0,0,0,.28)}
.blocks-panel{padding:18px;height:100%;overflow-y:auto;align-self:start}
.settings-panel{padding:22px;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:16px;align-self:start}
.panel-title{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.45);margin-bottom:8px;margin-top:18px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08)}
.panel-title:first-child{margin-top:0}
.block-group{display:flex;flex-direction:column;gap:5px}
.block-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-family:Inter,sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;transition:.15s ease;text-align:left}
.block-btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);transform:translateX(3px)}
.block-icon{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:rgba(217,119,6,.18);flex-shrink:0;font-size:.68rem;font-weight:900;color:#fbbf24}
.block-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.canvas-panel{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.22);height:100%;display:flex;flex-direction:column;overflow:hidden}
.canvas-toolbar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#f4f6f9;border-bottom:1px solid #e4e7ec;flex-wrap:wrap}
.tbtn{padding:6px 12px;border-radius:9px;border:1px solid #dde1e8;background:#fff;color:#374151;font-size:.76rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;transition:.12s}
.tbtn:hover{background:#eef0f4}
.canvas{padding:28px 32px;flex:1;overflow-y:auto;color:#374151}
.canvas-empty{text-align:center;padding:80px 40px;color:#b0b8c8;font-size:.92rem;font-weight:600;border:2px dashed #e4e7ec;border-radius:16px}
.c-block{position:relative;margin-bottom:14px;border-radius:12px;border:2px solid transparent;transition:.15s ease;cursor:pointer}
.c-block:hover{border-color:#e8ebf0}
.c-block.selected{border-color:#d97706 !important;background:#fffbeb !important}
.c-block-inner{padding:18px 20px}
.block-actions{display:none;position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:#1e293b;border-radius:10px;padding:4px 6px;gap:2px;z-index:200;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.c-block.selected .block-actions{display:flex}
.act-btn{width:26px;height:26px;border-radius:7px;border:none;background:transparent;color:#cbd5e1;cursor:pointer;display:grid;place-items:center;font-size:.72rem;transition:.1s}
.act-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.act-btn.danger:hover{background:rgba(239,68,68,.3);color:#fca5a5}
.act-divider{width:1px;background:rgba(255,255,255,.12);height:16px;margin:0 3px;align-self:center}

.delf-section-header{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:2px solid #d97706;margin-bottom:4px}
.delf-section-icon{width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#b45309;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.delf-section-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}
.delf-section-title{font-size:1.4rem;font-weight:800;color:#78350f;outline:none;flex:1}
.delf-section-points{font-size:.8rem;font-weight:800;color:#b45309;background:#fef3c7;padding:5px 12px;border-radius:999px}

.delf-audio-zone{border:2px dashed #d1d5db;border-radius:12px;padding:24px;text-align:center;color:#9ca3af;cursor:pointer;transition:.15s;margin-top:10px}
.delf-audio-zone:hover{border-color:#d97706;color:#d97706}
.delf-audio-player{display:none;margin-top:10px}
.delf-audio-player.show{display:block}
.delf-audio-player audio{width:100%}
.delf-audio-status{font-size:.76rem;font-weight:700;color:#9ca3af;margin-top:6px}

.delf-passage-box{border:1.5px solid #e0e3e8;border-radius:10px;padding:16px;background:#fafbfc;margin-top:10px;min-height:120px;outline:none;font-size:.9rem;line-height:1.7;color:#374151}
.delf-passage-box:empty:before{content:attr(data-ph);color:#b0b8c8}

.delf-question-row{border:1.5px solid #e0e3e8;border-radius:10px;padding:14px;margin-top:10px;background:#fff}
.delf-question-text{font-size:.9rem;font-weight:700;color:#0f172a;outline:none;margin-bottom:8px}
.delf-answer-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.delf-answer-opt{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;border:1.5px solid #e0e3e8;font-size:.84rem;color:#374151}
.delf-answer-opt input{accent-color:#d97706}
.delf-answer-opt span{outline:none;flex:1}
.delf-add-question{margin-top:10px;padding:8px 14px;border-radius:9px;border:1.5px dashed #d1d5db;background:transparent;color:#9ca3af;font-size:.8rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;width:100%}
.delf-add-question:hover{border-color:#d97706;color:#d97706}
.delf-remove-question{background:transparent;border:none;color:#dc2626;cursor:pointer;font-size:.72rem;font-weight:800;float:right}

.delf-prompt-box{border:1.5px solid #e0e3e8;border-radius:10px;padding:16px;background:#fafbfc;margin-top:10px;outline:none;font-size:.9rem;line-height:1.7;color:#374151;min-height:80px}
.delf-prompt-box:empty:before{content:attr(data-ph);color:#b0b8c8}
.delf-meta-row{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.delf-meta-field{flex:1;min-width:140px}
.delf-meta-field label{display:block;font-size:.7rem;font-weight:900;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.delf-meta-field input{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #e0e3e8;font-family:Inter,sans-serif;font-size:.84rem;color:#374151}

.cb-header{font-size:2rem;font-weight:800;color:#0f172a;line-height:1.2;outline:none;min-width:10px}
.cb-text{font-size:.93rem;color:#4b5563;line-height:1.7;outline:none;min-width:10px}

.settings-label{font-size:.72rem;font-weight:900;color:rgba(255,255,255,.55);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.05em}
.settings-input{width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;font-family:Inter,sans-serif;font-weight:700;font-size:.88rem;outline:none}
.settings-select{width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;font-family:Inter,sans-serif;font-weight:700;font-size:.88rem;outline:none}
.settings-select option{color:#111}
.settings-divider{height:1px;background:rgba(255,255,255,.09);margin:4px 0}
.ctrl-btn{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;font-family:Inter,sans-serif;font-weight:900;font-size:.86rem;cursor:pointer;transition:.15s}
.ctrl-btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.ctrl-btn.primary{background:rgba(217,119,6,.22);border-color:rgba(217,119,6,.45);color:#fbbf24}
.ctrl-btn.primary:hover{background:rgba(217,119,6,.32)}
.save-tick{text-align:center;color:#86efac;font-weight:900;height:22px;opacity:0;transition:.2s;font-size:1rem}
.save-tick.show{opacity:1}
.panel-heading{font-family:"Sorts Mill Goudy",serif;font-size:1.05rem;font-weight:400;color:rgba(255,255,255,.88);margin-bottom:2px}

@media(max-width:1024px){.workspace{grid-template-columns:230px 1fr 210px}}
@media(max-width:800px){.workspace{grid-template-columns:1fr;height:auto}.blocks-panel,.settings-panel{height:auto;max-height:400px}}

.assign-levels-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.assign-level-chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);cursor:pointer;font-size:.8rem;font-weight:800;color:rgba(255,255,255,.7);transition:.15s}
.assign-level-chip:hover{background:rgba(255,255,255,.13)}
.assign-level-chip.checked{background:rgba(217,119,6,.22);border-color:rgba(217,119,6,.5);color:#fff}
.assign-level-chip input{display:none}

.learner-picker-list{max-height:160px;overflow-y:auto;margin-top:6px;border-radius:10px;background:rgba(255,255,255,.04);display:none}
.learner-picker-list.show{display:block}
.learner-picker-row{padding:9px 12px;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.8);cursor:pointer;transition:.12s}
.learner-picker-row:hover{background:rgba(255,255,255,.1)}
.assign-learners-selected{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.assigned-learner-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font-size:.76rem;font-weight:700;color:#fff}
.assigned-learner-chip button{background:transparent;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:.8rem;padding:0;line-height:1}
.assigned-learner-chip button:hover{color:#fca5a5}
.ctrl-btn.publish{background:rgba(16,185,129,.2);border-color:rgba(16,185,129,.42);color:#6ee7b7}
.ctrl-btn.publish:hover{background:rgba(16,185,129,.3)}
.ctrl-btn.publish[disabled]{opacity:.45;cursor:default;transform:none}
.status-pill-wrap{display:flex;flex-direction:column;gap:5px}
.status-pill{align-self:flex-start;padding:5px 13px;border-radius:999px;font-size:.7rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.status-pill.draft{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
.status-pill.published{background:rgba(16,185,129,.2);color:#6ee7b7}
.status-note{font-size:.72rem;font-weight:600;color:rgba(255,255,255,.4);line-height:1.5}
.act-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>

<main class="page">
<section class="workspace">
<aside class="panel blocks-panel">
  <p class="panel-title">Structure</p>
  <div class="block-group">
    <button class="block-btn" data-block="sectionheader" type="button"><span class="block-icon">&sect;</span>Section Header</button>

  <div class="block-group">
    <button class="block-btn" data-block="writing" type="button">
      <span class="block-icon"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span>

    </button>

    <button class="block-btn" data-block="speaking" type="button">
      <span class="block-icon"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span>

<section class="canvas-panel">
  <div class="canvas-toolbar">
    <button class="tbtn" id="undoBtn" type="button">Undo</button>
    <button class="tbtn" id="clearBtn" type="button">Clear Canvas</button>

  <div class="canvas" id="canvas">
    <div class="canvas-empty" id="canvasEmpty">Build the mock exam by adding sections from the left.</div>
  </div>

<aside class="panel settings-panel">
  <p class="panel-heading">DELF Mock Builder</p>
  <div class="settings-divider"></div>
  <div>
    <label class="settings-label">Exam Title</label>
    <input class="settings-input" id="mockTitle" type="text" placeholder="e.g. DELF A2 Mock Exam #1">
  </div>
  <div>
    <label class="settings-label">Track</label>
    <select class="settings-select" id="mockTrack">
      <option>Tout Public</option>
      <option>Junior</option>
      <option>Prim</option>
    </select>

    <label class="settings-label">Level</label>

      <option>Absolute Beginner</option>

    <span class="status-note" id="statusNote">Not yet visible to learners.</span>

  <button class="ctrl-btn primary" id="saveBtn" type="button">Save Draft</button>
  <button class="ctrl-btn publish" id="publishBtn" type="button">Publish</button>
  <button class="ctrl-btn" id="newBtn" type="button">New Exam</button>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){
const db = firebase.firestore();
const storage = firebase.storage();
const canvas = document.getElementById("canvas");
const canvasEmpty = document.getElementById("canvasEmpty");
const titleInput = document.getElementById("mockTitle");
const trackSelect = document.getElementById("mockTrack");
const levelSelect = document.getElementById("mockLevel");
const saveTick = document.getElementById("saveTick");

const params = new URLSearchParams(location.search);
let currentId = params.get("edit") || "";
if(params.get("track")) trackSelect.value = params.get("track");

let selectedBlock = null;
let undoStack = [];

function showEmpty(){ if(!canvas.querySelector(".c-block")) canvasEmpty.style.display=""; }
function hideEmpty(){ canvasEmpty.style.display="none"; }
function allBlocks(){ return Array.from(canvas.querySelectorAll(".c-block")); }
function tick(){ saveTick.classList.add("show"); setTimeout(function(){saveTick.classList.remove("show");},1600); }
function pushUndo(){ undoStack.push(serializeBlocks()); if(undoStack.length>40) undoStack.shift(); }

function selectBlock(block){
  allBlocks().forEach(function(b){ b.classList.remove("selected"); });
  if(block){ block.classList.add("selected"); selectedBlock=block; } else { selectedBlock=null; }
}
canvas.addEventListener("click", function(e){ if(e.target===canvas||e.target===canvasEmpty) selectBlock(null); });

const assignLevelsGroup = document.getElementById("assignLevelsGroup");
if(assignLevelsGroup){
  assignLevelsGroup.addEventListener("change", function(e){
    const chip = e.target.closest(".assign-level-chip");
    if(chip) chip.classList.toggle("checked", e.target.checked);
  });
}

let allLearners = [];
let selectedLearners = [];
const learnerSearchInput = document.getElementById("learnerSearchInput");
const learnerPickerList = document.getElementById("learnerPickerList");
const assignLearnersSelected = document.getElementById("assignLearnersSelected");

async function loadLearnersList(){
  try{
    const snap = await db.collection("impactPasskeys").where("role","==","Learner").get();
    allLearners = snap.docs.map(function(d){
      return { name: d.data().name || "Unnamed", level: d.data().level || "" };
    });
  }catch(e){ console.warn("Could not load learners list:", e); }
}

function renderSelectedLearnerChips(){
  if(!assignLearnersSelected) return;
  assignLearnersSelected.innerHTML = selectedLearners.map(function(name){
    return "<span class=\"assigned-learner-chip\">" + name + "<button type=\"button\" data-remove-learner=\"" + name + "\">x</button></span>";
  }).join("");
}

if(learnerSearchInput){
  loadLearnersList();

  learnerSearchInput.addEventListener("input", function(){
    const q = learnerSearchInput.value.trim().toLowerCase();
    if(!q){ learnerPickerList.classList.remove("show"); learnerPickerList.innerHTML=""; return; }
    const matches = allLearners.filter(function(l){
      return l.name.toLowerCase().includes(q) && !selectedLearners.includes(l.name);
    });
    if(!matches.length){ learnerPickerList.classList.remove("show"); learnerPickerList.innerHTML=""; return; }
    learnerPickerList.innerHTML = matches.map(function(l){
      return "<div class=\"learner-picker-row\" data-pick-learner=\"" + l.name + "\">" + l.name + " <span style=\"opacity:.5\">(" + (l.level||"no level") + ")</span></div>";
    }).join("");
    learnerPickerList.classList.add("show");
  });

  learnerPickerList.addEventListener("click", function(e){
    const row = e.target.closest("[data-pick-learner]");
    if(!row) return;
    const name = row.dataset.pickLearner;
    if(!selectedLearners.includes(name)) selectedLearners.push(name);
    renderSelectedLearnerChips();
    learnerSearchInput.value = "";
    learnerPickerList.classList.remove("show");
    learnerPickerList.innerHTML = "";
  });

  assignLearnersSelected.addEventListener("click", function(e){
    const btn = e.target.closest("[data-remove-learner]");
    if(!btn) return;
    selectedLearners = selectedLearners.filter(function(n){ return n !== btn.dataset.removeLearner; });
    renderSelectedLearnerChips();
  });
}

function questionRowHtml(qid, data){
  const opts = (data && data.options) ? data.options : ["Option A","Option B","Option C","Option D"];
  const correctIdx = data && typeof data.correct === "number" ? data.correct : 0;
  let optsHtml = "";
  opts.forEach(function(o, i){
    optsHtml += '<label class="delf-answer-opt"><input type="radio" name="correct_' + qid + '" data-qid="' + qid + '" data-optidx="' + i + '"' + (i===correctIdx?" checked":"") + '><span contenteditable="true">' + o + '</span></label>';
  });
  const questionText = (data && data.question) ? data.question : "";
  return '<div class="delf-question-row" data-qid="' + qid + '">' +
    '<button type="button" class="delf-remove-question" data-qid="' + qid + '">Remove</button>' +
    '<div class="delf-question-text" contenteditable="true" data-ph="Type the question here...">' + questionText + '</div>' +
    '<div class="delf-answer-options">' + optsHtml + '</div>' +
  '</div>';
}

const TEMPLATES = {
  sectionheader: { render: function(data){
    const title = (data && data.title) ? data.title : "Comprehension Orale";
    const points = (data && data.points) ? data.points : "25 points";
    return '<div class="delf-section-header">' +
      '<div class="delf-section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/></svg></div>' +

function createBlock(type, data){
  const tmpl = TEMPLATES[type];
  if(!tmpl) return null;
  const block = document.createElement("div");
  block.className = "c-block";
  block.setAttribute("data-type", type);
  const actions = document.createElement("div");
  actions.className = "block-actions";
  actions.innerHTML = '<button class="act-btn danger" data-act="del" title="Delete block"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>';
  const inner = document.createElement("div");
  inner.className = "c-block-inner";
  inner.innerHTML = tmpl.render(data);
  block.appendChild(actions);
  block.appendChild(inner);
  bindBlock(block);
  return block;
}

function bindBlock(block){
  block.addEventListener("click", function(e){
    if(e.target.closest(".block-actions")) return;
    e.stopPropagation();
    selectBlock(block);
  });

  block.querySelector(".block-actions").addEventListener("click", function(e){
    e.stopPropagation();
    const btn = e.target.closest("[data-act]"); if(!btn) return;
    const act = btn.dataset.act;
    if(act==="del"){ pushUndo(); block.remove(); selectedBlock=null; showEmpty(); }
    if(act==="up"){ pushUndo(); const p=block.previousElementSibling; if(p&&p.classList.contains("c-block")) canvas.insertBefore(block,p); }
    if(act==="down"){ pushUndo(); const n=block.nextElementSibling; if(n&&n.classList.contains("c-block")) canvas.insertBefore(n,block); }
    if(act==="dupe"){ pushUndo(); const d=createBlock(block.dataset.type, extractData(block)); block.after(d); selectBlock(d); }
  });

  const audioZone = block.querySelector(".delf-audio-zone");
  const audioInput = block.querySelector(".delf-audio-input");
  const audioPlayer = block.querySelector(".delf-audio-player");
  const audioStatus = block.querySelector(".delf-audio-status");

  if(audioZone && audioInput){
    audioZone.addEventListener("click", function(e){ e.stopPropagation(); audioInput.click(); });
    audioInput.addEventListener("click", function(e){ e.stopPropagation(); });
    audioInput.addEventListener("change", async function(e){
      e.stopPropagation();
      const file = audioInput.files[0];
      if(!file) return;
      audioStatus.textContent = "Uploading...";
      try{
        const ext = file.name.split(".").pop() || "mp3";
        const path = "delfAudio/" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + "." + ext;
        const snap = await storage.ref(path).put(file);
        const url = await snap.ref.getDownloadURL();
        block.dataset.audioSrc = url;
        audioPlayer.innerHTML = '<audio src="' + url + '" controls></audio>';
        audioPlayer.classList.add("show");
        audioZone.style.display = "none";
        audioStatus.textContent = "";
      }catch(err){
        audioStatus.textContent = "Upload failed: " + err.message;
      }
    });
  }

  const addQBtn = block.querySelector(".delf-add-question");
  if(addQBtn){
    addQBtn.addEventListener("click", function(e){
      e.stopPropagation();
      pushUndo();
      const wrap = block.querySelector(".delf-questions-wrap");
      const qid = "q"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
      const div = document.createElement("div");
      div.innerHTML = questionRowHtml(qid, {question:"",options:["Option A","Option B","Option C","Option D"],correct:0});
      wrap.appendChild(div.firstElementChild);
    });
  }
  const qWrap = block.querySelector(".delf-questions-wrap");
  if(qWrap){
    qWrap.addEventListener("click", function(e){
      const rmBtn = e.target.closest(".delf-remove-question");
      if(rmBtn){
        e.stopPropagation();
        pushUndo();
        rmBtn.closest(".delf-question-row").remove();
      }
    });
  }
}

document.querySelectorAll(".block-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    pushUndo();
    hideEmpty();
    const block = createBlock(btn.dataset.block);
    if(!block) return;
    if(selectedBlock && canvas.contains(selectedBlock)) selectedBlock.after(block);
    else canvas.appendChild(block);
    selectBlock(block);
    block.scrollIntoView({behavior:"smooth",block:"nearest"});
  });
});

document.getElementById("undoBtn").addEventListener("click", function(){
  if(!undoStack.length) return;
  rebuildFromBlocks(undoStack.pop());
});
document.getElementById("clearBtn").addEventListener("click", function(){
  if(!confirm("Clear the entire exam canvas?")) return;
  pushUndo();
  allBlocks().forEach(function(b){ b.remove(); });
  selectedBlock = null;
  showEmpty();
});

function extractData(block){
  const type = block.dataset.type;
  const data = { type: type };

  if(type==="sectionheader"){
    data.title = block.querySelector(".delf-section-title").innerHTML;
    data.points = block.querySelector(".delf-section-points").innerHTML;
  }
  if(type==="header"||type==="text"){
    data.content = block.querySelector("[contenteditable]").innerHTML;
  }
  if(type==="listening"||type==="reading"){
    const questions = Array.from(block.querySelectorAll(".delf-question-row")).map(function(row){
      const question = row.querySelector(".delf-question-text").innerHTML;
      const opts = Array.from(row.querySelectorAll(".delf-answer-opt"));
      const options = opts.map(function(o){ return o.querySelector("span").innerHTML; });
      let correct = 0;
      opts.forEach(function(o, i){ if(o.querySelector("input").checked) correct = i; });
      return { question: question, options: options, correct: correct };
    });
    data.questions = questions;
    if(type==="listening") data.audioSrc = block.dataset.audioSrc || "";
    if(type==="reading") data.passage = block.querySelector(".delf-passage-box").innerHTML;
  }
  if(type==="writing"){
    data.prompt = block.querySelector(".delf-prompt-box").innerHTML;
    data.wordCount = block.querySelector(".delf-wordcount").value;
    data.timeLimit = block.querySelector(".delf-timelimit").value;
  }
  if(type==="speaking"){
    data.prompt = block.querySelector(".delf-prompt-box").innerHTML;
    data.prepTime = block.querySelector(".delf-preptime").value;
    data.speakTime = block.querySelector(".delf-speaktime").value;
  }
  return data;
}

function serializeBlocks(){ return allBlocks().map(extractData); }

function rebuildFromBlocks(blocks){
  allBlocks().forEach(function(b){ b.remove(); });
  selectedBlock = null;
  if(!blocks || !blocks.length){ showEmpty(); return; }
  hideEmpty();
  blocks.forEach(function(data){
    const block = createBlock(data.type, data);
    if(!block) return;
    canvas.appendChild(block);
    if(data.type==="header"||data.type==="text"){
      const ce = block.querySelector("[contenteditable]");
      if(ce && data.content) ce.innerHTML = data.content;
    }
    if(data.type==="listening" && data.audioSrc){
      block.dataset.audioSrc = data.audioSrc;
    }
  });
}

async function save(){
  try{
    const blocks = serializeBlocks();
    const assignedLevels = Array.from(document.querySelectorAll("#assignLevelsGroup input:checked")).map(function(c){ return c.value; });
    const payload = {
      createdByTeacher: (sessionStorage.getItem("impactAccessName") || sessionStorage.getItem("impactPersonnelName") || ""),
      title: titleInput.value.trim() || "Untitled Mock Exam",
      track: trackSelect.value,
      level: levelSelect.value,
      blocks: blocks,
      version: 1,
      updatedAt: new Date().toISOString()
    };
    if(!currentId){ payload.status = "draft"; }
    if(currentId){
      await db.collection("delfMocks").doc(currentId).set(payload, {merge:true});
    } else {
      const ref = await db.collection("delfMocks").add(payload);
      currentId = ref.id;
      history.replaceState(null,"","/teacher/delf-mock-builder.html?edit="+currentId);
    }
    tick();
    return currentId;
  }catch(err){
    console.error("Save failed:", err);
    alert("Save failed: " + err.message);
    return null;
  }
}

document.getElementById("saveBtn").addEventListener("click", async function(e){ e.preventDefault(); await save(); });
document.getElementById("newBtn").addEventListener("click", function(e){
  e.preventDefault();
  currentId="";
  titleInput.value="";
  levelSelect.value="Absolute Beginner";
  allBlocks().forEach(function(b){ b.remove(); });
  selectedBlock=null;
  showEmpty();
  history.replaceState(null,"","/teacher/delf-mock-builder.html");
});
document.getElementById("viewBtn").addEventListener("click", async function(e){
  e.preventDefault();
  if(!titleInput.value.trim()){
    titleInput.focus(); titleInput.style.border="1.5px solid #f87171";
    setTimeout(function(){titleInput.style.border="";},2000);
    return;
  }
  const id = await save();
  if(id) window.open("/teacher/delf-mock-view.html?id="+encodeURIComponent(id),"_blank");
});

let autoSaveTimer = null;
function scheduleAutoSave(){
  const hasTitle = titleInput.value.trim().length > 0;
  const hasBlocks = allBlocks().length > 0;
  if(!hasTitle || !hasBlocks) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(async function(){ await save(); }, 1500);
}
titleInput.addEventListener("input", scheduleAutoSave);
trackSelect.addEventListener("change", scheduleAutoSave);
levelSelect.addEventListener("change", scheduleAutoSave);
new MutationObserver(function(){ scheduleAutoSave(); }).observe(canvas, {childList:true,subtree:false});

async function load(){
  if(!currentId) return;
  const doc = await db.collection("delfMocks").doc(currentId).get();
  if(!doc.exists) return;
  const d = doc.data();
  titleInput.value = d.title || "";
  if(d.track) trackSelect.value = d.track;
  if(d.level) levelSelect.value = d.level;
  if(Array.isArray(d.assignedLevels)){
    d.assignedLevels.forEach(function(lvl){
      const cb = document.querySelector('#assignLevelsGroup input[value="' + lvl + '"]');
      if(cb){ cb.checked = true; cb.closest(".assign-level-chip").classList.add("checked"); }
    });
  }
  if(Array.isArray(d.assignedLearners)){
    selectedLearners = d.assignedLearners.slice();
    renderSelectedLearnerChips();
  }
  currentStatus = d.status || "draft";
  renderStatus();
  if(Array.isArray(d.blocks)) rebuildFromBlocks(d.blocks);
}

// ---- PUBLISH ----
let currentStatus = "draft";

function renderStatus(){
  const pill = document.getElementById("statusPill");
  const note = document.getElementById("statusNote");
  const pubBtn = document.getElementById("publishBtn");
  if(!pill || !pubBtn) return;
  if(currentStatus === "published"){
    pill.textContent = "Published";
    pill.className = "status-pill published";
    note.textContent = "Live. Share it with learners from the list page.";
    pubBtn.disabled = true;
    pubBtn.textContent = "Published";
  }else{
    pill.textContent = "Draft";
    pill.className = "status-pill draft";
    note.textContent = "Not yet visible to learners.";
    pubBtn.disabled = false;
    pubBtn.textContent = "Publish";
  }
}

const _pubBtn = document.getElementById("publishBtn");
if(_pubBtn){
  _pubBtn.addEventListener("click", async function(e){
    e.preventDefault();
    if(!titleInput.value.trim()){
      titleInput.focus();
      titleInput.style.border = "1.5px solid #f87171";
      setTimeout(function(){ titleInput.style.border = ""; }, 2000);
      return;
    }
    if(!allBlocks().length){ alert("Add at least one block before publishing."); return; }
    if(!confirm("Publish this DELF mock? Once published, editing or deleting it will require your passkey and be logged.")) return;

    const id = await save();
    if(!id) return;

    const who = sessionStorage.getItem("impactAccessName") || sessionStorage.getItem("impactPersonnelName") || "";
    await db.collection("delfMocks").doc(id).set({
      status: "published",
      publishedAt: new Date().toISOString(),
      publishedBy: who
    }, { merge:true });

    currentStatus = "published";
    renderStatus();

    if(window.ImpactPublish){
      window.ImpactPublish.logAction({
        action: "publish",
        itemType: "delfMock",
        itemId: id,
        itemTitle: titleInput.value.trim(),
        performedBy: who
      });
    }
    tick();
  });
}

window.addEventListener("load", function(){
  if(window.ImpactTextToolbar) window.ImpactTextToolbar.attach("#canvas");
  else console.warn("ImpactTextToolbar failed to load");
});
renderStatus();

load();
});
