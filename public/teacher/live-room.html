<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Live Room | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/live-classroom.css">
<style>
/* INVITE PANEL */
.invite-panel{
  position:fixed;
  top:64px;
  right:16px;
  width:min(320px,90vw);
  background:rgba(10,14,28,.96);
  border:1px solid rgba(255,255,255,.16);
  border-radius:20px;
  padding:20px;
  z-index:500;
  backdrop-filter:blur(20px);
  box-shadow:0 24px 70px rgba(0,0,0,.5);
  display:none;
  animation:slideDown .2s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.invite-panel.show{display:block}
.invite-panel h3{font-family:"Sorts Mill Goudy",serif;font-size:1.2rem;font-weight:400;margin-bottom:14px;color:#fff}
.invite-row{display:flex;gap:8px;margin-bottom:12px}
.invite-field{flex:1;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;font-family:Inter,sans-serif;font-weight:800;font-size:.82rem;outline:none;letter-spacing:.06em}
.invite-copy-btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(99,179,237,.4);background:rgba(99,179,237,.15);color:#90cdf4;font-family:Inter,sans-serif;font-weight:900;font-size:.78rem;cursor:pointer;white-space:nowrap;transition:.15s}
.invite-copy-btn:hover{background:rgba(99,179,237,.28)}
.invite-link-row{display:flex;gap:8px;margin-bottom:6px}
.invite-link-field{flex:1;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);font-family:Inter,sans-serif;font-size:.74rem;font-weight:700;outline:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.invite-note{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.35);line-height:1.5}
.invite-close{position:absolute;top:12px;right:14px;background:transparent;border:none;color:rgba(255,255,255,.4);font-size:1.1rem;cursor:pointer;line-height:1;padding:2px 6px}
.invite-close:hover{color:#fff}
</style>
</head>
<body style="overflow:hidden">

<header class="room-header">
  <div class="room-title" id="roomTitle">Impact Live Class</div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="room-id-badge" id="roomIdBadge" title="Click to copy Meeting ID">...</span>
    <div class="room-status">
      <span class="status-dot connecting" id="statusDot"></span>
      <span id="statusText">Connecting</span>
    </div>
  </div>
</header>

<div class="video-grid p1" id="videoGrid"></div>

<!-- INVITE PANEL -->
<div class="invite-panel" id="invitePanel">
  <button class="invite-close" id="inviteClose" type="button">✕</button>
  <h3>Invite Participants</h3>
  <p class="invite-note" style="margin-bottom:12px">Share the Meeting ID or the link below.</p>
  <div class="invite-row">
    <input class="invite-field" id="inviteIdField" readonly>
    <button class="invite-copy-btn" id="copyIdBtn" type="button">Copy ID</button>
  </div>
  <div class="invite-link-row">
    <input class="invite-link-field" id="inviteLinkField" readonly>
    <button class="invite-copy-btn" id="copyLinkBtn" type="button">Copy Link</button>
  </div>
  <p class="invite-note">Participants open the link and enter their name to join.</p>
</div>

<div class="controls">
  <button class="ctrl-btn ctrl-btn-cam" id="camBtn" type="button" title="Toggle Camera">
    <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    <span>Camera</span>
  </button>
  <button class="ctrl-btn ctrl-btn-mic" id="micBtn" type="button" title="Toggle Mic">
    <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    <span>Mic</span>
  </button>
  <div class="ctrl-separator"></div>
  <button class="ctrl-btn ctrl-btn-screen" id="screenBtn" type="button" title="Share Screen">
    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    <span>Screen</span>
  </button>
  <button class="ctrl-btn" id="inviteBtn" type="button" title="Invite / Share" style="background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.35);color:#c4b5fd">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    <span>Invite</span>
  </button>
  <div class="ctrl-separator" id="recSep"></div>
  <button class="ctrl-btn ctrl-btn-rec" id="recBtn" type="button" title="Record" style="display:none">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
    <span id="recLabel">Record</span>
  </button>
  <div class="ctrl-separator"></div>
  <button class="ctrl-btn ctrl-btn-leave" id="leaveBtn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Leave
  </button>
</div>

<div class="lc-toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script>
(async function(){
"use strict";

const params     = new URLSearchParams(location.search);
const MEETING_ID = params.get("id")   || "";
const MY_NAME    = decodeURIComponent(params.get("name") || "Guest");
const IS_HOST    = params.get("host") === "true";
const MY_ID      = "p_" + Math.random().toString(36).slice(2,10);

if(!MEETING_ID){ location.href="/teacher/live-classroom.html"; return; }

const db      = firebase.firestore();
const storage = firebase.storage();

const ICE_CONFIG = {
  iceServers:[
    { urls:"stun:stun.l.google.com:19302" },
    { urls:"stun:stun1.l.google.com:19302" },
    { urls:"stun:stun2.l.google.com:19302" },
    { urls:"stun:stun.services.mozilla.com" }
  ]
};

let localStream   = null;
let screenStream  = null;
let camOn         = true;
let micOn         = true;
let screenOn      = false;
let recording     = false;
let mediaRecorder = null;
let recordChunks  = [];
const peers       = {};
const remoteStreams= {};
let unsubscribers = [];
let meetingTitle  = "Impact Live Class";
let startTime     = Date.now();

const videoGrid  = document.getElementById("videoGrid");
const roomTitle  = document.getElementById("roomTitle");
const roomIdBadge= document.getElementById("roomIdBadge");
const statusDot  = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

function toast(msg, dur=3000){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),dur);
}
function setStatus(text,connecting=false){
  statusText.textContent=text;
  statusDot.className="status-dot"+(connecting?" connecting":"");
}
function updateGrid(){
  const c=videoGrid.children.length;
  videoGrid.className="video-grid p"+Math.min(c,10);
}
function createTile(id,name,stream,isLocal=false){
  if(document.getElementById("tile-"+id)) return;
  const tile=document.createElement("div");
  tile.className="video-tile";tile.id="tile-"+id;
  const video=document.createElement("video");
  video.autoplay=true;video.playsInline=true;video.muted=isLocal;
  if(stream) video.srcObject=stream;
  const label=document.createElement("div");
  label.className="tile-label";
  label.textContent=isLocal?MY_NAME+" (You)":name;
  const mutedBadge=document.createElement("div");
  mutedBadge.className="tile-muted";mutedBadge.id="muted-"+id;mutedBadge.textContent="🔇";
  const camOff=document.createElement("div");
  camOff.className="tile-cam-off";camOff.id="camoff-"+id;
  const avatar=document.createElement("div");avatar.className="avatar";
  avatar.textContent=(name||"?")[0].toUpperCase();
  const camName=document.createElement("div");camName.className="cam-name";
  camName.textContent=isLocal?MY_NAME+" (You)":name;
  camOff.appendChild(avatar);camOff.appendChild(camName);
  tile.appendChild(video);tile.appendChild(label);
  tile.appendChild(mutedBadge);tile.appendChild(camOff);
  videoGrid.appendChild(tile);updateGrid();
}
function removeTile(id){
  const t=document.getElementById("tile-"+id);if(t)t.remove();updateGrid();
}
function setTileStream(id,stream){
  const t=document.getElementById("tile-"+id);if(!t)return;
  const v=t.querySelector("video");if(v)v.srcObject=stream;
}
function setTileCamOff(id,off){
  const el=document.getElementById("camoff-"+id);if(el)el.classList.toggle("show",off);
  const t=document.getElementById("tile-"+id);
  if(t){const v=t.querySelector("video");if(v)v.style.visibility=off?"hidden":"visible";}
}

async function getLocalStream(){
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:24}},
      audio:{echoCancellation:true,noiseSuppression:true}
    });
    createTile(MY_ID,MY_NAME,localStream,true);
    return true;
  }catch(e){
    toast("⚠️ Camera/mic access denied.");
    createTile(MY_ID,MY_NAME,null,true);
    setTileCamOff(MY_ID,true);
    camOn=false;micOn=false;
    return false;
  }
}

async function registerParticipant(){
  await db.collection("meetings").doc(MEETING_ID)
    .collection("participants").doc(MY_ID).set({
      participantId:MY_ID,displayName:MY_NAME,isHost:IS_HOST,
      cameraEnabled:camOn,micEnabled:micOn,joinedAt:new Date().toISOString()
    });
  window.addEventListener("beforeunload",cleanup);
}

// ── HOST: connect to each participant ────────────────────────
function hostListenForParticipants(){
  const unsub=db.collection("meetings").doc(MEETING_ID)
    .collection("participants").onSnapshot(snap=>{
      snap.docChanges().forEach(async change=>{
        const p=change.doc.data();
        if(p.participantId===MY_ID) return;
        if(change.type==="added"){ toast(p.displayName+" joined"); await hostConnect(p.participantId,p.displayName); }
        if(change.type==="removed"){ toast(p.displayName+" left"); closePeer(p.participantId); removeTile(p.participantId); }
      });
    });
  unsubscribers.push(unsub);
}

async function hostConnect(pid,pname){
  if(peers[pid]) return;
  const pc=new RTCPeerConnection(ICE_CONFIG);peers[pid]=pc;
  if(localStream) localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  const rs=new MediaStream();remoteStreams[pid]=rs;
  createTile(pid,pname,rs);
  pc.ontrack=e=>{ e.streams[0].getTracks().forEach(t=>rs.addTrack(t)); setTileStream(pid,rs); };
  pc.onicecandidate=e=>{ if(!e.candidate) return;
    db.collection("meetings").doc(MEETING_ID).collection("signals").doc(pid)
      .collection("host-ice").add({candidate:e.candidate.toJSON(),ts:Date.now()});
  };
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==="connected") setStatus("Live · "+Object.keys(peers).length+" participant(s)");
    if(pc.connectionState==="failed") toast("⚠️ Connection to "+pname+" failed.");
  };
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  await db.collection("meetings").doc(MEETING_ID).collection("signals").doc(pid)
    .set({offer:{type:offer.type,sdp:offer.sdp},answer:null});
  const u1=db.collection("meetings").doc(MEETING_ID).collection("signals").doc(pid)
    .onSnapshot(async snap=>{
      const d=snap.data();
      if(d&&d.answer&&!pc.currentRemoteDescription)
        await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
    });
  const u2=db.collection("meetings").doc(MEETING_ID).collection("signals").doc(pid)
    .collection("participant-ice").orderBy("ts").onSnapshot(snap=>{
      snap.docChanges().forEach(async c=>{
        if(c.type==="added") try{ await pc.addIceCandidate(new RTCIceCandidate(c.doc.data().candidate)); }catch(e){}
      });
    });
  unsubscribers.push(u1,u2);
}

// ── PARTICIPANT: receive offer from host ─────────────────────
function participantListenForOffer(){
  const u=db.collection("meetings").doc(MEETING_ID).collection("signals").doc(MY_ID)
    .onSnapshot(async snap=>{
      const d=snap.data();
      if(!d||!d.offer||peers[MEETING_ID]) return;
      const pc=new RTCPeerConnection(ICE_CONFIG);peers[MEETING_ID]=pc;
      if(localStream) localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
      const rs=new MediaStream();remoteStreams["host"]=rs;
      pc.ontrack=e=>{ e.streams[0].getTracks().forEach(t=>rs.addTrack(t)); setTileStream("host",rs); };
      pc.onicecandidate=e=>{ if(!e.candidate) return;
        db.collection("meetings").doc(MEETING_ID).collection("signals").doc(MY_ID)
          .collection("participant-ice").add({candidate:e.candidate.toJSON(),ts:Date.now()});
      };
      pc.onconnectionstatechange=()=>{
        if(pc.connectionState==="connected"){ setStatus("Live"); setTileStream("host",rs); }
      };
      await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
      const answer=await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await db.collection("meetings").doc(MEETING_ID).collection("signals").doc(MY_ID)
        .update({answer:{type:answer.type,sdp:answer.sdp}});
      const u2=db.collection("meetings").doc(MEETING_ID).collection("signals").doc(MY_ID)
        .collection("host-ice").orderBy("ts").onSnapshot(snap=>{
          snap.docChanges().forEach(async c=>{
            if(c.type==="added") try{ await pc.addIceCandidate(new RTCIceCandidate(c.doc.data().candidate)); }catch(e){}
          });
        });
      unsubscribers.push(u2);
    });
  unsubscribers.push(u);
}

function participantListenForOthers(){
  const u=db.collection("meetings").doc(MEETING_ID).collection("participants")
    .onSnapshot(snap=>{
      snap.docChanges().forEach(c=>{
        const p=c.doc.data();if(p.participantId===MY_ID) return;
        if(c.type==="added"&&p.isHost&&!document.getElementById("tile-host"))
          createTile("host",p.displayName+" (Host)",null);
        if(c.type==="removed"&&p.isHost){ toast("Host ended the meeting."); cleanup(); location.href="/teacher/live-classroom.html"; }
      });
    });
  unsubscribers.push(u);
}

// ── CONTROLS ─────────────────────────────────────────────────
document.getElementById("camBtn").onclick=function(){
  if(!localStream) return;
  camOn=!camOn;
  localStream.getVideoTracks().forEach(t=>t.enabled=camOn);
  this.classList.toggle("off",!camOn);
  setTileCamOff(MY_ID,!camOn);
  this.querySelector("span").textContent=camOn?"Camera":"Cam Off";
  updateState();
};

document.getElementById("micBtn").onclick=function(){
  if(!localStream) return;
  micOn=!micOn;
  localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
  this.classList.toggle("off",!micOn);
  const m=document.getElementById("muted-"+MY_ID);if(m)m.classList.toggle("show",!micOn);
  this.querySelector("span").textContent=micOn?"Mic":"Muted";
  updateState();
};

document.getElementById("screenBtn").onclick=async function(){
  if(!screenOn){
    try{
      screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
      screenOn=true;this.classList.add("active");
      this.querySelector("span").textContent="Sharing";
      toast("Screen sharing started");
      const st=screenStream.getVideoTracks()[0];
      Object.values(peers).forEach(pc=>{
        const s=pc.getSenders().find(s=>s.track&&s.track.kind==="video");
        if(s)s.replaceTrack(st);
      });
      const lv=document.querySelector("#tile-"+MY_ID+" video");
      if(lv)lv.srcObject=screenStream;
      st.onended=()=>stopScreen();
    }catch(e){ toast("Screen share cancelled."); }
  }else{ stopScreen(); }
};

function stopScreen(){
  if(!screenOn)return;screenOn=false;
  const sb=document.getElementById("screenBtn");
  sb.classList.remove("active");sb.querySelector("span").textContent="Screen";
  if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;}
  if(localStream){
    const ct=localStream.getVideoTracks()[0];
    Object.values(peers).forEach(pc=>{
      const s=pc.getSenders().find(s=>s.track&&s.track.kind==="video");
      if(s&&ct)s.replaceTrack(ct);
    });
    const lv=document.querySelector("#tile-"+MY_ID+" video");
    if(lv)lv.srcObject=localStream;
  }
  toast("Screen sharing stopped");
}

// ── INVITE PANEL ─────────────────────────────────────────────
document.getElementById("inviteBtn").onclick=function(){
  const panel=document.getElementById("invitePanel");
  panel.classList.toggle("show");
};
document.getElementById("inviteClose").onclick=function(){
  document.getElementById("invitePanel").classList.remove("show");
};
document.getElementById("copyIdBtn").onclick=function(){
  navigator.clipboard.writeText(MEETING_ID).catch(()=>{});
  toast("Meeting ID copied!");
};
document.getElementById("copyLinkBtn").onclick=function(){
  const link=`${location.origin}/teacher/live-classroom.html?join=${MEETING_ID}`;
  navigator.clipboard.writeText(link).catch(()=>{});
  toast("Invite link copied!");
};

// ── RECORDING ────────────────────────────────────────────────
function setupRecording(){
  const btn=document.getElementById("recBtn");
  btn.style.display="flex";
  btn.onclick=function(){ recording?stopRecording():startRecording(); };
}

function startRecording(){
  recordChunks=[];
  const mimeType=
    MediaRecorder.isTypeSupported("video/webm;codecs=vp9")?"video/webm;codecs=vp9":
    MediaRecorder.isTypeSupported("video/webm")?"video/webm":"video/mp4";

  const canvas=document.createElement("canvas");
  canvas.width=1280;canvas.height=720;
  const ctx=canvas.getContext("2d");
  const cols=Math.min(Object.keys(peers).length+1,3)||1;
  const rows=Math.ceil((Object.keys(peers).length+1)/cols);
  const tw=canvas.width/cols;const th=canvas.height/rows;

  const drawInterval=setInterval(()=>{
    ctx.fillStyle="#0a0c14";ctx.fillRect(0,0,canvas.width,canvas.height);
    Array.from(videoGrid.querySelectorAll("video")).filter(v=>v.srcObject).forEach((v,i)=>{
      const col=i%cols;const row=Math.floor(i/cols);
      try{ctx.drawImage(v,col*tw+2,row*th+2,tw-4,th-4);}catch(e){}
    });
  },1000/24);

  const cs=canvas.captureStream(24);

  if(localStream){
    try{
      const ac=new AudioContext();
      const dest=ac.createMediaStreamDestination();
      ac.createMediaStreamSource(localStream).connect(dest);
      Object.values(remoteStreams).forEach(rs=>{
        try{ac.createMediaStreamSource(rs).connect(dest);}catch(e){}
      });
      if(dest.stream.getAudioTracks().length) cs.addTrack(dest.stream.getAudioTracks()[0]);
    }catch(e){}
  }

  try{ mediaRecorder=new MediaRecorder(cs,{mimeType,videoBitsPerSecond:2500000}); }
  catch(e){ mediaRecorder=new MediaRecorder(cs); }

  mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordChunks.push(e.data);};
  mediaRecorder.onstop=async()=>{
    clearInterval(drawInterval);
    await uploadRecording(mimeType);
  };
  mediaRecorder.start(1000);
  recording=true;
  document.getElementById("recBtn").classList.add("recording");
  document.getElementById("recLabel").textContent="Stop Rec";
  toast("🔴 Recording started");
}

function stopRecording(){
  if(mediaRecorder&&recording){
    mediaRecorder.stop();recording=false;
    document.getElementById("recBtn").classList.remove("recording");
    document.getElementById("recLabel").textContent="Uploading...";
    document.getElementById("recBtn").disabled=true;
    toast("Recording stopped — uploading...",5000);
  }
}

async function uploadRecording(mimeType){
  try{
    const ext=mimeType.includes("mp4")?"mp4":"webm";
    const blob=new Blob(recordChunks,{type:mimeType});
    const path=`recordings/${MEETING_ID}/recording_${Date.now()}.${ext}`;
    const ref=storage.ref(path);
    const snap=await ref.put(blob);
    const url=await snap.ref.getDownloadURL();
    const dur=Math.round((Date.now()-startTime)/1000);
    const recId="rec_"+Date.now();
    await db.collection("recordings").doc(recId).set({
      recordingId:recId,meetingId:MEETING_ID,meetingTitle,
      storagePath:path,downloadURL:url,duration:dur,mimeType,
      createdAt:new Date().toISOString(),recordedBy:MY_NAME
    });
    // Update meeting with recording ref
    await db.collection("meetings").doc(MEETING_ID).update({
      hasRecording:true,lastRecordingId:recId
    }).catch(()=>{});
    document.getElementById("recLabel").textContent="Record";
    document.getElementById("recBtn").disabled=false;
    toast("✅ Recording saved!",4000);
  }catch(e){
    console.error("Upload failed:",e);
    document.getElementById("recLabel").textContent="Record";
    document.getElementById("recBtn").disabled=false;
    toast("⚠️ Upload failed: "+e.message,5000);
  }
}

function updateState(){
  db.collection("meetings").doc(MEETING_ID).collection("participants").doc(MY_ID)
    .update({cameraEnabled:camOn,micEnabled:micOn}).catch(()=>{});
}

// ── LEAVE ────────────────────────────────────────────────────
document.getElementById("leaveBtn").onclick=async function(){
  if(recording) stopRecording();
  const dur=Math.round((Date.now()-startTime)/1000);
  // Write usage data
  await db.collection("meetings").doc(MEETING_ID).update({
    endedAt:new Date().toISOString(),
    status: IS_HOST?"ended":"participant-left",
    durationSeconds:dur,
    participantCount:Object.keys(peers).length+1
  }).catch(()=>{});
  cleanup();
  location.href="/teacher/live-classroom.html";
};

function cleanup(){
  unsubscribers.forEach(u=>u&&u());
  Object.values(peers).forEach(pc=>{try{pc.close();}catch(e){}});
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  if(screenStream) screenStream.getTracks().forEach(t=>t.stop());
  db.collection("meetings").doc(MEETING_ID)
    .collection("participants").doc(MY_ID).delete().catch(()=>{});
}
function closePeer(id){
  if(peers[id]){try{peers[id].close();}catch(e){} delete peers[id];}
  delete remoteStreams[id];
}

// ── INIT ─────────────────────────────────────────────────────
async function init(){
  setStatus("Connecting",true);
  const ms=await db.collection("meetings").doc(MEETING_ID).get();
  if(!ms.exists||ms.data().status==="ended"){
    toast("Meeting not found or has ended.");
    setTimeout(()=>location.href="/teacher/live-classroom.html",2000);
    return;
  }
  const md=ms.data();
  meetingTitle=md.title||"Impact Live Class";
  roomTitle.textContent=meetingTitle;
  document.title=meetingTitle+" | Impact";
  roomIdBadge.textContent=MEETING_ID;
  roomIdBadge.onclick=()=>{
    navigator.clipboard.writeText(MEETING_ID).catch(()=>{});
    toast("Meeting ID copied!");
  };
  // Populate invite panel
  document.getElementById("inviteIdField").value=MEETING_ID;
  document.getElementById("inviteLinkField").value=
    `${location.origin}/teacher/live-classroom.html?join=${MEETING_ID}`;

  await getLocalStream();
  await registerParticipant();

  if(IS_HOST){
    setupRecording();
    hostListenForParticipants();
    setStatus("Waiting for participants...",true);
  }else{
    const ps=await db.collection("meetings").doc(MEETING_ID).collection("participants").get();
    const hd=ps.docs.find(d=>d.data().isHost);
    if(hd) createTile("host",hd.data().displayName+" (Host)",null);
    participantListenForOffer();
    participantListenForOthers();
    setStatus("Joining...",true);
  }

  // Log join for data centre
  await db.collection("classroomUsage").add({
    meetingId:MEETING_ID,meetingTitle,participantName:MY_NAME,
    isHost:IS_HOST,joinedAt:new Date().toISOString(),date:new Date().toDateString()
  }).catch(()=>{});
}

init();
})();
</script>
