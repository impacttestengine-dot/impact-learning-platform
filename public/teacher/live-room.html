<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Live Class | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/live-classroom.css">
</head>
<body style="overflow:hidden">

<div class="room-shell">

  <header class="room-header">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <div class="room-title" id="roomTitle">Impact Live Class</div>
      <span class="room-id-badge" id="roomIdBadge">...</span>
    </div>
    <div class="header-right">
      <div class="room-status">
        <span class="status-dot connecting" id="statusDot"></span>
        <span id="statusText">Connecting</span>
      </div>
    </div>
  </header>

  <div class="room-body">
    <div class="video-stage">
      <div class="video-grid p1" id="videoGrid"></div>
    </div>

    <aside class="room-sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>People (<span id="peopleCount">1</span>)</h3>
        <button class="sidebar-close" id="sidebarClose" type="button">✕</button>
      </div>
      <div class="sidebar-body" id="participantList"></div>
    </aside>
  </div>

  <div class="room-controls">
    <div class="controls-left">
      <span class="elapsed-time" id="elapsedTime">00:00</span>
    </div>

    <div class="controls-center">
      <button class="ctrl-btn ctrl-btn-round" id="micBtn" type="button" title="Mute/Unmute">
        <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="ctrl-btn ctrl-btn-round" id="camBtn" type="button" title="Camera on/off">
        <svg id="camIcon" viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button class="ctrl-btn ctrl-btn-screen" id="screenBtn" type="button" title="Share screen">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
      <button class="ctrl-btn ctrl-btn-rec" id="recBtn" type="button" title="Record" style="display:none">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      </button>
      <button class="ctrl-btn ctrl-btn-round" id="inviteBtn" type="button" title="Invite">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
      <button class="ctrl-btn ctrl-btn-people" id="peopleBtn" type="button" title="Participants">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="ctrl-badge" id="peopleBadge">1</span>
      </button>
    </div>

    <div class="controls-right">
      <button class="ctrl-btn ctrl-btn-leave" id="leaveBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Leave
      </button>
    </div>
  </div>
</div>

<div class="perm-banner" id="permBanner">⚠️ <span id="permBannerText">Camera/microphone access needed.</span></div>

<div class="invite-panel" id="invitePanel">
  <button class="invite-close" id="inviteClose" type="button">✕</button>
  <h3>Invite to Class</h3>
  <p class="invite-note" style="margin-bottom:12px">Share the Meeting ID or direct link.</p>
  <div class="invite-row">
    <input class="invite-field" id="inviteIdField" readonly>
    <button class="invite-copy-btn" id="copyIdBtn" type="button">Copy ID</button>
  </div>
  <div class="invite-link-row">
    <input class="invite-link-field" id="inviteLinkField" readonly>
    <button class="invite-copy-btn" id="copyLinkBtn" type="button">Copy Link</button>
  </div>
  <p class="invite-note">They'll see a camera preview before joining — just like Meet.</p>
</div>

<div class="lc-toast-wrap"><div class="lc-toast" id="toast"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script>
(async function(){
"use strict";

// ══════════════════════════════════════════════════════════════
// PARAMS
// ══════════════════════════════════════════════════════════════
const params     = new URLSearchParams(location.search);
const MEETING_ID = (params.get("id") || "").toUpperCase();
const MY_NAME    = decodeURIComponent(params.get("name") || "Guest");
const IS_HOST    = params.get("host") === "true";
const INIT_CAM   = params.get("cam") !== "false";
const INIT_MIC   = params.get("mic") !== "false";
const MY_ID      = "u_" + Math.random().toString(36).slice(2,10);

if(!MEETING_ID){ location.href="/teacher/live-classroom.html"; return; }

const db      = firebase.firestore();
const storage = firebase.storage();

// ══════════════════════════════════════════════════════════════
// ICE CONFIGURATION
// Free Google STUN + Open Relay's free public TURN (no signup).
// ── TO UPGRADE TO PAID METERED.CA TURN ──
// Replace the two "openrelay" entries below with the ICE server
// array Metered.ca gives you after creating an application at
// https://www.metered.ca — just paste their JSON array here.
// ══════════════════════════════════════════════════════════════
const ICE_CONFIG = {
  iceServers:[
    { urls:"stun:stun.l.google.com:19302" },
    { urls:"stun:stun1.l.google.com:19302" },
    { urls:"stun:openrelay.metered.ca:80" },
    { urls:"turn:openrelay.metered.ca:80", username:"openrelayproject", credential:"openrelayproject" },
    { urls:"turn:openrelay.metered.ca:443", username:"openrelayproject", credential:"openrelayproject" },
    { urls:"turn:openrelay.metered.ca:443?transport=tcp", username:"openrelayproject", credential:"openrelayproject" }
  ],
  iceCandidatePoolSize: 10
};

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
let localStream    = null;
let screenStream    = null;
let camOn           = INIT_CAM;
let micOn            = INIT_MIC;
let screenOn         = false;
let recording        = false;
let mediaRecorder    = null;
let recordChunks     = [];
let meetingTitle     = "Impact Live Class";
let startTime        = Date.now();
let elapsedInterval  = null;

const peerConns = {};   // peerId -> RTCPeerConnection
const peerMeta  = {};   // peerId -> { name, isHost, camOn, micOn }
const unsubs    = [];
const politeMap = {};   // peerId -> bool (am I polite toward this peer?)
const makingOffer = {};

// ══════════════════════════════════════════════════════════════
// UI REFS
// ══════════════════════════════════════════════════════════════
const videoGrid    = document.getElementById("videoGrid");
const roomTitle    = document.getElementById("roomTitle");
const roomIdBadge  = document.getElementById("roomIdBadge");
const statusDot    = document.getElementById("statusDot");
const statusTxt    = document.getElementById("statusText");
const camBtn       = document.getElementById("camBtn");
const micBtn       = document.getElementById("micBtn");
const screenBtn    = document.getElementById("screenBtn");
const recBtn       = document.getElementById("recBtn");
const sidebar      = document.getElementById("sidebar");
const peopleBtn    = document.getElementById("peopleBtn");
const peopleBadge  = document.getElementById("peopleBadge");
const peopleCount  = document.getElementById("peopleCount");
const participantList = document.getElementById("participantList");
const permBanner   = document.getElementById("permBanner");

function toast(msg, dur=3200){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), dur);
}
function setStatus(txt, pulsing=false){
  statusTxt.textContent = txt;
  statusDot.className   = "status-dot" + (pulsing ? " connecting" : "");
}

// ══════════════════════════════════════════════════════════════
// TILE / GRID MANAGEMENT
// ══════════════════════════════════════════════════════════════
function updateGridLayout(){
  if(document.querySelector(".screenshare-main")) return; // screenshare mode handles its own layout
  const n = videoGrid.querySelectorAll(".video-tile").length;
  videoGrid.className = "video-grid p" + Math.min(Math.max(n,1),4);
}

function ensureTile(id, name, isLocal, isHost){
  if(document.getElementById("tile-"+id)) return document.getElementById("tile-"+id);

  const tile = document.createElement("div");
  tile.className = "video-tile" + (isLocal ? " mirrored" : "");
  tile.id = "tile-"+id;

  const vid = document.createElement("video");
  vid.autoplay = true;
  vid.playsInline = true;
  vid.muted = isLocal;
  tile.appendChild(vid);

  const crown = document.createElement("div");
  crown.className = "host-crown" + (isHost ? " show" : "");
  crown.id = "crown-"+id;
  crown.innerHTML = "👑 Host";
  tile.appendChild(crown);

  const label = document.createElement("div");
  label.className = "tile-label";
  label.innerHTML = `<svg class="tile-mic-icon" id="micicon-${id}" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg><span class="name-text">${isLocal ? MY_NAME+" (You)" : name}</span>`;
  tile.appendChild(label);

  const camoff = document.createElement("div");
  camoff.className = "tile-cam-off";
  camoff.id = "camoff-"+id;
  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = (name||"?")[0].toUpperCase();
  const nm = document.createElement("div");
  nm.className = "cam-name";
  nm.textContent = isLocal ? MY_NAME+" (You)" : name;
  camoff.appendChild(av); camoff.appendChild(nm);
  tile.appendChild(camoff);

  videoGrid.appendChild(tile);
  updateGridLayout();
  return tile;
}

function setTileStream(id, stream){
  const tile = document.getElementById("tile-"+id);
  if(!tile) return;
  const vid = tile.querySelector("video");
  if(!vid) return;
  if(vid.srcObject !== stream){
    vid.srcObject = stream;
    vid.play().catch(()=>{});
  }
}

function removeTile(id){
  const t = document.getElementById("tile-"+id);
  if(t) t.remove();
  updateGridLayout();
}

function setCamOff(id, off){
  const co = document.getElementById("camoff-"+id);
  if(co) co.classList.toggle("show", off);
}

function setMicIcon(id, on){
  const icon = document.getElementById("micicon-"+id);
  if(!icon) return;
  icon.classList.toggle("muted", !on);
  icon.innerHTML = on
    ? '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/>'
    : '<line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2"/>';
}

// ══════════════════════════════════════════════════════════════
// PARTICIPANT SIDEBAR
// ══════════════════════════════════════════════════════════════
function renderParticipantList(){
  const all = [{ id:MY_ID, name:MY_NAME, isHost:IS_HOST, camOn, micOn, isLocal:true }];
  Object.keys(peerMeta).forEach(id=>{
    all.push({ id, name:peerMeta[id].name, isHost:peerMeta[id].isHost, camOn:peerMeta[id].camOn, micOn:peerMeta[id].micOn, isLocal:false });
  });

  peopleCount.textContent = all.length;
  peopleBadge.textContent = all.length;

  participantList.innerHTML = all.map(p=>`
    <div class="participant-row">
      <div class="p-avatar">${(p.name||"?")[0].toUpperCase()}</div>
      <div class="p-info">
        <div class="p-name">
          ${p.name}
          ${p.isLocal ? '<span class="you-tag">(You)</span>' : ''}
          ${p.isHost ? '<span class="p-badge">HOST</span>' : ''}
        </div>
      </div>
      <div class="p-icons">
        <svg class="${p.micOn?'active':'inactive'}" viewBox="0 0 24 24">${p.micOn
          ? '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/>'
          : '<line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2"/>'}</svg>
        <svg class="${p.camOn?'active':'inactive'}" viewBox="0 0 24 24">${p.camOn
          ? '<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>'
          : '<line x1="1" y1="1" x2="23" y2="23"/><path d="M21 21H3a2 2 0 0 1-2-2V8"/><path d="M16 13l7 4V7l-7 4"/>'}</svg>
      </div>
    </div>
  `).join("");
}

// ══════════════════════════════════════════════════════════════
// LOCAL MEDIA — correct permission handling
// ══════════════════════════════════════════════════════════════
async function startLocalStream(){
  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode: "user",
        width:{ ideal:1280, max:1920 },
        height:{ ideal:720, max:1080 },
        frameRate:{ ideal:30, max:60 }
      },
      audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }
    });
  }catch(err){
    console.warn("getUserMedia video+audio failed:", err.name);
    try{
      localStream = await navigator.mediaDevices.getUserMedia({
        audio:{ echoCancellation:true, noiseSuppression:true }
      });
      camOn = false;
      toast("📷 Camera unavailable — joined with mic only.");
    }catch(err2){
      localStream = new MediaStream();
      camOn = false; micOn = false;
      if(err.name === "NotAllowedError" || err2.name === "NotAllowedError"){
        permBanner.classList.add("show");
        document.getElementById("permBannerText").innerHTML =
          'Camera/mic blocked. Click the 🔒 icon in your address bar → Allow → then <a href="javascript:location.reload()" style="color:#fde68a;text-decoration:underline">reload</a>.';
      }else{
        toast("⚠️ No camera or microphone detected.");
      }
    }
  }

  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);

  ensureTile(MY_ID, MY_NAME, true, IS_HOST);
  setTileStream(MY_ID, localStream);
  setCamOff(MY_ID, !camOn || localStream.getVideoTracks().length===0);
  setMicIcon(MY_ID, micOn);

  camBtn.classList.toggle("off", !camOn);
  micBtn.classList.toggle("off", !micOn);
}

// ══════════════════════════════════════════════════════════════
// MESH WEBRTC — perfect negotiation, every peer ↔ every peer
// Fine for up to ~6 people; ideal for your 1-4 person classes.
// Signalling doc key = sorted pair of IDs so both sides agree.
// ══════════════════════════════════════════════════════════════
function sigDocId(otherId){
  return [MY_ID, otherId].sort().join("__");
}
function sigRef(otherId){
  return db.collection("meetings").doc(MEETING_ID).collection("signals").doc(sigDocId(otherId));
}
function iceOutRef(otherId){ return sigRef(otherId).collection("ice_"+MY_ID); }
function iceInRef(otherId){ return sigRef(otherId).collection("ice_"+otherId); }

async function createPeerConnection(otherId, otherName, otherIsHost){
  if(peerConns[otherId]) return peerConns[otherId];

  // Politeness: deterministic based on ID comparison so both sides agree.
  // The peer with the alphabetically LATER id is "polite" (yields on collision).
  const isPolite = MY_ID > otherId;
  politeMap[otherId] = isPolite;
  makingOffer[otherId] = false;

  const pc = new RTCPeerConnection(ICE_CONFIG);
  peerConns[otherId] = pc;
  peerMeta[otherId]  = { name: otherName, isHost: otherIsHost, camOn:true, micOn:true };

  // Add local tracks BEFORE any negotiation — critical for SDP to include media
  if(localStream){
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }

  ensureTile(otherId, otherName, false, otherIsHost);

  pc.ontrack = (event) => {
    const stream = event.streams[0];
    if(!stream) return;
    setTileStream(otherId, stream);
    setCamOff(otherId, stream.getVideoTracks().length === 0 || !stream.getVideoTracks()[0].enabled);
  };

  pc.onicecandidate = (event) => {
    if(!event.candidate) return;
    iceOutRef(otherId).add({ candidate: event.candidate.toJSON(), ts: Date.now() }).catch(()=>{});
  };

  pc.onnegotiationneeded = async () => {
    try{
      makingOffer[otherId] = true;
      await pc.setLocalDescription();
      await sigRef(otherId).set({
        [`sdp_${MY_ID}`]: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
      }, { merge:true });
    }catch(e){
      console.error("onnegotiationneeded error:", e);
    }finally{
      makingOffer[otherId] = false;
    }
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if(s === "connected"){
      const total = Object.keys(peerConns).length + 1;
      setStatus(`Live · ${total} in class`);
    }
    if(s === "failed"){
      toast(`⚠️ Connection to ${otherName} failed. They may need to rejoin.`);
    }
  };

  // Listen for remote SDP (offer or answer — perfect negotiation treats both uniformly)
  const unsubSdp = sigRef(otherId).onSnapshot(async (snap) => {
    const data = snap.data();
    if(!data) return;
    const remoteSdp = data[`sdp_${otherId}`];
    if(!remoteSdp || !remoteSdp.sdp) return;

    try{
      const offerCollision = remoteSdp.type === "offer" &&
        (makingOffer[otherId] || pc.signalingState !== "stable");

      const ignoreOffer = !isPolite && offerCollision;
      if(ignoreOffer) return;

      await pc.setRemoteDescription(new RTCSessionDescription(remoteSdp));

      if(remoteSdp.type === "offer"){
        await pc.setLocalDescription();
        await sigRef(otherId).set({
          [`sdp_${MY_ID}`]: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
        }, { merge:true });
      }
    }catch(e){
      console.error("SDP handling error:", e);
    }
  });
  unsubs.push(unsubSdp);

  // Listen for inbound ICE candidates
  const unsubIce = iceInRef(otherId).orderBy("ts").onSnapshot((snap) => {
    snap.docChanges().forEach(async (change) => {
      if(change.type === "added"){
        try{ await pc.addIceCandidate(new RTCIceCandidate(change.doc.data().candidate)); }
        catch(e){ /* benign during renegotiation */ }
      }
    });
  });
  unsubs.push(unsubIce);

  renderParticipantList();
  return pc;
}

function closePeerConnection(otherId){
  const pc = peerConns[otherId];
  if(pc){ try{ pc.close(); }catch(e){} }
  delete peerConns[otherId];
  delete peerMeta[otherId];
  removeTile(otherId);
  renderParticipantList();
}

// ══════════════════════════════════════════════════════════════
// PARTICIPANT DISCOVERY — mesh: everyone connects to everyone
// ══════════════════════════════════════════════════════════════
function watchParticipants(){
  const unsub = db.collection("meetings").doc(MEETING_ID)
    .collection("participants")
    .onSnapshot((snap) => {
      snap.docChanges().forEach(async (change) => {
        const data = change.doc.data();
        const rid  = data.participantId;
        if(rid === MY_ID) return;

        if(change.type === "added"){
          toast(data.displayName + " joined the class");
          await createPeerConnection(rid, data.displayName, data.isHost);
        }

        if(change.type === "modified"){
          if(peerMeta[rid]){
            peerMeta[rid].camOn = data.cameraEnabled;
            peerMeta[rid].micOn = data.micEnabled;
            setCamOff(rid, !data.cameraEnabled);
            setMicIcon(rid, data.micEnabled);
            renderParticipantList();
          }
        }

        if(change.type === "removed"){
          toast(data.displayName + " left");
          closePeerConnection(rid);
          if(data.isHost){
            cleanup();
            location.href = "/teacher/live-ended.html?reason=ended";
          }
        }
      });
    });
  unsubs.push(unsub);
}

async function registerSelf(){
  await db.collection("meetings").doc(MEETING_ID)
    .collection("participants").doc(MY_ID).set({
      participantId: MY_ID, displayName: MY_NAME, isHost: IS_HOST,
      cameraEnabled: camOn, micEnabled: micOn, joinedAt: new Date().toISOString()
    });
  window.addEventListener("pagehide", cleanup);
  window.addEventListener("beforeunload", cleanup);
}

function syncSelfState(){
  db.collection("meetings").doc(MEETING_ID).collection("participants").doc(MY_ID)
    .update({ cameraEnabled: camOn, micEnabled: micOn }).catch(()=>{});
  renderParticipantList();
}

// ══════════════════════════════════════════════════════════════
// CONTROLS
// ══════════════════════════════════════════════════════════════
camBtn.onclick = function(){
  if(!localStream || !localStream.getVideoTracks().length){ toast("No camera available."); return; }
  camOn = !camOn;
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  camBtn.classList.toggle("off", !camOn);
  setCamOff(MY_ID, !camOn);
  syncSelfState();
};

micBtn.onclick = function(){
  if(!localStream || !localStream.getAudioTracks().length){ toast("No microphone available."); return; }
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  micBtn.classList.toggle("off", !micOn);
  setMicIcon(MY_ID, micOn);
  syncSelfState();
};

screenBtn.onclick = async function(){
  if(screenOn){ stopScreenShare(); return; }
  try{
    screenStream = await navigator.mediaDevices.getDisplayMedia({
      video:{ cursor:"always", frameRate:15 },
      audio:true
    });
    screenOn = true;
    screenBtn.classList.add("active");
    toast("Screen sharing started");

    const screenTrack = screenStream.getVideoTracks()[0];

    // Replace outgoing video track on every peer connection
    await Promise.all(Object.values(peerConns).map(async pc => {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
      if(sender) await sender.replaceTrack(screenTrack);
    }));

    // Show the screen share in the LOCAL tile
    setTileStream(MY_ID, screenStream);
    document.getElementById("tile-"+MY_ID).classList.remove("mirrored");

    screenTrack.onended = () => stopScreenShare();
  }catch(e){
    if(e.name !== "NotAllowedError") toast("Screen sharing failed: " + e.message);
  }
};

async function stopScreenShare(){
  if(!screenOn) return;
  screenOn = false;
  screenBtn.classList.remove("active");
  if(screenStream){ screenStream.getTracks().forEach(t=>t.stop()); screenStream=null; }

  if(localStream){
    const camTrack = localStream.getVideoTracks()[0];
    if(camTrack){
      await Promise.all(Object.values(peerConns).map(async pc => {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
        if(sender) await sender.replaceTrack(camTrack);
      }));
    }
    setTileStream(MY_ID, localStream);
    document.getElementById("tile-"+MY_ID).classList.add("mirrored");
  }
  toast("Screen sharing stopped");
}

// ── Sidebar ──
peopleBtn.onclick = () => {
  sidebar.classList.toggle("show");
  peopleBtn.classList.toggle("active");
  if(sidebar.classList.contains("show")) renderParticipantList();
};
document.getElementById("sidebarClose").onclick = () => {
  sidebar.classList.remove("show");
  peopleBtn.classList.remove("active");
};

// ── Invite panel ──
document.getElementById("inviteBtn").onclick = () => document.getElementById("invitePanel").classList.toggle("show");
document.getElementById("inviteClose").onclick = () => document.getElementById("invitePanel").classList.remove("show");
document.getElementById("copyIdBtn").onclick = () => { navigator.clipboard.writeText(MEETING_ID).catch(()=>{}); toast("Meeting ID copied!"); };
document.getElementById("copyLinkBtn").onclick = () => {
  const link = `${location.origin}/teacher/live-join.html?id=${MEETING_ID}`;
  navigator.clipboard.writeText(link).catch(()=>{});
  toast("Invite link copied!");
};

// ══════════════════════════════════════════════════════════════
// RECORDING (host only) — captures composite of all visible tiles
// ══════════════════════════════════════════════════════════════
function initRecording(){
  recBtn.style.display = "flex";
  recBtn.onclick = () => recording ? stopRecording() : startRecording();
}

function startRecording(){
  recordChunks = [];
  const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
    ? "video/webm;codecs=vp9,opus"
    : MediaRecorder.isTypeSupported("video/webm") ? "video/webm" : "video/mp4";

  const canvas = document.createElement("canvas");
  canvas.width = 1280; canvas.height = 720;
  const ctx = canvas.getContext("2d");

  const draw = setInterval(()=>{
    const tiles = Array.from(videoGrid.querySelectorAll("video")).filter(v=>v.srcObject && v.readyState>=2);
    const n = tiles.length || 1;
    const cols = n===1?1:2, rows = Math.ceil(n/cols);
    const tw = canvas.width/cols, th = canvas.height/rows;
    ctx.fillStyle="#0a0c14"; ctx.fillRect(0,0,canvas.width,canvas.height);
    tiles.forEach((v,i)=>{
      const col=i%cols, row=Math.floor(i/cols);
      try{ ctx.drawImage(v,col*tw+2,row*th+2,tw-4,th-4); }catch(e){}
    });
  }, 1000/24);

  const cs = canvas.captureStream(24);

  try{
    const ac = new AudioContext();
    const dest = ac.createMediaStreamDestination();
    if(localStream && localStream.getAudioTracks().length){
      ac.createMediaStreamSource(new MediaStream([localStream.getAudioTracks()[0]])).connect(dest);
    }
    Object.values(peerConns).forEach(pc=>{
      pc.getReceivers().filter(r=>r.track&&r.track.kind==="audio").forEach(r=>{
        try{ ac.createMediaStreamSource(new MediaStream([r.track])).connect(dest); }catch(e){}
      });
    });
    if(dest.stream.getAudioTracks().length) cs.addTrack(dest.stream.getAudioTracks()[0]);
  }catch(e){}

  try{ mediaRecorder = new MediaRecorder(cs,{mimeType:mime,videoBitsPerSecond:3000000}); }
  catch(e){ mediaRecorder = new MediaRecorder(cs); }

  mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recordChunks.push(e.data); };
  mediaRecorder.onstop = async ()=>{ clearInterval(draw); await uploadRecording(mime); };
  mediaRecorder.start(1000);
  recording = true;
  recBtn.classList.add("recording");
  toast("🔴 Recording started");
}

function stopRecording(){
  if(!mediaRecorder||!recording) return;
  mediaRecorder.stop();
  recording = false;
  recBtn.classList.remove("recording");
  recBtn.disabled = true;
  toast("Uploading recording...", 5000);
}

async function uploadRecording(mime){
  try{
    const ext = mime.includes("mp4")?"mp4":"webm";
    const blob = new Blob(recordChunks,{type:mime});
    const path = `recordings/${MEETING_ID}/rec_${Date.now()}.${ext}`;
    const snap = await storage.ref(path).put(blob);
    const url  = await snap.ref.getDownloadURL();
    const dur  = Math.round((Date.now()-startTime)/1000);
    await db.collection("recordings").add({
      meetingId:MEETING_ID, meetingTitle, storagePath:path, downloadURL:url,
      duration:dur, mimeType:mime, createdAt:new Date().toISOString(), recordedBy:MY_NAME
    });
    await db.collection("meetings").doc(MEETING_ID).update({ hasRecording:true }).catch(()=>{});
    recBtn.disabled = false;
    toast("✅ Recording saved!", 4000);
  }catch(e){
    console.error(e);
    recBtn.disabled = false;
    toast("⚠️ Upload failed: " + e.message, 5000);
  }
}

// ══════════════════════════════════════════════════════════════
// ELAPSED TIME
// ══════════════════════════════════════════════════════════════
function startTimer(){
  elapsedInterval = setInterval(()=>{
    const s = Math.floor((Date.now()-startTime)/1000);
    const m = String(Math.floor(s/60)).padStart(2,"0");
    const ss = String(s%60).padStart(2,"0");
    document.getElementById("elapsedTime").textContent = m+":"+ss;
  }, 1000);
}

// ══════════════════════════════════════════════════════════════
// LEAVE / CLEANUP
// ══════════════════════════════════════════════════════════════
document.getElementById("leaveBtn").onclick = async function(){
  if(recording) stopRecording();
  const dur = Math.round((Date.now()-startTime)/1000);
  try{
    await db.collection("meetings").doc(MEETING_ID).update({
      ...(IS_HOST ? { status:"ended", endedAt:new Date().toISOString() } : {}),
      durationSeconds: dur,
      participantCount: Object.keys(peerConns).length + 1
    });
  }catch(e){}
  cleanup();
  location.href = `/teacher/live-ended.html?reason=${IS_HOST?"ended":"left"}`;
};

function cleanup(){
  clearInterval(elapsedInterval);
  unsubs.forEach(u=>{ try{u();}catch(e){} });
  Object.values(peerConns).forEach(pc=>{ try{pc.close();}catch(e){} });
  if(localStream)  localStream.getTracks().forEach(t=>t.stop());
  if(screenStream) screenStream.getTracks().forEach(t=>t.stop());
  db.collection("meetings").doc(MEETING_ID).collection("participants").doc(MY_ID).delete().catch(()=>{});
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
async function init(){
  setStatus("Connecting…", true);

  const mSnap = await db.collection("meetings").doc(MEETING_ID).get();
  if(!mSnap.exists || mSnap.data().status === "ended"){
    location.href = "/teacher/live-ended.html?reason=notfound";
    return;
  }
  const md = mSnap.data();
  meetingTitle = md.title || "Impact Live Class";
  roomTitle.textContent = meetingTitle;
  document.title = meetingTitle + " | Impact";
  roomIdBadge.textContent = MEETING_ID;
  roomIdBadge.onclick = () => { navigator.clipboard.writeText(MEETING_ID).catch(()=>{}); toast("Meeting ID copied!"); };
  document.getElementById("inviteIdField").value = MEETING_ID;
  document.getElementById("inviteLinkField").value = `${location.origin}/teacher/live-join.html?id=${MEETING_ID}`;

  await startLocalStream();
  await registerSelf();
  watchParticipants();
  renderParticipantList();
  startTimer();

  if(IS_HOST) initRecording();

  setStatus("Live", false);

  db.collection("classroomUsage").add({
    meetingId:MEETING_ID, meetingTitle, participantName:MY_NAME,
    isHost:IS_HOST, joinedAt:new Date().toISOString(), date:new Date().toDateString()
  }).catch(()=>{});
}

init();
})();
</script>
