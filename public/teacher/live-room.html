<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Live Class | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/live-classroom.css">
</head>
<body style="overflow:hidden;background:#0a0c14">

<header class="room-header">
  <div class="room-title" id="roomTitle">Impact Live Class</div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="room-id-badge" id="roomIdBadge">...</span>
    <div class="room-status">
      <span class="status-dot connecting" id="statusDot"></span>
      <span id="statusText">Connecting</span>
    </div>
  </div>
</header>

<div class="video-grid p1" id="videoGrid"></div>

<div class="invite-panel" id="invitePanel">
  <button class="invite-close" id="inviteClose" type="button">✕</button>
  <h3>Invite to Class</h3>
  <p class="invite-note" style="margin-bottom:12px">Share the Meeting ID or direct link.</p>
  <div class="invite-row">
    <input class="invite-field" id="inviteIdField" readonly>
    <button class="invite-copy-btn" id="copyIdBtn" type="button">Copy ID</button>
  </div>
  <div class="invite-link-row">
    <input class="invite-link-field" id="inviteLinkField" readonly>
    <button class="invite-copy-btn" id="copyLinkBtn" type="button">Copy Link</button>
  </div>
  <p class="invite-note">Participants will see a preview screen before joining.</p>
</div>

<div class="controls" id="controls">
  <button class="ctrl-btn ctrl-btn-cam" id="camBtn" type="button">
    <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    <span id="camLabel">Camera</span>
  </button>
  <button class="ctrl-btn ctrl-btn-mic" id="micBtn" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    <span id="micLabel">Mic</span>
  </button>
  <div class="ctrl-separator"></div>
  <button class="ctrl-btn ctrl-btn-screen" id="screenBtn" type="button">
    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    <span id="screenLabel">Screen</span>
  </button>
  <button class="ctrl-btn ctrl-btn-invite" id="inviteBtn" type="button">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    <span>Invite</span>
  </button>
  <div class="ctrl-separator"></div>
  <button class="ctrl-btn ctrl-btn-rec" id="recBtn" type="button" style="display:none">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
    <span id="recLabel">Record</span>
  </button>
  <div class="ctrl-separator" id="recSep" style="display:none"></div>
  <button class="ctrl-btn ctrl-btn-leave" id="leaveBtn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Leave
  </button>
</div>

<div class="lc-toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-storage-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script>
(async function(){
"use strict";

// ── PARAMS ───────────────────────────────────────────────────
const params     = new URLSearchParams(location.search);
const MEETING_ID = (params.get("id") || "").toUpperCase();
const MY_NAME    = decodeURIComponent(params.get("name") || "Guest");
const IS_HOST    = params.get("host") === "true";
const INIT_CAM   = params.get("cam") !== "false";
const INIT_MIC   = params.get("mic") !== "false";
const MY_ID      = IS_HOST ? "host" : ("p_" + Math.random().toString(36).slice(2,9));

if(!MEETING_ID){ location.href="/teacher/live-classroom.html"; return; }

const db      = firebase.firestore();
const storage = firebase.storage();

// Public STUN servers — good enough for LAN + most networks
// For cross-network reliability, a TURN server would be needed
const ICE_CONFIG = {
  iceServers:[
    { urls:"stun:stun.l.google.com:19302" },
    { urls:"stun:stun1.l.google.com:19302" },
    { urls:"stun:stun2.l.google.com:19302" },
    { urls:"stun:stun3.l.google.com:19302" },
    { urls:"stun:stun4.l.google.com:19302" }
  ],
  iceCandidatePoolSize: 10
};

// ── STATE ────────────────────────────────────────────────────
let localStream   = null;
let screenStream  = null;
let camOn         = INIT_CAM;
let micOn         = INIT_MIC;
let screenOn      = false;
let recording     = false;
let mediaRecorder = null;
let recordChunks  = [];
let meetingTitle  = "Impact Live Class";
let startTime     = Date.now();
// Map of peerId -> RTCPeerConnection
const peerConns   = {};
// Map of peerId -> { name, stream }
const peerInfo    = {};
const unsubs      = [];
let makingOffer   = {};
let ignoreOffer   = {};

// ── UI REFS ──────────────────────────────────────────────────
const videoGrid   = document.getElementById("videoGrid");
const roomTitle   = document.getElementById("roomTitle");
const roomIdBadge = document.getElementById("roomIdBadge");
const statusDot   = document.getElementById("statusDot");
const statusTxt   = document.getElementById("statusText");
const camBtn      = document.getElementById("camBtn");
const micBtn      = document.getElementById("micBtn");
const screenBtn   = document.getElementById("screenBtn");
const recBtn      = document.getElementById("recBtn");
const recSep      = document.getElementById("recSep");

// ── HELPERS ──────────────────────────────────────────────────
function toast(msg, dur=3200){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), dur);
}
function setStatus(txt, pulsing=false){
  statusTxt.textContent = txt;
  statusDot.className   = "status-dot" + (pulsing ? " connecting" : "");
}
function updateGrid(){
  const n = videoGrid.querySelectorAll(".video-tile").length;
  videoGrid.className = "video-grid p" + Math.min(Math.max(n,1),10);
}

// ── TILE MANAGEMENT ──────────────────────────────────────────
function ensureTile(id, name, isLocal){
  if(document.getElementById("tile-"+id)) return;

  const tile = document.createElement("div");
  tile.className = "video-tile" + (isLocal ? "" : " remote");
  tile.id = "tile-"+id;

  const vid = document.createElement("video");
  vid.autoplay = true;
  vid.playsInline = true;
  vid.muted = isLocal; // mute local to prevent echo
  tile.appendChild(vid);

  const lbl = document.createElement("div");
  lbl.className = "tile-label";
  lbl.textContent = isLocal ? MY_NAME + " (You)" : name;
  tile.appendChild(lbl);

  const muted = document.createElement("div");
  muted.className = "tile-muted";
  muted.id = "muted-"+id;
  muted.textContent = "🔇";
  tile.appendChild(muted);

  const camoff = document.createElement("div");
  camoff.className = "tile-cam-off";
  camoff.id = "camoff-"+id;
  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = (name||"?")[0].toUpperCase();
  const nm = document.createElement("div");
  nm.className = "cam-name";
  nm.textContent = isLocal ? MY_NAME+" (You)" : name;
  camoff.appendChild(av);
  camoff.appendChild(nm);
  tile.appendChild(camoff);

  videoGrid.appendChild(tile);
  updateGrid();
}

function setTileStream(id, stream){
  const tile = document.getElementById("tile-"+id);
  if(!tile) return;
  const vid = tile.querySelector("video");
  if(!vid) return;
  vid.srcObject = stream;
  // Ensure playback starts
  vid.play().catch(()=>{});
}

function removeTile(id){
  const t = document.getElementById("tile-"+id);
  if(t) t.remove();
  updateGrid();
}

function setCamOff(id, off){
  const co = document.getElementById("camoff-"+id);
  if(co) co.classList.toggle("show", off);
  const tile = document.getElementById("tile-"+id);
  if(tile){
    const vid = tile.querySelector("video");
    if(vid) vid.style.visibility = off ? "hidden" : "visible";
  }
}

function setMuted(id, muted){
  const m = document.getElementById("muted-"+id);
  if(m) m.classList.toggle("show", muted);
}

// ── LOCAL MEDIA ──────────────────────────────────────────────
async function startLocalStream(){
  // Try camera + mic together first
  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode: "user",          // front camera on mobile
        width: { ideal: 1280, max: 1920 },
        height: { ideal: 720, max: 1080 },
        frameRate: { ideal: 30, max: 60 }
      },
      audio:{
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });
  }catch(err){
    console.warn("getUserMedia with video failed:", err.name, err.message);
    // Fall back to audio only
    try{
      localStream = await navigator.mediaDevices.getUserMedia({
        video: false,
        audio: { echoCancellation:true, noiseSuppression:true }
      });
      camOn = false;
      toast("📷 Camera unavailable. Joined with mic only.");
    }catch(err2){
      // No media at all — create a silent/blank stream so peers still connect
      localStream = new MediaStream();
      camOn = false; micOn = false;
      toast("⚠️ No camera or mic detected.");
    }
  }

  // Apply initial cam/mic state from pre-join settings
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);

  ensureTile(MY_ID, MY_NAME, true);
  setTileStream(MY_ID, localStream);
  setCamOff(MY_ID, !camOn);
  setMuted(MY_ID, !micOn);

  // Sync button states
  camBtn.classList.toggle("off", !camOn);
  document.getElementById("camLabel").textContent = camOn ? "Camera" : "Cam Off";
  micBtn.classList.toggle("off", !micOn);
  document.getElementById("micLabel").textContent = micOn ? "Mic" : "Muted";
}

// ── WEBRTC: PERFECT NEGOTIATION PATTERN ─────────────────────
// Both host and participants use the same peer connection logic.
// The HOST is the "impolite" peer (priority), participants are "polite".
// Signals are stored in Firestore under:
//   meetings/{MEETING_ID}/signals/{REMOTE_ID}/from_{MY_ID}
// Each document: { offer, answer, candidates: [] }

function sigRef(remoteId){
  // Canonical document key: alphabetical order of the two IDs
  const [a,b] = [MY_ID, remoteId].sort();
  return db.collection("meetings").doc(MEETING_ID)
    .collection("signals").doc(`${a}__${b}`);
}
function iceSub(remoteId){ return sigRef(remoteId).collection("ice_"+MY_ID); }
function iceInbound(remoteId){ return sigRef(remoteId).collection("ice_"+remoteId); }

async function createPeer(remoteId, remoteName, isPolite){
  if(peerConns[remoteId]) return peerConns[remoteId];

  const pc = new RTCPeerConnection(ICE_CONFIG);
  pc.oniceconnectionstatechange = () => {
    console.log(
        "[ICE]",
        remoteId,
        pc.iceConnectionState
    );
};

pc.onicegatheringstatechange = () => {
    console.log(
        "[ICE GATHERING]",
        remoteId,
        pc.iceGatheringState
    );
};

pc.onsignalingstatechange = () => {
    console.log(
        "[SIGNAL]",
        remoteId,
        pc.signalingState
    );
};

pc.onconnectionstatechange = () => {

    console.log(
        "[CONNECTION STATE]",
        remoteId,
        pc.connectionState
    );

    const s = pc.connectionState;

    if(s === "connected"){
        ...
        const count=Object.keys(peerConns).length;
        setStatus(
            IS_HOST
                ? `Live · ${count} participant${count>1?"s":""}`
                : "Live"
        );
    }

    if(s==="failed"){
        toast("Connection failed.");
    }
};

  peerConns[remoteId] = pc;
  peerInfo[remoteId]  = { name: remoteName };
  makingOffer[remoteId] = false;
  ignoreOffer[remoteId] = false;

  // ── Add ALL local tracks BEFORE negotiation begins ────────
  // This ensures the SDP offer includes video+audio sections
  if(localStream){
    localStream.getTracks().forEach(track => {
      pc.addTrack(track, localStream);
    });
  }

  // ── Handle incoming tracks ────────────────────────────────
  pc.ontrack = (event) => {
  console.log(
    "[REMOTE TRACK]",
    remoteId,
    event.track.kind
);
    const stream = event.streams[0];
    if(!stream) return;

    // Ensure tile exists
    ensureTile(remoteId, remoteName, false);

    // Set the stream directly on the video element
    const tile = document.getElementById("tile-"+remoteId);
    if(tile){
      const vid = tile.querySelector("video");
      if(vid){
        vid.srcObject = stream;
        vid.play().catch(()=>{});
      }
    }
    setCamOff(remoteId, stream.getVideoTracks().length === 0);
  };

  // ── ICE candidates ────────────────────────────────────────
  pc.onicecandidate = (event)=>{

    if(event.candidate){

        console.log(
            "[SEND ICE]",
            remoteId,
            event.candidate.candidate
        );

    }else{

        console.log(
            "[SEND ICE COMPLETE]",
            remoteId
        );

    }

    if(!event.candidate) return;

    iceSub(remoteId).add({
        candidate:event.candidate.toJSON(),
        ts:Date.now()
    });

};


  // ── Perfect negotiation: handle onnegotiationneeded ───────
  pc.onnegotiationneeded = async () => {
    try{
      makingOffer[remoteId] = true;
      console.log(
    "[NEGOTIATION START]",
    remoteId
);
      const offer = await pc.createOffer();
      if(pc.signalingState !== "stable") return;
      await pc.setLocalDescription(offer);
      console.log(
    "[LOCAL OFFER CREATED]",
    remoteId
);
      await sigRef(remoteId).set({
        [`offer_${MY_ID}`]: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
      }, { merge: true });
    }catch(e){
      console.error("onnegotiationneeded error:", e);
    }finally{
      makingOffer[remoteId] = false;
    }
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if(s === "connected"){
      const count = Object.keys(peerConns).length;
      setStatus(IS_HOST ? `Live · ${count} participant${count>1?"s":""}` : "Live");
    }
    if(s === "failed"){
      toast(`⚠️ Connection to ${remoteName} lost. They may need to rejoin.`);
    }
    if(s === "disconnected"){
      setTimeout(()=>{
        if(pc.connectionState === "disconnected") removeTile(remoteId);
      }, 5000);
    }
  };

  pc.onsignalingstatechange = () => {
    if(pc.signalingState === "closed"){
      removeTile(remoteId);
    }
  };

  // ── Listen for the remote's offer ────────────────────────
  const offerKey = `offer_${remoteId}`;
  const answerKey = `answer_${MY_ID}`;

  const unsub1 = sigRef(remoteId).onSnapshot(async (snap) => {
    const data = snap.data();
    if(!data) return;

    // Handle incoming offer
    const remoteOffer = data[offerKey];
    if(remoteOffer && remoteOffer.sdp){
    console.log(
    "[REMOTE OFFER]",
    remoteId
);
      const offerCollision = makingOffer[remoteId] || pc.signalingState !== "stable";
      ignoreOffer[remoteId] = !isPolite && offerCollision;
      if(ignoreOffer[remoteId]) return;

      try{
        await pc.setRemoteDescription(new RTCSessionDescription(remoteOffer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await sigRef(remoteId).set({
          [`answer_${MY_ID}`]: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
        }, { merge: true });
      }catch(e){
        console.error("setRemoteDescription (offer) error:", e);
      }
    }

    // Handle incoming answer
    const remoteAnswer = data[`answer_${remoteId}`];
    if(remoteAnswer && remoteAnswer.sdp && !pc.currentRemoteDescription){
    console.log(
    "[REMOTE ANSWER]",
    remoteId
);
      try{
        await pc.setRemoteDescription(new RTCSessionDescription(remoteAnswer));
      }catch(e){
        console.error("setRemoteDescription (answer) error:", e);
      }
    }
  });
  unsubs.push(unsub1);

  // ── Listen for inbound ICE candidates ────────────────────
  const unsub2 = iceInbound(remoteId).orderBy("ts").onSnapshot((snap) => {
    snap.docChanges().forEach(async (change) => {
      if(change.type === "added"){
      console.log(
    "[ICE RECEIVED]",
    remoteId,
    change.doc.data().candidate
);
        try{
        console.log(
    "[RECV ICE]",
    remoteId
);

          await pc.addIceCandidate(new RTCIceCandidate(change.doc.data().candidate));
        }catch(e){
          if(!ignoreOffer[remoteId]) console.error("addIceCandidate error:", e);
        }
      }
    });
  });
  unsubs.push(unsub2);

  return pc;
}

function closePeer(remoteId){
  const pc = peerConns[remoteId];
  if(pc){ try{ pc.close(); }catch(e){} }
  delete peerConns[remoteId];
  delete peerInfo[remoteId];
  removeTile(remoteId);
}

// ── PARTICIPANT DISCOVERY ────────────────────────────────────
// All participants register in Firestore.
// When a new participant appears, BOTH sides create a peer connection.
// The HOST (impolite) will create the offer because it fires onnegotiationneeded first.

function watchParticipants(){
  const unsub = db.collection("meetings").doc(MEETING_ID)
    .collection("participants")
    .onSnapshot((snap) => {
      snap.docChanges().forEach(async (change) => {
        const data = change.doc.data();
        const rid  = data.participantId;
        if(rid === MY_ID) return;

        if(change.type === "added"){
          if(!IS_HOST) toast(data.displayName + " is in the class");
          // Polite = participant (yields on collision); Impolite = host (wins)
          const isPolite = !IS_HOST;
          await createPeer(rid, data.displayName, isPolite);
          if(IS_HOST) toast(data.displayName + " joined");
        }

        if(change.type === "removed"){
          toast(data.displayName + " left");
          closePeer(rid);

          // If host left, redirect all participants
          if(data.isHost && !IS_HOST){
            cleanup();
            location.href = "/teacher/live-ended.html?reason=ended";
          }
        }

        if(change.type === "modified"){
          // Sync cam/mic state badges
          setCamOff(rid, !data.cameraEnabled);
          setMuted(rid, !data.micEnabled);
        }
      });
    });
  unsubs.push(unsub);
}

// ── REGISTER SELF ────────────────────────────────────────────
async function registerSelf(){
  await db.collection("meetings").doc(MEETING_ID)
    .collection("participants").doc(MY_ID).set({
      participantId: MY_ID,
      displayName:   MY_NAME,
      isHost:        IS_HOST,
      cameraEnabled: camOn,
      micEnabled:    micOn,
      joinedAt:      new Date().toISOString()
    });
  window.addEventListener("pagehide", cleanup);
  window.addEventListener("beforeunload", cleanup);
}

function updateParticipantState(){
  db.collection("meetings").doc(MEETING_ID)
    .collection("participants").doc(MY_ID)
    .update({ cameraEnabled: camOn, micEnabled: micOn })
    .catch(()=>{});
}

// ── CONTROLS ─────────────────────────────────────────────────
camBtn.onclick = function(){
  if(!localStream) return;
  const vt = localStream.getVideoTracks();
  if(!vt.length){ toast("No camera available."); return; }
  camOn = !camOn;
  vt.forEach(t => t.enabled = camOn);
  camBtn.classList.toggle("off", !camOn);
  document.getElementById("camLabel").textContent = camOn ? "Camera" : "Cam Off";
  setCamOff(MY_ID, !camOn);
  updateParticipantState();
};

micBtn.onclick = function(){
  if(!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  micBtn.classList.toggle("off", !micOn);
  document.getElementById("micLabel").textContent = micOn ? "Mic" : "Muted";
  setMuted(MY_ID, !micOn);
  updateParticipantState();
};

screenBtn.onclick = async function(){
  if(screenOn){ stopScreen(); return; }
  try{
    screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: { cursor: "always" },
      audio: true
    });
    screenOn = true;
    screenBtn.classList.add("active");
    document.getElementById("screenLabel").textContent = "Sharing";
    toast("Screen sharing started");

    const screenTrack = screenStream.getVideoTracks()[0];

    // Replace video track in all peer connections
    Object.values(peerConns).forEach(pc => {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
      if(sender) sender.replaceTrack(screenTrack).catch(()=>{});
    });

    // Show screen in local tile
    const localTile = document.getElementById("tile-"+MY_ID);
    if(localTile){
      const vid = localTile.querySelector("video");
      if(vid){ vid.srcObject = screenStream; vid.play().catch(()=>{}); }
    }

    screenTrack.onended = () => stopScreen();
  }catch(e){
    if(e.name !== "NotAllowedError") toast("Screen sharing failed: " + e.message);
  }
};

function stopScreen(){
  screenOn = false;
  screenBtn.classList.remove("active");
  document.getElementById("screenLabel").textContent = "Screen";
  if(screenStream){ screenStream.getTracks().forEach(t=>t.stop()); screenStream=null; }
  // Restore camera track
  if(localStream){
    const ct = localStream.getVideoTracks()[0];
    if(ct){
      Object.values(peerConns).forEach(pc => {
        const s = pc.getSenders().find(s => s.track && s.track.kind === "video");
        if(s) s.replaceTrack(ct).catch(()=>{});
      });
    }
    const lv = document.getElementById("tile-"+MY_ID);
    if(lv){ const vid=lv.querySelector("video"); if(vid){ vid.srcObject=localStream; vid.play().catch(()=>{}); } }
  }
  toast("Screen sharing stopped");
}

// ── INVITE ───────────────────────────────────────────────────
document.getElementById("inviteBtn").onclick = () => {
  document.getElementById("invitePanel").classList.toggle("show");
};
document.getElementById("inviteClose").onclick = () => {
  document.getElementById("invitePanel").classList.remove("show");
};
document.getElementById("copyIdBtn").onclick = () => {
  navigator.clipboard.writeText(MEETING_ID).catch(()=>{});
  toast("Meeting ID copied!");
};
document.getElementById("copyLinkBtn").onclick = () => {
  const link = `${location.origin}/teacher/live-join.html?id=${MEETING_ID}`;
  navigator.clipboard.writeText(link).catch(()=>{});
  toast("Invite link copied!");
};

// ── RECORDING (HOST ONLY) ────────────────────────────────────
function initRecording(){
  recBtn.style.display = "flex";
  recSep.style.display = "block";
  recBtn.onclick = () => recording ? stopRecording() : startRecording();
}

function startRecording(){
  recordChunks = [];
  const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
    ? "video/webm;codecs=vp9,opus"
    : MediaRecorder.isTypeSupported("video/webm")
    ? "video/webm" : "video/mp4";

  const canvas = document.createElement("canvas");
  canvas.width = 1280; canvas.height = 720;
  const ctx = canvas.getContext("2d");

  const draw = setInterval(()=>{
    const tiles = Array.from(videoGrid.querySelectorAll("video")).filter(v=>v.srcObject && v.readyState>=2);
    const n   = tiles.length || 1;
    const cols = n===1?1:n<=4?2:3;
    const rows = Math.ceil(n/cols);
    const tw = canvas.width/cols, th = canvas.height/rows;
    ctx.fillStyle="#0a0c14"; ctx.fillRect(0,0,canvas.width,canvas.height);
    tiles.forEach((v,i)=>{
      const col=i%cols, row=Math.floor(i/cols);
      try{ ctx.drawImage(v,col*tw+2,row*th+2,tw-4,th-4); }catch(e){}
    });
  }, 1000/24);

  const cs = canvas.captureStream(24);

  // Mix all audio
  try{
    const ac   = new AudioContext();
    const dest = ac.createMediaStreamDestination();
    const allStreams = [
      localStream,
      ...Object.values(peerConns).map(pc =>
        pc.getReceivers()
          .filter(r=>r.track&&r.track.kind==="audio")
          .map(r=>{ const s=new MediaStream([r.track]); return s; })
      ).flat()
    ].filter(Boolean);

    allStreams.forEach(s=>{
      try{ ac.createMediaStreamSource(s).connect(dest); }catch(e){}
    });
    if(dest.stream.getAudioTracks().length)
      cs.addTrack(dest.stream.getAudioTracks()[0]);
  }catch(e){}

  try{ mediaRecorder = new MediaRecorder(cs,{mimeType:mime,videoBitsPerSecond:3000000}); }
  catch(e){ mediaRecorder = new MediaRecorder(cs); }

  mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recordChunks.push(e.data); };
  mediaRecorder.onstop = async ()=>{
    clearInterval(draw);
    await uploadRecording(mime);
  };

  mediaRecorder.start(1000);
  recording = true;
  recBtn.classList.add("recording");
  document.getElementById("recLabel").textContent = "Stop";
  toast("🔴 Recording started");
}

function stopRecording(){
  if(!mediaRecorder||!recording) return;
  mediaRecorder.stop();
  recording = false;
  recBtn.classList.remove("recording");
  document.getElementById("recLabel").textContent = "Saving...";
  recBtn.disabled = true;
  toast("Uploading recording...", 5000);
}

async function uploadRecording(mime){
  try{
    const ext  = mime.includes("mp4")?"mp4":"webm";
    const blob = new Blob(recordChunks,{type:mime});
    const path = `recordings/${MEETING_ID}/rec_${Date.now()}.${ext}`;
    const snap = await storage.ref(path).put(blob);
    const url  = await snap.ref.getDownloadURL();
    const dur  = Math.round((Date.now()-startTime)/1000);
    await db.collection("recordings").add({
      meetingId:MEETING_ID, meetingTitle, storagePath:path,
      downloadURL:url, duration:dur, mimeType:mime,
      createdAt:new Date().toISOString(), recordedBy:MY_NAME
    });
    await db.collection("meetings").doc(MEETING_ID)
      .update({hasRecording:true}).catch(()=>{});
    document.getElementById("recLabel").textContent = "Record";
    recBtn.disabled = false;
    toast("✅ Recording saved!", 4000);
  }catch(e){
    console.error("Upload failed:", e);
    document.getElementById("recLabel").textContent = "Record";
    recBtn.disabled = false;
    toast("⚠️ Upload failed: "+e.message, 5000);
  }
}

// ── LEAVE ────────────────────────────────────────────────────
document.getElementById("leaveBtn").onclick = async function(){
  if(recording) stopRecording();
  const dur = Math.round((Date.now()-startTime)/1000);
  try{
    await db.collection("meetings").doc(MEETING_ID).update({
      ...(IS_HOST ? { status:"ended", endedAt:new Date().toISOString() } : {}),
      durationSeconds: dur,
      participantCount: Object.keys(peerConns).length + 1
    });
  }catch(e){}
  cleanup();
  location.href = `/teacher/live-ended.html?reason=${IS_HOST?"ended":"left"}`;
};

function cleanup(){
  unsubs.forEach(u=>{ try{u();}catch(e){} });
  Object.values(peerConns).forEach(pc=>{ try{pc.close();}catch(e){} });
  if(localStream)  localStream.getTracks().forEach(t=>t.stop());
  if(screenStream) screenStream.getTracks().forEach(t=>t.stop());
  db.collection("meetings").doc(MEETING_ID)
    .collection("participants").doc(MY_ID).delete().catch(()=>{});
}

// ── INIT ─────────────────────────────────────────────────────
async function init(){
  setStatus("Connecting…", true);

  // Check meeting exists
  const mSnap = await db.collection("meetings").doc(MEETING_ID).get();
  if(!mSnap.exists || mSnap.data().status === "ended"){
    location.href = "/teacher/live-ended.html?reason=notfound";
    return;
  }
  const md = mSnap.data();
  meetingTitle = md.title || "Impact Live Class";
  roomTitle.textContent  = meetingTitle;
  document.title         = meetingTitle + " | Impact";
  roomIdBadge.textContent = MEETING_ID;
  roomIdBadge.onclick = () => {
    navigator.clipboard.writeText(MEETING_ID).catch(()=>{});
    toast("Meeting ID copied!");
  };
  document.getElementById("inviteIdField").value   = MEETING_ID;
  document.getElementById("inviteLinkField").value =
    `${location.origin}/teacher/live-join.html?id=${MEETING_ID}`;

  // Start local media
  await startLocalStream();
  setStatus("Getting ready…", true);

  // Register in Firestore (this triggers peer connections)
  await registerSelf();

  // Watch for other participants
  watchParticipants();

  if(IS_HOST){
    initRecording();
    setStatus("Waiting for participants…", true);
  } else {
    setStatus("Joining…", true);
  }

  // Log to data centre
  db.collection("classroomUsage").add({
    meetingId:MEETING_ID, meetingTitle, participantName:MY_NAME,
    isHost:IS_HOST, joinedAt:new Date().toISOString(),
    date:new Date().toDateString()
  }).catch(()=>{});
}

init();
})();
</script>
