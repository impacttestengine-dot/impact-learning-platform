<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Placement Reports | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/impact-global-bg.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#05060b;color:#fff;font-family:Inter,sans-serif}
.page{position:relative;z-index:2;width:min(920px,92vw);margin:auto;padding:110px 0 90px}
.nav{position:fixed;top:24px;left:28px;z-index:20;display:flex;gap:12px}
.nav a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:white;text-decoration:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px)}
.hero{text-align:center;margin-bottom:32px}
.hero h1{font-family:"Sorts Mill Goudy",serif;font-size:clamp(2.6rem,6vw,4.4rem);font-weight:400}
.hero p{color:rgba(255,255,255,.65);font-weight:800}
.panel{border-radius:32px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(22px);padding:24px;margin-bottom:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
input,select,textarea,button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);color:white;border-radius:16px;padding:13px 14px;font-family:Inter,sans-serif;font-weight:800}
select option{color:#111}
textarea{width:100%;resize:vertical;font-weight:600}
button{cursor:pointer}
.save-btn{background:rgba(99,179,237,.2);border-color:rgba(99,179,237,.4);color:#90cdf4;margin-top:10px;width:100%}
.search-box{width:100%;margin-bottom:16px}
.report-card{padding:18px 20px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.report-name{font-weight:900;font-size:1rem;margin-bottom:6px}
.level-pill{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(99,179,237,.18);color:#90cdf4;font-size:.72rem;font-weight:900;margin-left:8px}
.report-meta{font-size:.78rem;color:rgba(255,255,255,.55);font-weight:700;line-height:1.7;margin-top:6px;white-space:pre-wrap}
.report-actions{margin-top:10px;display:flex;gap:8px}
.small{padding:8px 12px;font-size:.76rem;border-radius:12px}
.delete{background:rgba(255,80,80,.14)}
.empty{text-align:center;color:rgba(255,255,255,.4);font-weight:700;padding:30px}
@media(max-width:700px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<script src="/js/impact-global-bg.js"></script>
<nav class="nav">
  <a href="/teacher/placements/index.html" title="Back">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M15 5.5 8.5 12 15 18.5"/><path d="M9 12h11"/></svg>
  </a>
  <a href="/teacher/dashboard.html" title="Dashboard">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
  </a>
</nav>

<main class="page">
<section class="hero"><h1>Placement Reports</h1><p>Write up results, comments, and level recommendations.</p></section>

<section class="panel">
  <div class="form-row">
    <input id="learnerName" placeholder="Learner name">
    <select id="recommendedLevel">
      <option value="">Recommended level</option>
      <option>Absolute Beginner</option>
      <option>A0</option><option>A1</option><option>A1.1</option>
      <option>A2</option><option>B1</option><option>B2</option>
    </select>
  </div>
  <textarea id="reportNotes" rows="4" placeholder="Assessment notes, strengths, areas to focus on..."></textarea>
  <button class="save-btn" id="saveBtn" type="button">Save Report</button>
</section>

<section class="panel">
  <input class="search-box" id="searchInput" type="search" placeholder="Search by learner name or level...">
  <div id="reportsList"><div class="empty">Loading reports...</div></div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async()=>{
  const db=firebase.firestore();
  const myName = sessionStorage.getItem("impactAccessName") || sessionStorage.getItem("impactPersonnelName") || "";
  const list=document.getElementById("reportsList");
  let allReports=[];

  async function load(){
    list.innerHTML='<div class="empty">Loading reports...</div>';
    const snap=await db.collection("placementReports").get();
    allReports=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    render(allReports);
  }

  function render(items){
    if(!items.length){ list.innerHTML='<div class="empty">No reports yet.</div>'; return; }
    list.innerHTML="";
    items.forEach(r=>{
      const card=document.createElement("div");
      card.className="report-card";
      card.innerHTML=`
        <div class="report-name">${r.learnerName||"Unknown"}<span class="level-pill">${r.recommendedLevel||"—"}</span></div>
        <div class="report-meta">${r.notes||""}</div>
        <div class="report-meta">By ${r.createdBy||"Unknown"} · ${r.createdAt?new Date(r.createdAt).toLocaleDateString():""}</div>
        <div class="report-actions"><button class="small delete" data-id="${r.id}">Delete</button></div>
      `;
      card.querySelector(".delete").onclick=async()=>{
        if(confirm("Delete this report?")){ await db.collection("placementReports").doc(r.id).delete(); await load(); }
      };
      list.appendChild(card);
    });
  }

  document.getElementById("saveBtn").onclick=async()=>{
    const learnerName=document.getElementById("learnerName").value.trim();
    const recommendedLevel=document.getElementById("recommendedLevel").value;
    const notes=document.getElementById("reportNotes").value.trim();
    if(!learnerName){ alert("Please enter a learner name."); return; }
    const now=new Date();
    await db.collection("placementReports").add({
      learnerName, recommendedLevel, notes,
      createdBy:myName, createdAt:now.toISOString()
    });
    document.getElementById("learnerName").value="";
    document.getElementById("recommendedLevel").value="";
    document.getElementById("reportNotes").value="";
    await load();
  };

  document.getElementById("searchInput").oninput=(e)=>{
    const q=e.target.value.trim().toLowerCase();
    if(!q){ render(allReports); return; }
    render(allReports.filter(r=>[r.learnerName,r.recommendedLevel].join(" ").toLowerCase().includes(q)));
  };

  await load();
});
</script>
<script src="/js/impact-recycle-bin.js"></script>
<script src="/js/impact-route-guard.js?v=inactivity-1hr"></script>
</body>
</html>
