<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Placement Tests | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/impact-global-bg.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#05060b;color:#fff;font-family:Inter,sans-serif}
.page{position:relative;z-index:2;width:min(920px,92vw);margin:auto;padding:110px 0 90px}
.nav{position:fixed;top:24px;left:28px;z-index:20;display:flex;gap:12px}
.nav a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:white;text-decoration:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px)}
.hero{text-align:center;margin-bottom:32px}
.hero h1{font-family:"Sorts Mill Goudy",serif;font-size:clamp(2.6rem,6vw,4.4rem);font-weight:400}
.hero p{color:rgba(255,255,255,.65);font-weight:800}
.panel{border-radius:32px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(22px);padding:24px;margin-bottom:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px}
input,select,textarea,button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);color:white;border-radius:16px;padding:13px 14px;font-family:Inter,sans-serif;font-weight:800}
select option{color:#111}
textarea{width:100%;resize:vertical;font-weight:600}
button{cursor:pointer;transition:.15s}
button:hover{transform:translateY(-1px)}
.add{background:rgba(99,179,237,.2);border-color:rgba(99,179,237,.4);color:#90cdf4}
.list{display:grid;gap:12px}
.test-card{padding:18px 20px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.test-title{font-weight:900;font-size:1rem;margin-bottom:6px}
.test-meta{font-size:.78rem;color:rgba(255,255,255,.55);font-weight:700;line-height:1.6;white-space:pre-wrap}
.test-actions{margin-top:10px;display:flex;gap:8px}
.small{padding:8px 12px;font-size:.76rem;border-radius:12px}
.delete{background:rgba(255,80,80,.14)}
.empty{text-align:center;color:rgba(255,255,255,.4);font-weight:700;padding:30px}
@media(max-width:700px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<script src="/js/impact-global-bg.js"></script>
<nav class="nav">
  <a href="/teacher/placements/index.html" title="Back">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M15 5.5 8.5 12 15 18.5"/><path d="M9 12h11"/></svg>
  </a>
  <a href="/teacher/dashboard.html" title="Dashboard">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
  </a>
</nav>

<main class="page">
<section class="hero"><h1>Placement Tests</h1><p>Create and manage placement assessment templates.</p></section>

<section class="panel">
  <div class="form-row" style="margin-bottom:12px">
    <input id="testName" placeholder="Test name (e.g. Adult Placement — French A0-B2)">
    <select id="testLevel">
      <option value="">Target level range</option>
      <option>Absolute Beginner – A1</option>
      <option>A1 – A2</option>
      <option>A2 – B1</option>
      <option>B1 – B2</option>
      <option>All levels</option>
    </select>
    <button class="add" id="addBtn" type="button">Add Test</button>
  </div>
  <textarea id="testDesc" rows="3" placeholder="Description / instructions for administering this test..."></textarea>
</section>

<section class="panel">
  <div class="list" id="testList"><div class="empty">Loading tests...</div></div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async()=>{
  const db=firebase.firestore();
  const list=document.getElementById("testList");
  const myName = sessionStorage.getItem("impactAccessName") || sessionStorage.getItem("impactPersonnelName") || "";

  async function load(){
    list.innerHTML='<div class="empty">Loading tests...</div>';
    const snap = await db.collection("placementTests").orderBy("createdAt","desc").get().catch(async()=>{
      return await db.collection("placementTests").get();
    });
    const items = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!items.length){ list.innerHTML='<div class="empty">No placement tests yet.</div>'; return; }
    list.innerHTML="";
    items.forEach(t=>{
      const card=document.createElement("div");
      card.className="test-card";
      card.innerHTML=`
        <div class="test-title">${t.name||"Untitled Test"}</div>
        <div class="test-meta">${t.level?"Level range: "+t.level+"\n":""}${t.description||""}</div>
        <div class="test-meta">Created by ${t.createdBy||"Unknown"}</div>
        <div class="test-actions"><button class="small delete" data-id="${t.id}">Delete</button></div>
      `;
      card.querySelector(".delete").onclick=async()=>{
        if(confirm("Delete this test?")){ await db.collection("placementTests").doc(t.id).delete(); await load(); }
      };
      list.appendChild(card);
    });
  }

  document.getElementById("addBtn").onclick=async()=>{
    const name=document.getElementById("testName").value.trim();
    if(!name){ alert("Please enter a test name."); return; }
    const now=new Date();
    await db.collection("placementTests").add({
      name,
      level: document.getElementById("testLevel").value,
      description: document.getElementById("testDesc").value.trim(),
      createdBy: myName,
      createdAt: now.toISOString()
    });
    document.getElementById("testName").value="";
    document.getElementById("testDesc").value="";
    document.getElementById("testLevel").value="";
    await load();
  };

  await load();
});
</script>
<script src="/js/impact-recycle-bin.js"></script>
<script src="/js/impact-route-guard.js?v=inactivity-1hr"></script>
</body>
</html>
