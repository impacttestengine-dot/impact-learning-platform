<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classes | Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sorts+Mill+Goudy&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E13; --surface:#12151C; --surface-hover:#161A23;
    --border:#1F2430; --border-soft:#191D27;
    --text:#E7E9EE; --text-dim:#8B92A3; --text-faint:#565D6E;
    --accent:#6C7CF7; --accent-dim:rgba(108,124,247,0.14);
    --amber:#E8A33D; --amber-dim:rgba(232,163,61,0.14);
    --green:#4ADE9E; --green-dim:rgba(74,222,158,0.14);
    --danger:#F16B6B; --danger-dim:rgba(241,107,107,0.12);
    --radius:10px; --radius-sm:7px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;padding:32px 20px 80px;min-height:100vh;-webkit-font-smoothing:antialiased}
  .page{max-width:960px;margin:0 auto}
  .nav-back{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-dim);text-decoration:none;margin-bottom:18px}
  .nav-back svg{width:15px;height:15px}
  .page-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;gap:8px}
  .page-header h1{font-family:"Sorts Mill Goudy",Georgia,serif;font-size:1.9rem;font-weight:400;color:var(--text)}
  .page-header p{font-size:12.5px;color:var(--text-faint);margin-top:5px}
  .tracker-link{font-size:12px;color:var(--accent);text-decoration:none;font-weight:700}
  .tracker-link:hover{text-decoration:underline}
  .header-meta{font-size:12px;color:var(--text-dim);text-align:right}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}
  .panel-title{font-family:"Sorts Mill Goudy",Georgia,serif;font-size:1.3rem;font-weight:400;margin-bottom:4px}
  .panel-sub{font-size:11.5px;color:var(--text-faint);font-weight:600;margin-bottom:14px}

  .field-label{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;display:block}
  input,select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-family:inherit;padding:9px 11px;border-radius:var(--radius-sm);outline:none;width:100%}
  input::placeholder{color:var(--text-faint)}
  select option{color:#111}
  textarea{min-height:64px;resize:vertical}

  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
  .form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .room-note{font-size:11px;font-weight:600;color:var(--text-faint);margin:-2px 0 10px 2px}

  .add-btn{background:var(--accent);color:#0B0E13;border:none;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:var(--radius-sm);cursor:pointer;transition:opacity .15s ease;width:100%}
  .add-btn:hover{opacity:.88}
  .save-status{text-align:center;min-height:18px;color:var(--green);font-weight:700;font-size:11.5px;margin-top:8px}

  .class-list{display:flex;flex-direction:column;gap:6px}
  .class-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .15s ease,background .15s ease}
  .class-card:hover{border-color:#2A3040;background:var(--surface-hover)}
  .class-card.open{border-color:var(--accent)}

  .class-row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;min-height:46px}

  .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .status-dot.scheduled{background:var(--text-faint)}
  .status-dot.live{background:var(--accent);animation:pulseDot 1.6s ease-in-out infinite}
  .status-dot.completed{background:var(--green)}
  .status-dot.cancelled{background:var(--danger)}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}

  .class-title{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:70px}

  .class-meta-inline{display:flex;align-items:center;gap:14px;margin-left:auto;flex-shrink:0}
  .meta-chip{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);white-space:nowrap}
  .meta-chip svg{width:12px;height:12px;opacity:.7;flex-shrink:0}
  .meta-chip.room-chip{color:#93b8e8;font-weight:700;letter-spacing:.03em}

  .chevron{width:13px;height:13px;color:var(--text-faint);flex-shrink:0;transition:transform .18s ease}
  .class-card.open .chevron{transform:rotate(90deg);color:var(--accent)}

  .class-detail{max-height:0;opacity:0;overflow:hidden;transition:max-height .22s ease,opacity .18s ease,padding .22s ease;padding:0 14px}
  .class-card.open .class-detail,.class-card:hover .class-detail{max-height:520px;opacity:1;padding:0 14px 14px 14px}
  @media (hover:none){
    .class-detail{max-height:0;opacity:0;padding:0 14px}
    .class-card.open .class-detail{max-height:520px;opacity:1;padding:0 14px 14px 14px}
  }

  .detail-inner{border-top:1px solid var(--border-soft);padding-top:12px;margin-left:19px;display:flex;flex-direction:column;gap:10px}
  .detail-row{display:flex;flex-wrap:wrap;gap:18px;font-size:12px}
  .detail-item{display:flex;flex-direction:column;gap:3px}
  .detail-label{color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
  .detail-value{color:var(--text-dim)}
  .detail-value.live-flag{color:var(--green);font-weight:700}

  .detail-actions{display:flex;gap:8px;flex-wrap:wrap}
  .action-btn{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text-dim);cursor:pointer;transition:all .15s ease;font-family:inherit}
  .action-btn svg{width:12px;height:12px}
  .action-btn.primary{color:var(--green);border-color:rgba(74,222,158,.35);background:var(--green-dim)}
  .action-btn.primary.running{color:var(--danger);border-color:rgba(241,107,107,.35);background:var(--danger-dim)}
  .action-btn.copy:hover{border-color:var(--accent);color:var(--accent)}
  .action-btn.copy.copied{color:var(--green);border-color:rgba(74,222,158,.4);background:var(--green-dim)}
  .action-btn.edit:hover{border-color:var(--accent);color:var(--accent)}
  .action-btn.delete:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-dim)}

  .early-box{margin-top:6px;padding:13px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border-soft)}
  .early-box h4{font-size:.82rem;margin-bottom:8px;color:var(--text);font-weight:700}
  .early-box label{font-size:.72rem;font-weight:700;color:var(--text-dim);display:block;margin-bottom:4px}
  .early-box select,.early-box textarea{margin-bottom:9px;font-size:.76rem}
  .early-box textarea{min-height:62px}
  .early-save{width:100%;padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--accent-dim);color:var(--accent);font-weight:700;cursor:pointer;font-family:inherit;font-size:.78rem}

  .class-end-questionnaire{margin-top:6px;padding:13px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border-soft)}
  .class-end-questionnaire h4{font-size:.82rem;margin-bottom:8px;color:var(--text);font-weight:700}
  .class-end-questionnaire label{font-size:.72rem;font-weight:700;color:var(--text-dim);display:block;margin-bottom:4px;margin-top:8px}
  .class-end-questionnaire select,.class-end-questionnaire textarea{font-size:.76rem}
  .q-submit{margin-top:10px;width:100%;padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--accent-dim);color:var(--accent);font-weight:700;cursor:pointer;font-family:inherit;font-size:.78rem}

  .empty{text-align:center;color:var(--text-faint);font-weight:600;padding:26px;font-size:.84rem}

  @media (max-width:640px){
    body{padding:20px 12px 60px}
    .form-grid,.form-grid2{grid-template-columns:1fr 1fr}
    .class-meta-inline{gap:8px}
    .meta-chip span.chip-label{display:none}
  }
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>

<body>
<div class="page">
  <a class="nav-back" href="/teacher/dashboard.html" title="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
  </a>

  <div class="page-header">
    <div>
      <h1>Classes</h1>
      <p>Each class gets its own private meeting room automatically &middot; <a class="tracker-link" href="/teacher/class-logger.html">Class Tracker</a></p>
    </div>
    <div class="header-meta" id="classCount">0 classes</div>
  </div>

  <section class="panel">
    <h2 class="panel-title">Schedule Class</h2>
    <p class="panel-sub">Create an upcoming online class session.</p>

    <form id="classForm">
      <div class="form-grid">
        <div>
          <span class="field-label">Level</span>
          <input id="level" type="text" placeholder="A0">
        </div>
        <div>
          <span class="field-label">Learner</span>
          <input id="learner" type="text" placeholder="Learner name">
        </div>
        <div>
          <span class="field-label">Teacher</span>
          <input id="teacher" type="text" placeholder="Teacher name">
        </div>
      </div>

      <div class="form-grid">
        <div>
          <span class="field-label">Day</span>
          <select id="day" required>
            <option value="">Select Day</option>
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </div>
        <div>
          <span class="field-label">Time</span>
          <input id="time" type="time" required>
        </div>
        <div>
          <span class="field-label">Duration</span>
          <input id="duration" type="text" placeholder="1 hour">
        </div>
      </div>

      <p class="room-note" id="roomNote">A private meeting room is generated automatically for each class.</p>

      <div class="form-grid2">
        <div>
          <span class="field-label">Status</span>
          <select id="status"><option>Scheduled</option><option>Completed</option><option>Cancelled</option></select>
        </div>
        <div></div>
      </div>

      <div style="margin-bottom:10px">
        <span class="field-label">Class Notes</span>
        <textarea id="notes" placeholder="Optional notes"></textarea>
      </div>

      <button class="add-btn" type="submit">Save Class</button>
      <div class="save-status" id="saveStatus"></div>
    </form>
  </section>

  <div class="class-list" id="classList"><div class="empty">Loading classes...</div></div>
</div>

<script src="/js/impact-global-bg.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const db = firebase.firestore();

  const ICONS = {
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.5.4l2-2a5 5 0 00-7-7l-1.1 1.1"/><path d="M14 11a5 5 0 00-7.5-.4l-2 2a5 5 0 007 7l1.1-1.1"/></svg>',
    video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><polygon points="16,10 22,7 22,17 16,14"/></svg>',
    stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>'
  };

  const form = document.getElementById("classForm");
  const level = document.getElementById("level");
  const learner = document.getElementById("learner");
  const teacher = document.getElementById("teacher");
  const day = document.getElementById("day");
  const time = document.getElementById("time");
  const duration = document.getElementById("duration");
  const status = document.getElementById("status");
  const notes = document.getElementById("notes");
  const saveStatus = document.getElementById("saveStatus");
  const classList = document.getElementById("classList");
  const classCount = document.getElementById("classCount");

  let allClasses = [];
  let editingId = null;

  function activeKey(id){ return "impactActiveClass_" + id; }
  function getActive(id){
    try { return JSON.parse(localStorage.getItem(activeKey(id)) || "null"); }
    catch(e){ return null; }
  }
  function setActive(id, data){ localStorage.setItem(activeKey(id), JSON.stringify(data)); }
  function clearActive(id){ localStorage.removeItem(activeKey(id)); }

  function genId(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let id = "";
    for(let i=0;i<3;i++){
      for(let j=0;j<3;j++) id += chars[Math.floor(Math.random()*chars.length)];
      if(i<2) id += "-";
    }
    return id;
  }

  async function ensureMeetingId(item){
    if(item.meetingId) return item.meetingId;
    const newId = genId();
    await db.collection("classes").doc(item.id).set({ meetingId:newId }, { merge:true });
    item.meetingId = newId;
    return newId;
  }

  function joinLinkFor(item){
    const id = item.meetingId || "";
    return location.origin + "/teacher/live-join.html?id=" + id +
      "&name=" + encodeURIComponent(item.learner || "") + "&host=false";
  }

  async function loadClasses(){
    classList.innerHTML = '<div class="empty">Loading classes...</div>';
    const snapshot = await db.collection("classes").orderBy("createdAt","desc").get();
    allClasses = snapshot.docs.map(doc => ({ id:doc.id, ...doc.data() }));
    renderClasses();
  }

  function statusDotClass(item, active){
    if(active) return "live";
    if(item.status === "Completed") return "completed";
    if(item.status === "Cancelled") return "cancelled";
    return "scheduled";
  }

  function renderClasses(){
    classCount.textContent = allClasses.length + (allClasses.length === 1 ? " class" : " classes");

    if(!allClasses.length){
      classList.innerHTML = '<div class="empty">No classes scheduled yet.</div>';
      return;
    }

    classList.innerHTML = "";

    allClasses.forEach(item => {
      const active = getActive(item.id);
      const card = document.createElement("div");
      card.className = "class-card";
      card.dataset.classId = item.id;

      const dotClass = statusDotClass(item, active);

      card.innerHTML =
        '<div class="class-row">' +
          '<div class="status-dot ' + dotClass + '"></div>' +
          '<div class="class-title">' + (item.learner || "Unnamed Learner") + ' \u2014 ' + (item.level || "No level") + '</div>' +
          '<div class="class-meta-inline">' +
            '<span class="meta-chip">' + ICONS.user + '<span class="chip-label">' + (item.teacher || "") + '</span></span>' +
            '<span class="meta-chip">' + ICONS.calendar + '<span class="chip-label">' + (item.day || "") + ' ' + (item.time || "") + '</span></span>' +
            '<span class="meta-chip room-chip">' + ICONS.link + '<span class="chip-label">' + (item.meetingId || "auto") + '</span></span>' +
          '</div>' +
          '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>' +
        '</div>' +
        '<div class="class-detail">' +
          '<div class="detail-inner">' +
            '<div class="detail-row">' +
              '<div class="detail-item"><span class="detail-label">Duration</span><span class="detail-value">' + (item.duration || "") + '</span></div>' +
              '<div class="detail-item"><span class="detail-label">Status</span><span class="detail-value">' + (item.status || "Scheduled") + '</span></div>' +
              '<div class="detail-item"><span class="detail-label">Room</span><span class="detail-value">' + (item.meetingId || "generated on first start") + '</span></div>' +
              (active ? '<div class="detail-item"><span class="detail-label">Live</span><span class="detail-value live-flag">Started ' + (active.startedAtText || "") + '</span></div>' : '') +
              (item.notes ? '<div class="detail-item"><span class="detail-label">Notes</span><span class="detail-value">' + item.notes + '</span></div>' : '') +
            '</div>' +
            '<div class="detail-actions">' +
              '<button type="button" class="action-btn primary open-meet-btn ' + (active ? "running" : "") + '">' + (active ? ICONS.stop + " End Class" : ICONS.video + " Open Meet") + '</button>' +
              '<button type="button" class="action-btn copy copy-link-btn">' + ICONS.copy + ' Copy Student Link</button>' +
              '<button type="button" class="action-btn edit" data-edit="' + item.id + '">' + ICONS.edit + ' Edit</button>' +
              '<button type="button" class="action-btn delete" data-delete="' + item.id + '">' + ICONS.trash + ' Delete</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      card.querySelector(".class-row").addEventListener("click", function(){
        const isOpen = card.classList.contains("open");
        document.querySelectorAll(".class-card.open").forEach(function(el){ el.classList.remove("open"); });
        if(!isOpen) card.classList.add("open");
      });

      card.querySelector(".open-meet-btn").addEventListener("click", function(e){
        e.stopPropagation();
        handleClassStartEnd(item, card);
      });
      card.querySelector(".copy-link-btn").addEventListener("click", function(e){
        e.stopPropagation();
        copyStudentLink(item, e.currentTarget);
      });
      card.querySelector("[data-edit]").addEventListener("click", function(e){
        e.stopPropagation();
        editClass(item);
      });
      card.querySelector("[data-delete]").addEventListener("click", function(e){
        e.stopPropagation();
        deleteClass(item);
      });

      classList.appendChild(card);
    });
  }

  async function copyStudentLink(item, btn){
    await ensureMeetingId(item);
    const link = joinLinkFor(item);
    try{
      await navigator.clipboard.writeText(link);
      const original = btn.innerHTML;
      btn.innerHTML = "Copied!";
      btn.classList.add("copied");
      setTimeout(() => { btn.innerHTML = original; btn.classList.remove("copied"); }, 1600);
    }catch(e){
      prompt("Copy this link:", link);
    }
  }

  async function handleClassStartEnd(item, card){
    const active = getActive(item.id);

    if(!active){
      const meetingId = await ensureMeetingId(item);
      const now = new Date();
      const currentUserName = sessionStorage.getItem("impactAccessName") ||
        sessionStorage.getItem("impactPersonnelName") || item.teacher || "Teacher";

      await db.collection("meetings").doc(meetingId).set({
        meetingId,
        title:(item.learner || "Class") + " \u2014 " + (item.level || ""),
        createdAt:new Date().toISOString(),
        startedAt:new Date().toISOString(),
        endedAt:"",
        status:"active",
        hostName:currentUserName
      }, { merge:true });

      const meetUrl = location.origin + "/teacher/live-room.html?id=" + meetingId +
        "&name=" + encodeURIComponent(currentUserName) + "&host=true";

      const logRef = await db.collection("classTracker").add({
        classId:item.id,
        learner:item.learner || "",
        teacher:item.teacher || "",
        level:item.level || "",
        day:item.day || "",
        time:item.time || "",
        duration:item.duration || "",
        meetRoom:meetingId,
        meetUrl:meetUrl,
        startedAt:now.toISOString(),
        startedAtText:now.toLocaleString(),
        endedAt:"",
        endedAtText:"",
        minutesSpent:0,
        earlyEnd:false,
        earlyEndReason:"",
        earlyEndRemark:"",
        status:"Started"
      });

      setActive(item.id, {
        logId:logRef.id,
        startedAt:now.toISOString(),
        startedAtText:now.toLocaleString()
      });

      window.open(meetUrl, "_blank");
      renderClasses();
      return;
    }

    const startedAt = new Date(active.startedAt);
    const endedAt = new Date();
    const minutesSpent = Math.round((endedAt - startedAt) / 60000);

    if(minutesSpent < 40){
      showEarlyBox(item, card, active, minutesSpent);
      return;
    }

    await finishClass(item, active, minutesSpent, "", "");
    clearActive(item.id);
    renderClasses();
  }

  function showEarlyBox(item, card, active, minutesSpent){
    const old = card.querySelector(".early-box");
    if(old) old.remove();

    card.classList.add("open");

    const detailInner = card.querySelector(".detail-inner");

    const box = document.createElement("div");
    box.className = "early-box";
    box.innerHTML = `
      <h4>Class ended before 40 minutes.</h4>
      <label>Reason</label>
      <select class="early-reason">
        <option value="">Select reason</option>
        <option>Learner did not join</option>
        <option>Internet issue</option>
        <option>Power outage</option>
        <option>Technical issue</option>
        <option>Teacher emergency</option>
        <option>Learner emergency</option>
        <option>Rescheduled</option>
        <option>Other</option>
      </select>
      <textarea class="early-remark" placeholder="Add remark if needed..."></textarea>
      <button type="button" class="early-save">Save Reason & End Class</button>
    `;

    detailInner.appendChild(box);

    box.querySelector(".early-save").onclick = async (e) => {
      e.stopPropagation();
      const reason = box.querySelector(".early-reason").value;
      const remark = box.querySelector(".early-remark").value.trim();

      if(!reason){
        alert("Please select a reason.");
        return;
      }

      await finishClass(item, active, minutesSpent, reason, remark);
      clearActive(item.id);
      renderClasses();
    };
  }

  async function finishClass(item, active, minutesSpent, reason, remark){
    const endedAt = new Date();

    await db.collection("classTracker").doc(active.logId).set({
      endedAt:endedAt.toISOString(),
      endedAtText:endedAt.toLocaleString(),
      minutesSpent,
      earlyEnd:minutesSpent < 40,
      earlyEndReason:reason || "",
      earlyEndRemark:remark || "",
      status:"Ended"
    }, { merge:true });

    await db.collection("classes").doc(item.id).set({
      lastClassStatus:minutesSpent < 40 ? "Ended Early" : "Completed",
      lastClassStartedAt:active.startedAt,
      lastClassEndedAt:endedAt.toISOString(),
      lastClassMinutes:minutesSpent,
      lastEarlyEndReason:reason || "",
      lastEarlyEndRemark:remark || ""
    }, { merge:true });
  }

  function editClass(item){
    editingId = item.id;
    level.value = item.level || "";
    learner.value = item.learner || "";
    teacher.value = item.teacher || "";
    day.value = item.day || "";
    time.value = item.time || "";
    duration.value = item.duration || "";
    status.value = item.status || "Scheduled";
    notes.value = item.notes || "";
    saveStatus.textContent = "Editing selected class \u2014 its meeting room stays the same.";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  async function deleteClass(item){
    if(!confirm("Delete this scheduled class?")) return;
    clearActive(item.id);
    await db.collection("classes").doc(item.id).delete();
    await loadClasses();
  }

  async function saveClass(event){
    event.preventDefault();

    const now = new Date();

    const data = {
      level:level.value.trim(),
      learner:learner.value.trim(),
      teacher:teacher.value.trim(),
      day:day.value,
      time:time.value,
      duration:duration.value.trim(),
      status:status.value,
      notes:notes.value.trim(),
      updatedAt:now.toISOString(),
      updatedAtText:now.toLocaleString()
    };

    if(editingId){
      await db.collection("classes").doc(editingId).set(data,{ merge:true });
    }else{
      await db.collection("classes").add({
        ...data,
        meetingId:genId(),
        createdAt:now.toISOString(),
        createdAtText:now.toLocaleString()
      });
    }

    form.reset();
    editingId = null;
    saveStatus.textContent = "Saved \u2713";
    await loadClasses();

    setTimeout(() => saveStatus.textContent = "", 1400);
  }

  form.addEventListener("submit", saveClass);

  await loadClasses();
});
</script>

<script id="class-end-questionnaire-fix">
document.addEventListener("click", function(e){
  const btn = e.target.closest("button");
  if(!btn) return;
  if((btn.textContent || "").trim().toLowerCase() !== "end class") return;

  const card = btn.closest(".class-card");
  if(!card) return;

  const classId = card.dataset.classId;
  if(!classId) return;

  e.preventDefault();
  e.stopPropagation();
  e.stopImmediatePropagation();

  card.classList.add("open");

  const detailInner = card.querySelector(".detail-inner");
  if(detailInner.querySelector(".class-end-questionnaire")) return;
  if(detailInner.querySelector(".early-box")) return;

  const box = document.createElement("div");
  box.className = "class-end-questionnaire";
  box.innerHTML = `
    <h4>End Class Report</h4>

    <label>Lesson completed?</label>
    <select class="q-completed">
      <option>Yes</option>
      <option>No</option>
    </select>

    <label>Lesson canceled?</label>
    <select class="q-cancelled">
      <option>No</option>
      <option>Yes</option>
    </select>

    <label>Student Participation?</label>
    <select class="q-participation">
      <option>100%</option>
      <option>83%</option>
      <option>67%</option>
      <option>50%</option>
      <option>33%</option>
      <option>0%</option>
    </select>

    <label>Remarks</label>
    <textarea class="q-remarks" placeholder="Add teacher remarks..."></textarea>

    <button type="button" class="q-submit">Submit & End Class</button>
  `;

  detailInner.appendChild(box);

  box.querySelector(".q-submit").onclick = async function(e2){
    e2.stopPropagation();
    const active = JSON.parse(localStorage.getItem("impactActiveClass_" + classId) || "null");
    const endedAt = new Date();
    const startedAt = active?.startedAt ? new Date(active.startedAt) : endedAt;
    const minutesSpent = Math.round((endedAt - startedAt) / 60000);

    const report = {
      lessonCompleted: box.querySelector(".q-completed").value,
      lessonCanceled: box.querySelector(".q-cancelled").value,
      studentParticipation: box.querySelector(".q-participation").value,
      teacherRemarks: box.querySelector(".q-remarks").value.trim()
    };

    const db = firebase.firestore();

    if(active?.logId){
      await db.collection("classTracker").doc(active.logId).set({
        endedAt: endedAt.toISOString(),
        endedAtText: endedAt.toLocaleString(),
        minutesSpent,
        status: "Ended",
        ...report
      }, { merge:true });
    }else{
      await db.collection("classTracker").add({
        classId,
        endedAt: endedAt.toISOString(),
        endedAtText: endedAt.toLocaleString(),
        minutesSpent,
        status: "Ended",
        ...report
      });
    }

    localStorage.removeItem("impactActiveClass_" + classId);
    alert("Class report submitted and tracked.");
    location.reload();
  };
}, true);
</script>
