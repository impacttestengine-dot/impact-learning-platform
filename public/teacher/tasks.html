<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Tasks — Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E13; --surface:#12151C; --surface-hover:#161A23;
    --border:#1F2430; --border-soft:#191D27;
    --text:#E7E9EE; --text-dim:#8B92A3; --text-faint:#565D6E;
    --accent:#6C7CF7; --accent-dim:rgba(108,124,247,0.14);
    --amber:#E8A33D; --amber-dim:rgba(232,163,61,0.14);
    --green:#4ADE9E; --green-dim:rgba(74,222,158,0.14);
    --danger:#F16B6B; --danger-dim:rgba(241,107,107,0.12);
    --radius:10px; --radius-sm:7px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;padding:32px 20px 80px;min-height:100vh;-webkit-font-smoothing:antialiased}
  .page{max-width:880px;margin:0 auto}
  .nav-back{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-dim);text-decoration:none;margin-bottom:18px}
  .nav-back svg{width:15px;height:15px}
  .page-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;gap:8px}
  .page-header h1{font-family:"Sorts Mill Goudy",Georgia,serif;font-size:1.9rem;font-weight:400;color:var(--text)}
  .page-header p{font-size:12.5px;color:var(--text-faint);margin-top:5px}
  .header-meta{font-size:12px;color:var(--text-dim);text-align:right}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}

  .field-label{font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;display:block}
  input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-family:inherit;padding:9px 11px;border-radius:var(--radius-sm);outline:none;width:100%}
  input::placeholder{color:var(--text-faint)}
  select option{color:#111}
  input[type="date"]{color-scheme:dark}

  .title-row{margin-bottom:10px}
  .grid-row{display:grid;grid-template-columns:1fr 1fr 120px auto;gap:8px;margin-bottom:10px}
  .notes-row{margin-bottom:2px}

  .add-btn{background:var(--accent);color:#0B0E13;border:none;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;transition:opacity .15s ease}
  .add-btn:hover{opacity:.88}

  .qty-row{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .qty-row.show{display:grid}
  .qty-hint{display:none;font-size:11px;font-weight:600;color:var(--text-faint);margin:-4px 0 8px 2px}
  .qty-hint.show{display:block}
  .deliverable-hint{font-size:11px;font-weight:600;color:var(--text-faint);margin:-5px 0 10px 2px}

  .filters{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
  .filter-tab{font-size:12.5px;color:var(--text-dim);background:transparent;border:none;padding:6px 12px;border-radius:999px;cursor:pointer;transition:all .15s ease;font-family:inherit}
  .filter-tab:hover{color:var(--text);background:var(--surface)}
  .filter-tab.active{color:var(--accent);background:var(--accent-dim);font-weight:700}

  .task-list{display:flex;flex-direction:column;gap:6px}
  .task{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .15s ease,background .15s ease}
  .task:hover{border-color:#2A3040;background:var(--surface-hover)}
  .task.open{border-color:var(--accent)}

  .task-row{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;min-height:44px}

  .task-check{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--text-faint);flex-shrink:0;cursor:pointer;transition:all .15s ease;display:grid;place-items:center}
  .task-check svg{width:10px;height:10px;stroke:#0B0E13;stroke-width:3;fill:none;opacity:0}
  .task-check:hover{border-color:var(--accent)}
  .task-check.checked{background:var(--green);border-color:var(--green)}
  .task-check.checked svg{opacity:1}
  .task-check.locked{cursor:default;opacity:.55}

  .status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .status-dot.pending{background:var(--text-faint)}
  .status-dot.overdue{background:var(--danger)}
  .status-dot.auto{background:var(--accent)}
  .status-dot.done{background:var(--green)}
  .status-dot.early{background:var(--green)}
  .status-dot.ontime{background:var(--accent)}
  .status-dot.late{background:var(--amber)}
  .status-dot.never{background:var(--danger)}

  .task-title{font-size:13.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:60px}

  .task-meta-inline{display:flex;align-items:center;gap:14px;margin-left:auto;flex-shrink:0}
  .meta-chip{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);white-space:nowrap}
  .meta-chip svg{width:12px;height:12px;opacity:.7;flex-shrink:0}

  .progress-inline{display:flex;align-items:center;gap:6px;width:64px;flex-shrink:0}
  .progress-track{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:var(--accent);border-radius:2px}
  .progress-num{font-size:10.5px;color:var(--text-faint);flex-shrink:0;font-variant-numeric:tabular-nums}

  .chevron{width:13px;height:13px;color:var(--text-faint);flex-shrink:0;transition:transform .18s ease}
  .task.open .chevron{transform:rotate(90deg);color:var(--accent)}

  .task-detail{max-height:0;opacity:0;overflow:hidden;transition:max-height .22s ease,opacity .18s ease,padding .22s ease;padding:0 14px}
  .task.open .task-detail,.task:hover .task-detail{max-height:320px;opacity:1;padding:0 14px 14px 14px}
  @media (hover:none){
    .task-detail{max-height:0;opacity:0;padding:0 14px}
    .task.open .task-detail{max-height:320px;opacity:1;padding:0 14px 14px 14px}
  }

  .detail-inner{border-top:1px solid var(--border-soft);padding-top:12px;margin-left:28px;display:flex;flex-direction:column;gap:10px}
  .detail-row{display:flex;flex-wrap:wrap;gap:18px;font-size:12px}
  .detail-item{display:flex;flex-direction:column;gap:3px}
  .detail-label{color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
  .detail-value{color:var(--text-dim)}
  .detail-notes{font-size:12.5px;color:var(--text-dim);line-height:1.5;background:var(--bg);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:8px 10px}

  .detail-actions{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
  .action-btn{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text-dim);cursor:pointer;transition:all .15s ease;font-family:inherit}
  .action-btn svg{width:12px;height:12px}
  .action-btn.edit:hover{border-color:var(--accent);color:var(--accent)}
  .action-btn.delete:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-dim)}
  .action-btn.go{color:var(--accent);border-color:transparent;background:var(--accent-dim);margin-left:auto}
  .action-btn.go:hover{opacity:.85}

  .badge-auto{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-dim);padding:3px 8px;border-radius:999px}
  .badge-auto svg{width:10px;height:10px}

  .empty{text-align:center;color:var(--text-faint);font-weight:600;padding:26px;font-size:.84rem}

  @media (max-width:640px){
    body{padding:20px 12px 60px}
    .grid-row{grid-template-columns:1fr 1fr}
    .task-meta-inline{gap:8px}
    .meta-chip span.chip-label{display:none}
    .progress-inline{width:44px}
    .task-title{min-width:40px}
  }
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<div class="page">
  <a class="nav-back" href="/teacher/dashboard.html" title="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
  </a>

  <div class="page-header">
    <div>
      <h1>Team Tasks</h1>
      <p>Real platform deliverables — linked ones tick themselves off</p>
    </div>
    <div class="header-meta" id="headerMeta"></div>
  </div>

  <section class="panel">
    <form id="taskForm">
      <div class="title-row">
        <input id="taskTitle" type="text" placeholder="Task title" required>
      </div>
      <div class="grid-row">
        <select id="deliverableType">
          <option value="">No linked deliverable</option>
          <option value="lessonPlan">Create a Lesson Plan</option>
          <option value="activity">Create an Activity</option>
          <option value="delfMock">Create a DELF Mock</option>
          <option value="marking">Clear Marking Queue</option>
          <option value="classLogged">Log a Class</option>
          <option value="teamDoc">Upload a Team Document</option>
          <option value="recording">Upload/Review a Recording</option>
          <option value="kpi">Review KPIs</option>
          <option value="other">Other</option>
        </select>
        <select id="assignedTo" required>
          <option value="">Assign to...</option>
        </select>
        <input id="dueDate" type="date" required>
        <button class="add-btn" type="submit">Add task</button>
      </div>
      <p class="deliverable-hint" id="deliverableHint">Linked deliverables auto-complete when the real thing is created — no manual tick needed.</p>

      <div class="qty-row" id="qtyRow">
        <div>
          <span class="field-label">Quantity needed</span>
          <input id="expectedQty" type="number" min="1" max="999" placeholder="1">
        </div>
        <div>
          <span class="field-label">Level (optional)</span>
          <select id="expectedLevel">
            <option value="">Any level</option>
            <option value="Absolute Beginner">Absolute Beginner</option>
            <option value="A0">A0</option>
            <option value="A1">A1</option>
            <option value="A1.1">A1.1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
          </select>
        </div>
      </div>
      <p class="qty-hint" id="qtyHint">Leave blank to read these from the title instead.</p>

      <div class="notes-row">
        <input id="taskNotes" type="text" placeholder="Notes (optional)">
      </div>
    </form>
  </section>

  <div class="filters" id="filterRow">
    <button class="filter-tab active" data-filter="all" type="button">All</button>
    <button class="filter-tab" data-filter="pending" type="button">Pending</button>
    <button class="filter-tab" data-filter="completed" type="button">Completed</button>
    <button class="filter-tab" data-filter="overdue" type="button">Overdue</button>
    <button class="filter-tab" data-filter="auto" type="button">Auto-tracked</button>
  </div>

  <div class="task-list" id="taskList"><div class="empty">Loading tasks...</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async function(){
  const db=firebase.firestore();

  const form=document.getElementById("taskForm");
  const taskTitle=document.getElementById("taskTitle");
  const deliverableType=document.getElementById("deliverableType");
  const assignedTo=document.getElementById("assignedTo");
  const dueDate=document.getElementById("dueDate");
  const taskNotes=document.getElementById("taskNotes");
  const expectedQty=document.getElementById("expectedQty");
  const expectedLevel=document.getElementById("expectedLevel");
  const qtyRow=document.getElementById("qtyRow");
  const qtyHint=document.getElementById("qtyHint");
  const list=document.getElementById("taskList");
  const filterRow=document.getElementById("filterRow");
  const headerMeta=document.getElementById("headerMeta");

  const ICONS = {
    chevron: '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>',
    bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>'
  };

  const DELIVERABLE_LABELS = {
    lessonPlan:"Lesson Plan", activity:"Activity", delfMock:"DELF Mock",
    marking:"Marking Queue", classLogged:"Logged Class", teamDoc:"Team Document",
    recording:"Recording", kpi:"KPI Review", other:"Other"
  };
  const DELIVERABLE_LINKS = {
    lessonPlan:"/teacher/lesson-builder.html", activity:"/teacher/activity-builder.html",
    delfMock:"/teacher/delf-mock-builder.html", marking:"/teacher/marking.html",
    classLogged:"/teacher/classes.html", teamDoc:"/teacher/team-docs.html",
    recording:"/teacher/recordings.html", kpi:"/teacher/kpis.html"
  };
  const AUTO_TYPES = new Set(["lessonPlan","activity","delfMock","marking","classLogged","teamDoc"]);
  const TIMELINESS_INFO = {
    early:{label:"Early", cls:"early"},
    ontime:{label:"On time", cls:"ontime"},
    late:{label:"Late", cls:"late"},
    never:{label:"Never Completed", cls:"never"}
  };

  function parseTargetQty(title){
    const m = String(title || "").match(/^(\d+)\b/);
    const n = m ? parseInt(m[1], 10) : 1;
    return (n > 0 && n < 1000) ? n : 1;
  }

  const KNOWN_LEVELS = ["Absolute Beginner","A1.1","A0","A1","A2","B1","B2"];
  function parseTargetLevel(title){
    const t = String(title || "");
    for(const lvl of KNOWN_LEVELS){
      const escaped = lvl.replace(/\./g, "\\.");
      const re = new RegExp("(^|[^A-Za-z0-9])" + escaped + "([^A-Za-z0-9]|$)", "i");
      if(re.test(t)) return lvl;
    }
    return null;
  }

  function updateQtyRowVisibility(){
    const show = AUTO_TYPES.has(deliverableType.value);
    qtyRow.classList.toggle("show", show);
    qtyHint.classList.toggle("show", show);
  }
  deliverableType.addEventListener("change", updateQtyRowVisibility);

  let tasks=[];
  let currentFilter="all";

  function namesMatch(a, b){
    if(!a || !b) return false;
    a = String(a).trim().toLowerCase();
    b = String(b).trim().toLowerCase();
    if(!a || !b) return false;
    return a === b || b.includes(a) || a.includes(b);
  }

  function fmtDateCompact(v){
    if(!v) return "";
    const d=new Date(v);
    if(isNaN(d)) return "";
    return d.toLocaleDateString(undefined,{day:"2-digit",month:"short"});
  }

  function fmtDateFull(v){
    if(!v) return "";
    const d=new Date(v);
    if(isNaN(d)) return v;
    return d.toLocaleDateString();
  }

  function isOverdue(t){
    if(t.completed || !t.dueDate) return false;
    const due = new Date(t.dueDate);
    const today = new Date(); today.setHours(0,0,0,0);
    return due < today;
  }

  async function loadPersonnel(){
    try{
      const snap = await db.collection("impactPasskeys").where("role","!=","Learner").get();
      const names = snap.docs.map(d=>d.data().name).filter(Boolean).sort();
      assignedTo.innerHTML = '<option value="">Assign to...</option>' + names.map(function(n){ return '<option value="'+n+'">'+n+'</option>'; }).join("");
    }catch(e){ console.warn("Could not load personnel list:", e); }
  }

  async function checkAutoCompletions(taskList){
    const autoTasks = taskList.filter(t => AUTO_TYPES.has(t.deliverableType) && !t.completed);
    if(!autoTasks.length) return [];

    const [lessonSnap, activitySnap, delfSnap, completionsSnap, trackerSnap, teamDocsSnap] = await Promise.all([
      db.collection("lessonPlans").get().catch(()=>({docs:[]})),
      db.collection("activityPlans").get().catch(()=>({docs:[]})),
      db.collection("delfMocks").get().catch(()=>({docs:[]})),
      db.collection("learnerCompletions").get().catch(()=>({docs:[]})),
      db.collection("classTracker").get().catch(()=>({docs:[]})),
      db.collection("teamDocs").get().catch(()=>({docs:[]}))
    ]);

    const lessons = lessonSnap.docs.map(d=>d.data());
    const activities = activitySnap.docs.map(d=>d.data());
    const delfMocks = delfSnap.docs.map(d=>d.data());
    const completions = completionsSnap.docs.map(d=>d.data());
    const classes = trackerSnap.docs.map(d=>d.data());
    const teamDocs = teamDocsSnap.docs.map(d=>d.data());

    const justCompleted = [];

    for(const t of autoTasks){
      const taskCreated = new Date(t.createdAt || 0);
      const target = (t.expectedQty && t.expectedQty > 0) ? t.expectedQty : parseTargetQty(t.title);
      const targetLevel = t.expectedLevel || parseTargetLevel(t.title);
      let count = 0;

      if(t.deliverableType === "lessonPlan"){
        count = lessons.filter(l => namesMatch(t.assignedTo, l.createdByTeacher) && new Date(l.updatedAt||0) >= taskCreated && (!targetLevel || (l.level||"").trim() === targetLevel)).length;
      }
      if(t.deliverableType === "activity"){
        count = activities.filter(a => namesMatch(t.assignedTo, a.createdByTeacher) && new Date(a.updatedAt||0) >= taskCreated && (!targetLevel || (a.level||"").trim() === targetLevel)).length;
      }
      if(t.deliverableType === "delfMock"){
        count = delfMocks.filter(m => namesMatch(t.assignedTo, m.createdByTeacher) && new Date(m.updatedAt||0) >= taskCreated && (!targetLevel || (m.level||"").trim() === targetLevel)).length;
      }
      if(t.deliverableType === "marking"){
        const relevant = completions.filter(c => namesMatch(t.assignedTo, c.itemCreatedByTeacher));
        const stillUngraded = relevant.filter(c => c.score === null || c.score === undefined);
        const queueCleared = relevant.length > 0 && stillUngraded.length === 0;
        count = queueCleared ? target : 0;
      }
      if(t.deliverableType === "classLogged"){
        count = classes.filter(c => namesMatch(t.assignedTo, c.teacher) && new Date(c.startedAt||0) >= taskCreated).length;
      }
      if(t.deliverableType === "teamDoc"){
        count = teamDocs.filter(d => namesMatch(t.assignedTo, d.uploadedBy) && new Date(d.uploadedAt||0) >= taskCreated).length;
      }

      t._autoProgress = { count: count, target: target };

      if(count >= target){
        const now = new Date();
        const payload = {
          completed: true,
          completedAt: now.toISOString(),
          completedAtText: now.toLocaleString(),
          completedVia: "auto"
        };
        Object.assign(t, payload);
        await db.collection("tasks").doc(t.id).set(payload, {merge:true});
        justCompleted.push(t.title);
      }
    }

    return justCompleted;
  }

  function getProgressTuple(t){
    const isAuto = AUTO_TYPES.has(t.deliverableType);
    if(!t.completed && t._autoProgress){
      return [t._autoProgress.count, t._autoProgress.target];
    }
    const target = isAuto ? ((t.expectedQty && t.expectedQty > 0) ? t.expectedQty : parseTargetQty(t.title)) : 1;
    return [t.completed ? target : 0, target];
  }

  function getDotInfo(t, overdue, timelinessInfo){
    if(timelinessInfo) return { cls: timelinessInfo.cls, label: timelinessInfo.label };
    if(t.completed) return { cls: "done", label: "Completed" };
    if(overdue) return { cls: "overdue", label: "Overdue" };
    if(AUTO_TYPES.has(t.deliverableType)) return { cls: "auto", label: "Auto-tracked" };
    return { cls: "pending", label: "Pending" };
  }

  async function load(){
    list.innerHTML='<div class="empty">Loading tasks...</div>';
    const snap=await db.collection("tasks").get();
    tasks=snap.docs.map(d=>({id:d.id,...d.data()}));

    await checkAutoCompletions(tasks);

    render();
  }

  function updateHeaderMeta(){
    const pending = tasks.filter(t=>!t.completed).length;
    const overdue = tasks.filter(t=>isOverdue(t)).length;
    headerMeta.textContent = pending + " pending" + (overdue ? " \u00b7 " + overdue + " overdue" : "");
  }

  function render(){
    updateHeaderMeta();

    let filtered = tasks;
    if(currentFilter==="pending") filtered = tasks.filter(t=>!t.completed);
    if(currentFilter==="completed") filtered = tasks.filter(t=>t.completed);
    if(currentFilter==="overdue") filtered = tasks.filter(t=>isOverdue(t));
    if(currentFilter==="auto") filtered = tasks.filter(t=>AUTO_TYPES.has(t.deliverableType));

    filtered = filtered.slice().sort(function(a,b){
      function tier(t){
        if(t.source === "academicCalendar" && t.timeliness === "never") return 2;
        if(t.completed) return 2;
        return isOverdue(t) ? 0 : 1;
      }
      const ta = tier(a), tb = tier(b);
      if(ta !== tb) return ta - tb;
      const ad = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
      const bd = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
      return ad - bd;
    });

    if(!filtered.length){
      list.innerHTML='<div class="empty">No tasks here.</div>';
      return;
    }

    list.innerHTML="";

    filtered.forEach(function(t){
      const done=!!t.completed;
      const overdue=isOverdue(t);
      const isAuto = AUTO_TYPES.has(t.deliverableType);
      const isCalendarSourced = t.source === "academicCalendar";
      const isLocked = isAuto || isCalendarSourced;
      const timelinessInfo = isCalendarSourced ? TIMELINESS_INFO[t.timeliness] : null;
      const dotInfo = getDotInfo(t, overdue, timelinessInfo);
      const progress = getProgressTuple(t);
      const pct = progress[1] ? Math.round((progress[0] / progress[1]) * 100) : 0;
      const deliverableLabel = DELIVERABLE_LABELS[t.deliverableType] || "";
      const deliverableLink = DELIVERABLE_LINKS[t.deliverableType] || "";

      const row=document.createElement("div");
      row.className="task";

      const linkedBadge = isAuto ? ('<span class="badge-auto">' + ICONS.bolt + ' ' + deliverableLabel + '</span>') : '';

      row.innerHTML =
        '<div class="task-row">' +
          '<div class="task-check ' + (done?'checked':'') + ' ' + (isLocked?'locked':'') + '" title="' + (isLocked?'Auto-tracked \u2014 ticks itself':'Mark complete') + '"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>' +
          '<div class="status-dot ' + dotInfo.cls + '"></div>' +
          '<div class="task-title">' + (t.title||"Untitled Task") + '</div>' +
          '<div class="task-meta-inline">' +
            '<div class="meta-chip">' + ICONS.user + '<span class="chip-label">' + (t.assignedTo||"Unassigned") + '</span></div>' +
            '<div class="meta-chip">' + ICONS.calendar + '<span class="chip-label">' + fmtDateCompact(t.dueDate) + '</span></div>' +
            '<div class="progress-inline">' +
              '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
              '<div class="progress-num">' + progress[0] + '/' + progress[1] + '</div>' +
            '</div>' +
          '</div>' +
          ICONS.chevron +
        '</div>' +
        '<div class="task-detail">' +
          '<div class="detail-inner">' +
            '<div class="detail-row">' +
              '<div class="detail-item"><span class="detail-label">Status</span><span class="detail-value">' + dotInfo.label + '</span></div>' +
              '<div class="detail-item"><span class="detail-label">Assigned to</span><span class="detail-value">' + (t.assignedTo||"Unassigned") + '</span></div>' +
              '<div class="detail-item"><span class="detail-label">Due</span><span class="detail-value">' + fmtDateFull(t.dueDate) + '</span></div>' +
              (t.completedAtText ? ('<div class="detail-item"><span class="detail-label">Completed</span><span class="detail-value">' + t.completedAtText + (t.completedVia==='auto'?' (auto)':t.completedVia==='calendar'?' (via calendar)':'') + '</span></div>') : '') +
              (isAuto ? ('<div class="detail-item"><span class="detail-label">Linked deliverable</span><span class="detail-value">' + linkedBadge + '</span></div>') : '') +
            '</div>' +
            (t.notes ? ('<div class="detail-notes">' + t.notes + '</div>') : '') +
            '<div class="detail-actions">' +
              (isCalendarSourced
                ? ('<a class="action-btn go" href="/teacher/academic-calendar.html">Edit on Calendar ' + ICONS.arrow + '</a>')
                : ('<button class="action-btn edit" type="button">' + ICONS.edit + ' Edit</button>' +
                   '<button class="action-btn delete" type="button">' + ICONS.trash + ' Delete</button>' +
                   (deliverableLink && !done ? ('<a class="action-btn go" href="' + deliverableLink + '">Go do this ' + ICONS.arrow + '</a>') : ''))) +
            '</div>' +
          '</div>' +
        '</div>';

      row.querySelector(".task-row").addEventListener("click", function(){
        const isOpen = row.classList.contains("open");
        document.querySelectorAll(".task.open").forEach(function(el){ el.classList.remove("open"); });
        if(!isOpen) row.classList.add("open");
      });

      const checkBtn = row.querySelector(".task-check");
      checkBtn.addEventListener("click", async function(e){
        e.stopPropagation();
        if(isLocked) return;
        const now=new Date();
        await db.collection("tasks").doc(t.id).set({
          completed:!done,
          completedAt:!done ? now.toISOString() : "",
          completedAtText:!done ? now.toLocaleString() : "",
          completedVia: !done ? "manual" : "",
          updatedAt:now.toISOString()
        },{merge:true});
        await load();
      });

      const editBtn = row.querySelector(".edit");
      if(editBtn){
        editBtn.addEventListener("click", function(e){
          e.stopPropagation();
          taskTitle.value=t.title||"";
          deliverableType.value=t.deliverableType||"";
          assignedTo.value=t.assignedTo||"";
          dueDate.value=t.dueDate||"";
          taskNotes.value=t.notes||"";
          expectedQty.value=t.expectedQty||"";
          expectedLevel.value=t.expectedLevel||"";
          updateQtyRowVisibility();
          form.dataset.editing=t.id;
          taskTitle.focus();
        });
      }

      const deleteBtn = row.querySelector(".delete");
      if(deleteBtn){
        deleteBtn.addEventListener("click", async function(e){
          e.stopPropagation();
          if(confirm("Delete this task?")){
            await db.collection("tasks").doc(t.id).delete();
            await load();
          }
        });
      }

      list.appendChild(row);
    });
  }

  filterRow.addEventListener("click", function(e){
    const chip = e.target.closest(".filter-tab");
    if(!chip) return;
    document.querySelectorAll(".filter-tab").forEach(function(c){ c.classList.remove("active"); });
    chip.classList.add("active");
    currentFilter = chip.dataset.filter;
    render();
  });

  form.onsubmit=async function(e){
    e.preventDefault();
    const now=new Date();

    const data={
      title:taskTitle.value.trim(),
      deliverableType:deliverableType.value,
      assignedTo:assignedTo.value,
      dueDate:dueDate.value,
      notes:taskNotes.value.trim(),
      expectedQty: parseInt(expectedQty.value, 10) || 1,
      expectedLevel: expectedLevel.value || "",
      completed:false,
      updatedAt:now.toISOString(),
      updatedAtText:now.toLocaleString()
    };

    const editing=form.dataset.editing;

    if(editing){
      await db.collection("tasks").doc(editing).set(data,{merge:true});
      delete form.dataset.editing;
    }else{
      await db.collection("tasks").add(Object.assign({}, data, {
        createdAt:now.toISOString(),
        createdAtText:now.toLocaleString()
      }));
    }

    form.reset();
    updateQtyRowVisibility();
    await load();
  };

  await loadPersonnel();
  await load();
});
</script>

<script src="/js/impact-route-guard.js?v=inactivity-1hr"></script>
</body>
</html>
