<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tasks | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/impact-global-bg.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#05060b;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.page{position:relative;z-index:2;width:min(880px,92vw);margin:0 auto;padding:100px 0 80px}
.nav{position:fixed;top:20px;left:24px;z-index:50;display:flex;gap:10px}
.nav a{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;text-decoration:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(18px)}
.nav a svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2}

.hero{text-align:center;margin-bottom:24px}
.hero h1{font-family:"Sorts Mill Goudy",serif;font-size:clamp(2.2rem,4.4vw,3.2rem);font-weight:400}
.hero p{font-weight:700;color:rgba(255,255,255,.5);font-size:.82rem;margin-top:4px}

.panel{border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);padding:16px;margin-bottom:16px}

.form-row{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-bottom:10px}
.form-row2{display:grid;grid-template-columns:1fr 130px auto;gap:10px}
input,select,button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;font-family:Inter,sans-serif;font-size:.82rem}
select option{color:#111}
input::placeholder{color:rgba(255,255,255,.35)}
input[type="date"]{color-scheme:dark}
button{cursor:pointer;transition:.15s ease}
button:hover{background:rgba(255,255,255,.12)}
button:active{transform:scale(.96)}
.add-btn{background:rgba(139,92,246,.22);border-color:rgba(139,92,246,.42);color:#c4b5fd;font-weight:800}
.deliverable-hint{font-size:.68rem;font-weight:600;color:rgba(255,255,255,.35);margin-top:-3px;margin-bottom:10px;padding-left:2px}

.qty-row{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.qty-row.show{display:grid}
.qty-field label{display:block;font-size:.62rem;font-weight:800;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;padding-left:2px}
.qty-field input,.qty-field select{width:100%}
.qty-hint{display:none;font-size:.66rem;font-weight:600;color:rgba(255,255,255,.32);margin-top:-2px;margin-bottom:10px;padding-left:2px}
.qty-hint.show{display:block}

.filter-row{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.filter-chip{padding:6px 13px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.55);font-size:.72rem;font-weight:800;cursor:pointer;transition:.15s}
.filter-chip.active{background:rgba(99,179,237,.18);border-color:rgba(99,179,237,.38);color:#90cdf4}

.list{display:flex;flex-direction:column;gap:8px}

.task-row{border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);overflow:hidden;transition:background .15s ease,border-color .15s ease;cursor:pointer}
.task-row:hover{background:rgba(255,255,255,.07)}
.task-row.overdue{border-color:rgba(239,68,68,.32)}
.task-row.auto{border-left:2px solid rgba(139,92,246,.45)}
.task-row.calendar-sourced{border-left:2px solid rgba(99,179,237,.45)}

.task-summary{display:flex;align-items:center;gap:9px;padding:11px 13px}
.task-check{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);cursor:pointer;flex-shrink:0}
.task-check svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3;opacity:0}
.task-check.done{background:rgba(132,204,22,.25);border-color:rgba(132,204,22,.5)}
.task-check.done svg{opacity:1}
.task-check.auto-locked{cursor:default;opacity:.75}

.task-summary-title{flex:1;min-width:0;font-weight:800;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mini-badge{flex-shrink:0;padding:3px 9px;border-radius:999px;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.mini-badge.pending{background:rgba(255,255,255,.09);color:rgba(255,255,255,.55)}
.mini-badge.completed{background:rgba(132,204,22,.2);color:#bef264}
.mini-badge.overdue{background:rgba(239,68,68,.2);color:#fca5a5}
.mini-badge.early{background:rgba(34,197,94,.2);color:#86efac}
.mini-badge.ontime{background:rgba(99,179,237,.2);color:#93c5fd}
.mini-badge.late{background:rgba(251,191,36,.2);color:#fde68a}
.mini-badge.never{background:rgba(239,68,68,.2);color:#fca5a5}

.task-summary-due{flex-shrink:0;font-size:.68rem;font-weight:700;color:rgba(255,255,255,.4)}

.chevron{flex-shrink:0;width:14px;height:14px;fill:none;stroke:rgba(255,255,255,.3);stroke-width:2.2;transition:transform .25s ease}
.task-row.pinned .chevron{transform:rotate(180deg)}
@media (hover:hover){
  .task-row:hover .chevron{transform:rotate(180deg)}
}

.task-details{max-height:0;overflow:hidden;opacity:0;transition:max-height .32s ease,opacity .22s ease;padding:0 13px}
.task-row.pinned .task-details{max-height:700px;opacity:1;padding:0 13px 14px}
@media (hover:hover){
  .task-row:hover .task-details{max-height:700px;opacity:1;padding:0 13px 14px}
}

.meta{font-size:.74rem;color:rgba(255,255,255,.55);font-weight:700;line-height:1.7}
.badges-row{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);font-size:.66rem;font-weight:900}
.badge.auto-badge{background:rgba(139,92,246,.18);color:#c4b5fd}

.deliverable-link,.calendar-link{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:800;color:#90cdf4;text-decoration:none;border-bottom:1px solid rgba(144,205,244,.35)}
.deliverable-link:hover,.calendar-link:hover{color:#bfe3ff}

.task-actions{display:flex;gap:6px;margin-top:10px}
.icon-btn{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.65);display:grid;place-items:center;cursor:pointer;transition:.15s ease}
.icon-btn svg{width:13px;height:13px}
.icon-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.icon-btn.delete:hover{background:rgba(255,80,80,.18);border-color:rgba(255,100,100,.35);color:#fca5a5}

.empty{text-align:center;color:rgba(255,255,255,.45);font-weight:700;padding:26px;font-size:.84rem}

@media(max-width:700px){
  .form-row,.form-row2,.qty-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<script src="/js/impact-global-bg.js"></script>
<nav class="nav">
  <a href="/teacher/dashboard.html" title="Dashboard">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
  </a>
</nav>

<main class="page">
  <section class="hero">
    <h1>Team Tasks</h1>
    <p>Real platform deliverables. They tick themselves off when done.</p>
  </section>

  <section class="panel">
    <form id="taskForm">
      <div class="form-row">
        <input id="taskTitle" placeholder="Task title" required>
        <select id="deliverableType">
          <option value="">No linked deliverable (manual tick)</option>
          <option value="lessonPlan">Create a Lesson Plan</option>
          <option value="activity">Create an Activity</option>
          <option value="delfMock">Create a DELF Mock</option>
          <option value="marking">Clear Marking Queue</option>
          <option value="classLogged">Log a Class</option>
          <option value="teamDoc">Upload a Team Document</option>
          <option value="recording">Upload/Review a Recording (manual)</option>
          <option value="kpi">Review KPIs (manual)</option>
          <option value="other">Other (manual)</option>
        </select>
      </div>
      <p class="deliverable-hint" id="deliverableHint">Linked deliverables auto-complete when the real thing is created — no manual tick needed.</p>
      <div class="qty-row" id="qtyRow">
        <div class="qty-field">
          <label for="expectedQty">Quantity needed</label>
          <input id="expectedQty" type="number" min="1" max="999" placeholder="1">
        </div>
        <div class="qty-field">
          <label for="expectedLevel">Level (optional)</label>
          <select id="expectedLevel">
            <option value="">Any level</option>
            <option value="Absolute Beginner">Absolute Beginner</option>
            <option value="A0">A0</option>
            <option value="A1">A1</option>
            <option value="A1.1">A1.1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
          </select>
        </div>
      </div>
      <p class="qty-hint" id="qtyHint">Leave blank to read these from the title instead.</p>
      <div class="form-row2">
        <select id="assignedTo" required>
          <option value="">Assign to...</option>
        </select>
        <input id="dueDate" type="date" required>
        <button class="add-btn" type="submit">Add Task</button>
      </div>
      <input id="taskNotes" placeholder="Notes (optional)" style="width:100%;margin-top:10px">
    </form>
  </section>

  <section class="panel">
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-filter="all" type="button">All</button>
      <button class="filter-chip" data-filter="pending" type="button">Pending</button>
      <button class="filter-chip" data-filter="completed" type="button">Completed</button>
      <button class="filter-chip" data-filter="overdue" type="button">Overdue</button>
      <button class="filter-chip" data-filter="auto" type="button">Auto-tracked</button>
    </div>
    <div id="taskList" class="list"><div class="empty">Loading tasks...</div></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async function(){
  const db=firebase.firestore();

  const form=document.getElementById("taskForm");
  const taskTitle=document.getElementById("taskTitle");
  const deliverableType=document.getElementById("deliverableType");
  const assignedTo=document.getElementById("assignedTo");
  const dueDate=document.getElementById("dueDate");
  const taskNotes=document.getElementById("taskNotes");
  const expectedQty=document.getElementById("expectedQty");
  const expectedLevel=document.getElementById("expectedLevel");
  const qtyRow=document.getElementById("qtyRow");
  const qtyHint=document.getElementById("qtyHint");
  const list=document.getElementById("taskList");
  const filterRow=document.getElementById("filterRow");

  const DELIVERABLE_LABELS = {
    lessonPlan:"Lesson Plan", activity:"Activity", delfMock:"DELF Mock",
    marking:"Marking Queue", classLogged:"Logged Class", teamDoc:"Team Document",
    recording:"Recording", kpi:"KPI Review", other:"Other"
  };
  const DELIVERABLE_LINKS = {
    lessonPlan:"/teacher/lesson-builder.html", activity:"/teacher/activity-builder.html",
    delfMock:"/teacher/delf-mock-builder.html", marking:"/teacher/marking.html",
    classLogged:"/teacher/classes.html", teamDoc:"/teacher/team-docs.html",
    recording:"/teacher/recordings.html", kpi:"/teacher/kpis.html"
  };
  const AUTO_TYPES = new Set(["lessonPlan","activity","delfMock","marking","classLogged","teamDoc"]);
  const TIMELINESS_INFO = {
    early:{label:"Early", cls:"early"},
    ontime:{label:"On time", cls:"ontime"},
    late:{label:"Late", cls:"late"},
    never:{label:"Never Completed", cls:"never"}
  };

  function parseTargetQty(title){
    const m = String(title || "").match(/^(\d+)\b/);
    const n = m ? parseInt(m[1], 10) : 1;
    return (n > 0 && n < 1000) ? n : 1;
  }

  const KNOWN_LEVELS = ["Absolute Beginner","A1.1","A0","A1","A2","B1","B2"];
  function parseTargetLevel(title){
    const t = String(title || "");
    for(const lvl of KNOWN_LEVELS){
      const escaped = lvl.replace(/\./g, "\\.");
      const re = new RegExp("(^|[^A-Za-z0-9])" + escaped + "([^A-Za-z0-9]|$)", "i");
      if(re.test(t)) return lvl;
    }
    return null;
  }

  function updateQtyRowVisibility(){
    const show = AUTO_TYPES.has(deliverableType.value);
    qtyRow.classList.toggle("show", show);
    qtyHint.classList.toggle("show", show);
  }
  deliverableType.addEventListener("change", updateQtyRowVisibility);

  let tasks=[];
  let currentFilter="all";

  function namesMatch(a, b){
    if(!a || !b) return false;
    a = String(a).trim().toLowerCase();
    b = String(b).trim().toLowerCase();
    if(!a || !b) return false;
    return a === b || b.includes(a) || a.includes(b);
  }

  function fmtDate(v){
    if(!v) return "";
    const d=new Date(v);
    if(isNaN(d)) return v;
    return d.toLocaleDateString();
  }

  function fmtDateCompact(v){
    if(!v) return "";
    const d=new Date(v);
    if(isNaN(d)) return "";
    return d.toLocaleDateString(undefined,{day:"2-digit",month:"short"});
  }

  function isOverdue(t){
    if(t.completed || !t.dueDate) return false;
    const due = new Date(t.dueDate);
    const today = new Date(); today.setHours(0,0,0,0);
    return due < today;
  }

  async function loadPersonnel(){
    try{
      const snap = await db.collection("impactPasskeys").where("role","!=","Learner").get();
      const names = snap.docs.map(d=>d.data().name).filter(Boolean).sort();
      assignedTo.innerHTML = '<option value="">Assign to...</option>' + names.map(n=>`<option value="${n}">${n}</option>`).join("");
    }catch(e){ console.warn("Could not load personnel list:", e); }
  }

  async function checkAutoCompletions(taskList){
    const autoTasks = taskList.filter(t => AUTO_TYPES.has(t.deliverableType) && !t.completed);
    if(!autoTasks.length) return [];

    const [lessonSnap, activitySnap, delfSnap, completionsSnap, trackerSnap, teamDocsSnap] = await Promise.all([
      db.collection("lessonPlans").get().catch(()=>({docs:[]})),
      db.collection("activityPlans").get().catch(()=>({docs:[]})),
      db.collection("delfMocks").get().catch(()=>({docs:[]})),
      db.collection("learnerCompletions").get().catch(()=>({docs:[]})),
      db.collection("classTracker").get().catch(()=>({docs:[]})),
      db.collection("teamDocs").get().catch(()=>({docs:[]}))
    ]);

    const lessons = lessonSnap.docs.map(d=>d.data());
    const activities = activitySnap.docs.map(d=>d.data());
    const delfMocks = delfSnap.docs.map(d=>d.data());
    const completions = completionsSnap.docs.map(d=>d.data());
    const classes = trackerSnap.docs.map(d=>d.data());
    const teamDocs = teamDocsSnap.docs.map(d=>d.data());

    const justCompleted = [];

    for(const t of autoTasks){
      const taskCreated = new Date(t.createdAt || 0);
      const target = (t.expectedQty && t.expectedQty > 0) ? t.expectedQty : parseTargetQty(t.title);
      const targetLevel = t.expectedLevel || parseTargetLevel(t.title);
      let count = 0;

      if(t.deliverableType === "lessonPlan"){
        count = lessons.filter(l => namesMatch(t.assignedTo, l.createdByTeacher) && new Date(l.updatedAt||0) >= taskCreated && (!targetLevel || (l.level||"").trim() === targetLevel)).length;
      }
      if(t.deliverableType === "activity"){
        count = activities.filter(a => namesMatch(t.assignedTo, a.createdByTeacher) && new Date(a.updatedAt||0) >= taskCreated && (!targetLevel || (a.level||"").trim() === targetLevel)).length;
      }
      if(t.deliverableType === "delfMock"){
        count = delfMocks.filter(m => namesMatch(t.assignedTo, m.createdByTeacher) && new Date(m.updatedAt||0) >= taskCreated && (!targetLevel || (m.level||"").trim() === targetLevel)).length;
      }
      if(t.deliverableType === "marking"){
        const relevant = completions.filter(c => namesMatch(t.assignedTo, c.itemCreatedByTeacher));
        const stillUngraded = relevant.filter(c => c.score === null || c.score === undefined);
        const queueCleared = relevant.length > 0 && stillUngraded.length === 0;
        count = queueCleared ? target : 0;
      }
      if(t.deliverableType === "classLogged"){
        count = classes.filter(c => namesMatch(t.assignedTo, c.teacher) && new Date(c.startedAt||0) >= taskCreated).length;
      }
      if(t.deliverableType === "teamDoc"){
        count = teamDocs.filter(d => namesMatch(t.assignedTo, d.uploadedBy) && new Date(d.uploadedAt||0) >= taskCreated).length;
      }

      t._autoProgress = { count: count, target: target };

      if(count >= target){
        const now = new Date();
        const payload = {
          completed: true,
          completedAt: now.toISOString(),
          completedAtText: now.toLocaleString(),
          completedVia: "auto"
        };
        Object.assign(t, payload);
        await db.collection("tasks").doc(t.id).set(payload, {merge:true});
        justCompleted.push(t.title);
      }
    }

    return justCompleted;
  }

  async function load(){
    list.innerHTML='<div class="empty">Loading tasks...</div>';
    const snap=await db.collection("tasks").get();
    tasks=snap.docs.map(d=>({id:d.id,...d.data()}));

    await checkAutoCompletions(tasks);

    render();
  }

  function render(){
    let filtered = tasks;
    if(currentFilter==="pending") filtered = tasks.filter(t=>!t.completed);
    if(currentFilter==="completed") filtered = tasks.filter(t=>t.completed);
    if(currentFilter==="overdue") filtered = tasks.filter(t=>isOverdue(t));
    if(currentFilter==="auto") filtered = tasks.filter(t=>AUTO_TYPES.has(t.deliverableType));

    filtered = filtered.slice().sort(function(a,b){
      function tier(t){
        if(t.source === "academicCalendar" && t.timeliness === "never") return 2;
        if(t.completed) return 2;
        return isOverdue(t) ? 0 : 1;
      }
      const ta = tier(a), tb = tier(b);
      if(ta !== tb) return ta - tb;
      const ad = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
      const bd = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
      return ad - bd;
    });

    if(!filtered.length){
      list.innerHTML='<div class="empty">No tasks here.</div>';
      return;
    }

    list.innerHTML="";

    filtered.forEach(t=>{
      const done=!!t.completed;
      const overdue=isOverdue(t);
      const isAuto = AUTO_TYPES.has(t.deliverableType);
      const isCalendarSourced = t.source === "academicCalendar";
      const isLocked = isAuto || isCalendarSourced;

      const row=document.createElement("article");
      row.className="task-row" + (overdue?" overdue":"") + (isAuto?" auto":"") + (isCalendarSourced?" calendar-sourced":"");

      const deliverableLabel = DELIVERABLE_LABELS[t.deliverableType] || "";
      const deliverableLink = DELIVERABLE_LINKS[t.deliverableType] || "";
      const timelinessInfo = isCalendarSourced ? TIMELINESS_INFO[t.timeliness] : null;

      let summaryBadge = "";
      if(timelinessInfo){
        summaryBadge = `<span class="mini-badge ${timelinessInfo.cls}">${timelinessInfo.label}</span>`;
      }else if(done){
        summaryBadge = `<span class="mini-badge completed">Done</span>`;
      }else if(overdue){
        summaryBadge = `<span class="mini-badge overdue">Overdue</span>`;
      }else{
        summaryBadge = `<span class="mini-badge pending">Pending</span>`;
      }

      row.innerHTML = `
        <div class="task-summary">
          <button class="task-check ${done?'done':''} ${isLocked?'auto-locked':''}" title="${isAuto?'Auto-tracked':isCalendarSourced?'Set from Academic Calendar':'Mark complete'}">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
          </button>
          <span class="task-summary-title">${t.title||"Untitled Task"}</span>
          ${summaryBadge}
          <span class="task-summary-due">${fmtDateCompact(t.dueDate)}</span>
          <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="task-details">
          <div class="meta">Assigned to: ${t.assignedTo||"Unassigned"}</div>
          <div class="meta">Due: ${fmtDate(t.dueDate)}</div>
          ${t.notes?`<div class="meta">${t.notes}</div>`:""}
          ${t.completedAtText?`<div class="meta">Completed: ${t.completedAtText}${t.completedVia==='auto'?' (auto)':t.completedVia==='calendar'?' (via calendar)':''}</div>`:""}
          ${(!done && t._autoProgress && (t._autoProgress.target > 1 || t.expectedLevel)) ? `<div class="meta">Progress: ${t._autoProgress.count} of ${t._autoProgress.target} done${t.expectedLevel?' ('+t.expectedLevel+')':''} — ${t._autoProgress.target - t._autoProgress.count} more to go</div>` : ""}
          <div class="badges-row">
            ${isAuto?`<span class="badge auto-badge">${deliverableLabel}</span>`:""}
          </div>
          ${isCalendarSourced
            ? `<a class="calendar-link" href="/teacher/academic-calendar.html">Edit on Academic Calendar →</a>`
            : (deliverableLink && !done ? `<a class="deliverable-link" href="${deliverableLink}">Go do this →</a>` : "")}
          <div class="task-actions">
            <button class="icon-btn edit" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
            <button class="icon-btn delete" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
          </div>
        </div>
      `;

      row.addEventListener("click", function(e){
        if(e.target.closest(".task-check") || e.target.closest(".icon-btn")) return;
        row.classList.toggle("pinned");
      });

      const checkBtn = row.querySelector(".task-check");
      if(!isLocked){
        checkBtn.onclick=async(e)=>{
          e.stopPropagation();
          const now=new Date();
          await db.collection("tasks").doc(t.id).set({
            completed:!done,
            completedAt:!done ? now.toISOString() : "",
            completedAtText:!done ? now.toLocaleString() : "",
            completedVia: !done ? "manual" : "",
            updatedAt:now.toISOString()
          },{merge:true});
          await load();
        };
      }else{
        checkBtn.onclick=(e)=>{ e.stopPropagation(); };
      }

      row.querySelector(".edit").onclick=(e)=>{
        e.stopPropagation();
        taskTitle.value=t.title||"";
        deliverableType.value=t.deliverableType||"";
        assignedTo.value=t.assignedTo||"";
        dueDate.value=t.dueDate||"";
        taskNotes.value=t.notes||"";
        expectedQty.value=t.expectedQty||"";
        expectedLevel.value=t.expectedLevel||"";
        updateQtyRowVisibility();
        form.dataset.editing=t.id;
        taskTitle.focus();
      };

      row.querySelector(".delete").onclick=async(e)=>{
        e.stopPropagation();
        if(confirm("Delete this task?")){
          await db.collection("tasks").doc(t.id).delete();
          await load();
        }
      };

      list.appendChild(row);
    });
  }

  filterRow.addEventListener("click", function(e){
    const chip = e.target.closest(".filter-chip");
    if(!chip) return;
    document.querySelectorAll(".filter-chip").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    currentFilter = chip.dataset.filter;
    render();
  });

  form.onsubmit=async(e)=>{
    e.preventDefault();
    const now=new Date();

    const data={
      title:taskTitle.value.trim(),
      deliverableType:deliverableType.value,
      assignedTo:assignedTo.value,
      dueDate:dueDate.value,
      notes:taskNotes.value.trim(),
      expectedQty: parseInt(expectedQty.value, 10) || 1,
      expectedLevel: expectedLevel.value || "",
      completed:false,
      updatedAt:now.toISOString(),
      updatedAtText:now.toLocaleString()
    };

    const editing=form.dataset.editing;

    if(editing){
      await db.collection("tasks").doc(editing).set(data,{merge:true});
      delete form.dataset.editing;
    }else{
      await db.collection("tasks").add({
        ...data,
        createdAt:now.toISOString(),
        createdAtText:now.toLocaleString()
      });
    }

    form.reset();
    updateQtyRowVisibility();
    await load();
  };

  await loadPersonnel();
  await load();
});
</script>

<script src="/js/impact-route-guard.js?v=inactivity-1hr"></script>
</body>
