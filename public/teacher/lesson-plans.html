<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lesson Plans | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/impact-global-bg.css">
<link rel="stylesheet" href="/css/impact-page-nav.css">
<link rel="stylesheet" href="/css/impact-round-icons.css?v=001">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:#fff;background:#05060b;min-height:100vh}
.page{position:relative;z-index:2;width:min(1080px,92vw);margin:0 auto;padding:118px 0 80px}
.hero{text-align:center;margin-bottom:48px}
.eyebrow{text-transform:uppercase;letter-spacing:.34em;font-size:.68rem;font-weight:900;color:rgba(235,240,255,.55);margin-bottom:12px}
h1{font-family:"Sorts Mill Goudy",Georgia,serif;font-size:clamp(3rem,6vw,5rem);font-weight:400;line-height:1}
.hero p{margin-top:12px;color:rgba(255,255,255,.6);font-weight:700}
.action-bar{display:flex;align-items:center;gap:12px;margin-bottom:36px;flex-wrap:wrap}
.new-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:Inter,sans-serif;font-weight:900;font-size:.9rem;cursor:pointer;text-decoration:none;transition:.18s ease;backdrop-filter:blur(12px)}
.new-btn:hover{background:rgba(255,255,255,.17);transform:translateY(-2px)}
.new-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;flex-shrink:0}
.folder-count{font-size:.82rem;font-weight:700;color:rgba(255,255,255,.45)}
.section-label{font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.38);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.08)}
.empty-state{text-align:center;padding:72px 40px;border:2px dashed rgba(255,255,255,.1);border-radius:28px;color:rgba(255,255,255,.35)}
.empty-state h3{font-family:"Sorts Mill Goudy",serif;font-size:1.5rem;font-weight:400;margin-bottom:10px;color:rgba(255,255,255,.5)}
.empty-state p{font-size:.86rem;font-weight:700;line-height:1.6}
.folders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.folder-card{border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);overflow:hidden;transition:.22s ease;cursor:pointer}
.folder-card.open{border-color:rgba(255,255,255,.22);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.folder-head{display:flex;align-items:center;gap:14px;padding:20px;transition:.18s ease}
.folder-card:hover .folder-head{background:rgba(255,255,255,.06)}
.folder-icon{font-size:2rem;line-height:1;flex-shrink:0}
.folder-meta{flex:1;min-width:0}
.folder-name{font-family:"Sorts Mill Goudy",serif;font-size:1.4rem;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder-sub{font-size:.76rem;font-weight:800;color:rgba(255,255,255,.45);margin-top:3px}
.folder-chevron{color:rgba(255,255,255,.3);font-size:.9rem;transition:transform .22s ease;flex-shrink:0}
.folder-card.open .folder-chevron{transform:rotate(90deg)}
.folder-body{max-height:0;overflow:hidden;transition:max-height .38s ease,padding .28s ease;padding:0 14px}
.folder-card.open .folder-body{max-height:900px;padding:0 14px 14px}
.plan-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);margin-bottom:8px;transition:.15s ease}
.plan-row:last-child{margin-bottom:0}
.plan-row:hover{background:rgba(255,255,255,.09)}
.plan-name{font-size:.86rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.plan-btn{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:.82rem;transition:.14s ease;flex-shrink:0}
.plan-btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.plan-btn.del:hover{background:rgba(255,60,60,.2);border-color:rgba(255,100,100,.3)}
.loading{text-align:center;padding:48px;color:rgba(255,255,255,.4);font-weight:700}

@media(max-width:700px){.folders-grid{grid-template-columns:1fr}}
.del-popover{
  margin-top:6px;
  margin-bottom:2px;
  padding:12px 14px;
  border-radius:14px;
  background:rgba(30,10,10,.92);
  border:1px solid rgba(255,100,100,.35);
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  animation:popIn .15s ease;
}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.del-popover-msg{
  font-size:.8rem;
  font-weight:800;
  color:rgba(255,255,255,.85);
  flex:1;
  line-height:1.35;
}
.del-popover-actions{display:flex;gap:8px;flex-shrink:0}
.del-popover-cancel{
  padding:7px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.09);
  color:#fff;
  font-size:.78rem;
  font-weight:800;
  cursor:pointer;
  font-family:Inter,sans-serif;
}
.del-popover-ok{
  padding:7px 14px;
  border-radius:10px;
  border:1px solid rgba(255,100,100,.4);
  background:rgba(200,40,40,.28);
  color:#fca5a5;
  font-size:.78rem;
  font-weight:900;
  cursor:pointer;
  font-family:Inter,sans-serif;
}
.del-popover-cancel:hover{background:rgba(255,255,255,.16)}
.del-popover-ok:hover{background:rgba(200,40,40,.45)}
</style>
</head>

<body>
<script src="/js/impact-global-bg.js"></script>
<script src="/js/impact-page-nav.js"></script>

<main class="page">
  <section class="hero">
    <p class="eyebrow">Teacher Workspace</p>
    <h1>Lesson Plans</h1>
    <p>Folders are created automatically when you save a lesson plan from the builder.</p>
  </section>

  <div class="action-bar">
    <a class="new-btn" href="/teacher/lesson-builder.html">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Lesson Plan
    </a>
    <span class="folder-count" id="folderCount"></span>
  </div>

  <p class="section-label">Folders</p>
  <div id="foldersWrap"><div class="loading">Loading folders...</div></div>
</main>



<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async function(){
  const db = firebase.firestore();
  const wrap = document.getElementById("foldersWrap");
  const folderCount = document.getElementById("folderCount");
  let allPlans = [];
  let openFolder = null;

  function showDeletePopover(anchorRow, msg){
    // Remove any existing popover first
    document.querySelectorAll(".del-popover").forEach(p=>p.remove());

    return new Promise(resolve=>{
      const pop = document.createElement("div");
      pop.className = "del-popover";
      pop.innerHTML = `
        <span class="del-popover-msg">${msg}</span>
        <div class="del-popover-actions">
          <button class="del-popover-cancel" type="button">Cancel</button>
          <button class="del-popover-ok" type="button">Delete</button>
        </div>`;

      // Insert after the row that was clicked
      anchorRow.after(pop);
      pop.scrollIntoView({behavior:"smooth", block:"nearest"});

      const close = r=>{
        pop.remove();
        document.removeEventListener("click", outside);
        resolve(r);
      };

      pop.querySelector(".del-popover-ok").onclick     = e=>{ e.stopPropagation(); close(true); };
      pop.querySelector(".del-popover-cancel").onclick = e=>{ e.stopPropagation(); close(false); };

      // Click outside dismisses
      const outside = e=>{
        if(!pop.contains(e.target)) close(false);
      };
      setTimeout(()=>document.addEventListener("click", outside), 50);
    });
  }

  async function load(){
    try{
      const snap = await db.collection("lessonPlans").orderBy("updatedAt","desc").get();
      allPlans = snap.docs.map(d=>({id:d.id,...d.data()}));
    }catch(e){
      const snap = await db.collection("lessonPlans").get();
      allPlans = snap.docs.map(d=>({id:d.id,...d.data()}));
    }
    render();
  }

  function render(){
    // Group by level — each unique level = one folder
    const map = {};
    allPlans.forEach(p=>{
      const lvl = (p.level||"Uncategorised").trim();
      if(!map[lvl]) map[lvl]=[];
      map[lvl].push(p);
    });
    const levels = Object.keys(map).sort();

    folderCount.textContent = levels.length
      ? levels.length + " folder" + (levels.length===1?"":"s")
      : "";

    if(!levels.length){
      wrap.innerHTML = `<div class="empty-state">
        <h3>No folders yet</h3>
        <p>Create a lesson plan in the builder and select a level.<br>The folder will appear here automatically.</p>
      </div>`;
      return;
    }

    wrap.innerHTML = `<div class="folders-grid" id="grid"></div>`;
    const grid = document.getElementById("grid");

    levels.forEach(level=>{
      const plans = map[level];
      const card = document.createElement("div");
      card.className = "folder-card" + (openFolder===level?" open":"");
      card.dataset.level = level;

      const rows = plans.map(p=>`
        <div class="plan-row">
          <span class="plan-name">${p.title||p.name||"Untitled Lesson"}</span>
          <button class="plan-btn view-btn" data-id="${p.id}" title="Preview">👁</button>
          <button class="plan-btn edit-btn" data-id="${p.id}" title="Edit">✏️</button>
          <button class="plan-btn del del-btn" data-id="${p.id}" data-title="${(p.title||p.name||"Untitled Lesson").replace(/"/g,"&quot;")}" title="Delete">✕</button>
        </div>`).join("");

      card.innerHTML = `
        <div class="folder-head">
          <span class="folder-icon">${openFolder===level?"📂":"📁"}</span>
          <div class="folder-meta">
            <div class="folder-name">${level}</div>
            <div class="folder-sub">${plans.length} lesson plan${plans.length===1?"":"s"}</div>
          </div>
          <span class="folder-chevron">›</span>
        </div>
        <div class="folder-body">${rows}</div>`;

      grid.appendChild(card);
    });

    bindEvents();
  }

  function bindEvents(){
    const grid = document.getElementById("grid");
    if(!grid) return;

    grid.addEventListener("click", async function(e){

      // Delete
      const delBtn = e.target.closest(".del-btn");
      if(delBtn){
        e.stopPropagation();
        const anchorRow = delBtn.closest(".plan-row");
        const ok = await showDeletePopover(anchorRow, `Delete &ldquo;${delBtn.dataset.title}&rdquo;?`);
        if(!ok) return;
        await db.collection("lessonPlans").doc(delBtn.dataset.id).delete();
        allPlans = allPlans.filter(p=>p.id!==delBtn.dataset.id);
        const cardLevel = delBtn.closest(".folder-card").dataset.level;
        if(!allPlans.find(p=>(p.level||"Uncategorised")===cardLevel)) openFolder=null;
        render();
        return;
      }

      // Preview
      const viewBtn = e.target.closest(".view-btn");
      if(viewBtn){
        e.stopPropagation();
        location.href = "/teacher/lesson-view.html?id=" + encodeURIComponent(viewBtn.dataset.id);
        return;
      }

      // Edit
      const editBtn = e.target.closest(".edit-btn");
      if(editBtn){
        e.stopPropagation();
        location.href = "/teacher/lesson-builder.html?edit=" + encodeURIComponent(editBtn.dataset.id);
        return;
      }

      // Toggle folder
      const card = e.target.closest(".folder-card");
      if(card){
        const level = card.dataset.level;
        if(openFolder===level){
          openFolder = null;
          card.classList.remove("open");
          card.querySelector(".folder-icon").textContent = "📁";
        } else {
          document.querySelectorAll(".folder-card.open").forEach(c=>{
            c.classList.remove("open");
            c.querySelector(".folder-icon").textContent = "📁";
          });
          openFolder = level;
          card.classList.add("open");
          card.querySelector(".folder-icon").textContent = "📂";
        }
      }
    });

    // Click outside closes folders
    document.addEventListener("click", function(e){
      if(!e.target.closest(".folder-card") && !e.target.closest(".confirm-card")){
        document.querySelectorAll(".folder-card.open").forEach(c=>{
          c.classList.remove("open");
          const fi = c.querySelector(".folder-icon");
          if(fi) fi.textContent = "📁";
        });
        openFolder = null;
      }
    });
  }

  await load();
});
</script>

<script src="/js/impact-round-icons.js?v=001"></script>
<script src="/js/impact-recycle-bin.js"></script>
<script src="/js/impact-route-guard.js?v=inactivity-1hr"></script>
</body>
</html>
