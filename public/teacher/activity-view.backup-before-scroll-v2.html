<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Activity Preview | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/impact-global-bg.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:#05060b;color:#fff}
.top-bar{position:fixed;top:0;left:0;right:0;height:58px;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(5,6,11,.85);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}
.top-left{display:flex;align-items:center;gap:12px}
.back-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;text-decoration:none;font-size:.8rem;font-weight:800;transition:.15s}
.back-btn:hover{background:rgba(255,255,255,.13)}
.back-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.activity-title-bar{font-family:"Sorts Mill Goudy",serif;font-size:1rem;font-weight:400;color:rgba(255,255,255,.7)}
.slide-counter{font-size:.8rem;font-weight:800;color:rgba(255,255,255,.45)}
.progress-bar{position:fixed;top:58px;left:0;right:0;height:3px;z-index:999;background:rgba(255,255,255,.08)}
.progress-fill{height:100%;background:#8b5cf6;transition:width .35s ease}
.slide-viewport{position:fixed;top:61px;left:0;right:0;bottom:72px;display:flex;align-items:flex-start;justify-content:center;padding:20px 24px;overflow-y:auto}
.slide-card{width:min(680px,100%);max-height:none;background:#fff;border-radius:24px;padding:40px 44px;box-shadow:0 24px 80px rgba(0,0,0,.4);animation:slideIn .28s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.sv-header{font-family:"Sorts Mill Goudy",serif;font-size:2.2rem;font-weight:400;color:#0f172a;line-height:1.2;margin-bottom:8px}
.sv-subheader{font-size:1.2rem;font-weight:700;color:#1e293b;margin-bottom:8px}
.sv-text{font-size:.95rem;color:#4b5563;line-height:1.75;margin-bottom:8px}
.q-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.q-badge{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#8b5cf6;color:#fff;font-size:.72rem;font-weight:900;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.q-text{font-size:1rem;font-weight:700;color:#0f172a}
.q-hint{font-size:.8rem;color:#9ca3af;font-style:italic;margin-bottom:12px}
.sv-input{width:100%;padding:11px 14px;border-radius:9px;border:1.5px solid #e0e3e8;font-family:Inter,sans-serif;font-size:.9rem;color:#374151;background:#fff;outline:none;margin-bottom:4px;transition:.15s}
.sv-input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.12)}
.sv-textarea{width:100%;padding:11px 14px;border-radius:9px;border:1.5px solid #e0e3e8;font-family:Inter,sans-serif;font-size:.9rem;color:#374151;background:#fff;min-height:100px;resize:vertical;outline:none;transition:.15s}
.sv-textarea:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.12)}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.mc-opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;border:1.5px solid #e0e3e8;background:#fff;font-size:.9rem;color:#374151;cursor:pointer;transition:.15s}
.mc-opt:hover{border-color:#8b5cf6;background:#faf5ff}
.mc-opt input{accent-color:#8b5cf6;width:16px;height:16px;flex-shrink:0}
.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.pc-item{border-radius:9px;border:1.5px solid #e0e3e8;overflow:hidden;cursor:pointer;transition:.15s}
.pc-item:hover{border-color:#8b5cf6}
.pc-item img{width:100%;height:90px;object-fit:cover;display:block}
.pc-item-ph{width:100%;height:90px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.pc-label{padding:7px 9px;display:flex;align-items:center;gap:7px;font-size:.8rem;color:#374151}
.pc-label input{accent-color:#8b5cf6}
.sv-select{width:100%;padding:11px 14px;border-radius:9px;border:1.5px solid #e0e3e8;font-family:Inter,sans-serif;font-size:.9rem;color:#374151;background:#fff;appearance:none;cursor:pointer;outline:none}
.ma-btns{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
.ma-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 18px;border-radius:10px;background:#8b5cf6;color:#fff;border:none;font-weight:800;font-size:.75rem;min-width:72px;font-family:Inter,sans-serif;cursor:pointer;transition:.15s}
.ma-btn:hover{background:#7c3aed;transform:translateY(-1px)}
.ma-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.sv-date,.sv-number,.sv-url{width:100%;padding:11px 14px;border-radius:9px;border:1.5px solid #e0e3e8;font-family:Inter,sans-serif;font-size:.9rem;color:#374151;background:#fff;outline:none}
.sv-date:focus,.sv-number:focus,.sv-url:focus{border-color:#8b5cf6}
.sv-file-zone{border:2px dashed #d1d5db;border-radius:10px;padding:28px;text-align:center;color:#9ca3af;font-size:.84rem;font-weight:600;cursor:pointer;transition:.15s}
.sv-file-zone:hover{border-color:#8b5cf6;color:#8b5cf6}
.sv-sig{border:1.5px solid #e0e3e8;border-radius:9px;height:100px;background:#fafbfc;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:.82rem}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;display:flex;align-items:center;justify-content:center;gap:16px;background:rgba(5,6,11,.85);border-top:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);z-index:1000}
.nav-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 28px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;font-family:Inter,sans-serif;font-weight:800;font-size:.88rem;cursor:pointer;transition:.15s}
.nav-btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.nav-btn:disabled{opacity:.3;cursor:default;transform:none}
.nav-btn.next{background:rgba(139,92,246,.22);border-color:rgba(139,92,246,.45);color:#c4b5fd}
.nav-btn.next:hover{background:rgba(139,92,246,.32)}
.nav-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.final-slide{text-align:center;padding:20px}
.final-slide h2{font-family:"Sorts Mill Goudy",serif;font-size:2rem;font-weight:400;color:#0f172a;margin-bottom:12px}
.final-slide p{color:#6b7280;font-size:.92rem;font-weight:600;margin-bottom:24px}
.final-submit{padding:13px 48px;border-radius:999px;background:#8b5cf6;color:#fff;font-size:.95rem;font-weight:800;border:none;font-family:Inter,sans-serif;cursor:pointer;transition:.15s}
.final-submit:hover{background:#7c3aed;transform:translateY(-1px)}
@media(max-width:600px){.slide-card{padding:28px 22px}.mc-grid{grid-template-columns:1fr}.pc-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<script src="/js/impact-global-bg.js"></script>
<div class="top-bar">
  <div class="top-left">
    <a class="back-btn" href="/teacher/activities.html">
      <svg viewBox="0 0 24 24"><path d="M15 5.5 8.5 12 15 18.5"/><path d="M9 12h11"/></svg>
      Back
    </a>
    <span class="activity-title-bar" id="titleBar">Activity</span>
  </div>
  <span class="slide-counter" id="slideCounter"></span>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="slide-viewport">
  <div class="slide-card" id="slideCard">
    <div style="text-align:center;padding:48px;color:#9ca3af;font-weight:700">Loading...</div>
  </div>
</div>
<div class="bottom-nav">
  <button class="nav-btn" id="prevBtn" disabled>
    <svg viewBox="0 0 24 24"><path d="M15 5.5 8.5 12 15 18.5"/></svg>Back
  </button>
  <button class="nav-btn next" id="nextBtn">Continue
    <svg viewBox="0 0 24 24"><path d="M9 5.5 15.5 12 9 18.5"/></svg>
  </button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async function(){
  const db=firebase.firestore();
  const id=new URLSearchParams(location.search).get("id");
  const slideCard=document.getElementById("slideCard");
  const titleBar=document.getElementById("titleBar");
  const slideCounter=document.getElementById("slideCounter");
  const progressFill=document.getElementById("progressFill");
  const prevBtn=document.getElementById("prevBtn");
  const nextBtn=document.getElementById("nextBtn");
  if(!id){slideCard.innerHTML='<div style="text-align:center;padding:48px;color:#374151;font-weight:700">No activity ID provided.</div>';return;}
  let plan;
  try{const snap=await db.collection("activityPlans").doc(id).get();if(!snap.exists){slideCard.innerHTML='<div style="text-align:center;padding:48px;color:#374151;font-weight:700">Activity not found.</div>';return;}plan={id:snap.id,...snap.data()};}
  catch(err){slideCard.innerHTML='<div style="text-align:center;padding:48px;color:#374151;font-weight:700">Could not load activity.</div>';return;}
  titleBar.textContent=plan.title||"Activity";
  document.title=(plan.title||"Activity")+" | Preview";
  let slides=[[]];let blocks=[];
  if(plan.version===2&&Array.isArray(plan.blocks)){blocks=plan.blocks;}
  else if(plan.content){slides=[[{type:"__html__",content:plan.content}]];}
  if(blocks.length){blocks.forEach(b=>{if(b.type==="pagebreak"){slides.push([]);}else{slides[slides.length-1].push(b);}});if(slides[slides.length-1].length===0)slides.pop();}
  const totalContent=slides.length;
  slides.push([{type:"__final__"}]);
  let current=0;
  function renderBlock(b){
    if(b.type==="__html__")return `<div style="color:#374151;font-size:.9rem;line-height:1.7">${b.content}</div>`;
    if(b.type==="__final__")return `<div class="final-slide"><h2>Activity complete! 🎉</h2><p>You have finished this activity.</p><button class="final-submit" onclick="window.close()">Close Preview</button></div>`;
    if(b.type==="header")return `<div class="sv-header">${b.content||""}</div>`;
    if(b.type==="subheader")return `<div class="sv-subheader">${b.content||""}</div>`;
    if(b.type==="text")return `<div class="sv-text">${b.content||""}</div>`;
    const label=b.label||"";const hint=b.hint||"";
    const qHtml=`<div class="q-row"><span class="q-badge">?</span><div class="q-text">${label}</div></div>${hint?`<div class="q-hint">${hint}</div>`:""}`;
    if(b.type==="shorttext")return `${qHtml}<input class="sv-input" type="text" placeholder="Short answer...">`;
    if(b.type==="longtext")return `${qHtml}<textarea class="sv-textarea" placeholder="Long answer..."></textarea>`;
    if(b.type==="date")return `${qHtml}<input class="sv-date" type="date">`;
    if(b.type==="number")return `${qHtml}<input class="sv-number" type="number" placeholder="0">`;
    if(b.type==="website")return `${qHtml}<input class="sv-url" type="url" placeholder="https://">`;
    if(b.type==="fileupload")return `${qHtml}<div class="sv-file-zone">📎 Click to upload</div>`;
    if(b.type==="signature")return `${qHtml}<div class="sv-sig">Sign here</div>`;
    if(b.type==="multiplechoice"){const opts=(b.options||[]).map(o=>`<label class="mc-opt"><input type="radio" name="mc_${Math.random()}"> ${o}</label>`).join("");return `${qHtml}<div class="mc-grid">${opts}</div>`;}
    if(b.type==="picturechoice"){const imgs=(b.images||[]);const items=imgs.map((src,i)=>`<div class="pc-item"><div>${src?`<img src="${src}" alt="Option ${i+1}">`:'<div class="pc-item-ph">📷</div>'}</div><div class="pc-label"><input type="radio"> Option ${i+1}</div></div>`).join("");return `${qHtml}<div class="pc-grid">${items}</div>`;}
    if(b.type==="dropdown"){const opts=(b.options||[]).map(o=>`<option>${o}</option>`).join("");return `${qHtml}<select class="sv-select"><option value="">Choose an option...</option>${opts}</select>`;}
    if(b.type==="mediaanswer"){return `${qHtml}<div class="ma-btns"><button class="ma-btn"><svg viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.723v6.554a1 1 0 0 1-1.447.894L15 14v-4z"/><rect x="2" y="6" width="13" height="12" rx="2"/></svg>VIDEO</button><button class="ma-btn"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>AUDIO</button><button class="ma-btn"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>SCREEN</button><button class="ma-btn"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>TEXT</button></div>`;}
    return "";
  }
  function renderSlide(index){
    const slide=slides[index];const isFinal=slide.length===1&&slide[0].type==="__final__";
    slideCard.style.animation="none";slideCard.offsetHeight;slideCard.style.animation="";
    slideCard.innerHTML=slide.map(renderBlock).filter(Boolean).join('<div style="height:12px"></div>');
    const pct=(index/(slides.length-1))*100;progressFill.style.width=pct+"%";
    if(isFinal){slideCounter.textContent="Complete";nextBtn.style.display="none";}
    else{slideCounter.textContent=`${index+1} / ${totalContent}`;nextBtn.style.display="";nextBtn.innerHTML=index===totalContent-1?"Submit <svg width='17' height='17' fill='none' stroke='currentColor' stroke-width='2.2' viewBox='0 0 24 24'><path d='M9 5.5 15.5 12 9 18.5'/></svg>":"Continue <svg width='17' height='17' fill='none' stroke='currentColor' stroke-width='2.2' viewBox='0 0 24 24'><path d='M9 5.5 15.5 12 9 18.5'/></svg>";}
    prevBtn.disabled=index===0;slideCard.scrollTop=0;
  }
  prevBtn.addEventListener("click",function(){if(current>0){current--;renderSlide(current);}});
  nextBtn.addEventListener("click",function(){if(current<slides.length-1){current++;renderSlide(current);}});
  document.addEventListener("keydown",function(e){if(e.key==="ArrowRight"||e.key==="Enter")nextBtn.click();if(e.key==="ArrowLeft")prevBtn.click();});
  renderSlide(0);
});
</script>
<script src="/js/impact-round-icons.js?v=001"></script>
<script src="/js/impact-route-guard.js?v=inactivity-1hr"></script>
</body>
</html>
