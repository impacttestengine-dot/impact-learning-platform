<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Activity Builder | Impact</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/impact-global-bg.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;overflow-x:hidden}
body{font-family:Inter,system-ui,sans-serif;color:#fff;background:#05060b}
.lp-nav{position:fixed;top:24px;left:28px;z-index:99999;display:flex;gap:12px}
.lp-icon-btn{width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px)}
.lp-icon-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.page{position:relative;z-index:20;width:min(1320px,96vw);margin:0 auto;padding:108px 0 80px}
.workspace{
  display:grid;
  grid-template-columns:260px minmax(0,1fr) 240px;
  gap:18px;
  height:calc(100vh - 108px);
  align-items:stretch;
}
.panel{border-radius:28px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);box-shadow:0 24px 70px rgba(0,0,0,.28)}
.blocks-panel{padding:18px;height:100%;overflow-y:auto;align-self:start}
.settings-panel{padding:22px;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:16px;align-self:start}
.panel-title{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.45);margin-bottom:8px;margin-top:18px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08)}
.panel-title:first-child{margin-top:0}
.block-group{display:flex;flex-direction:column;gap:5px}
.block-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-family:Inter,sans-serif;font-weight:700;font-size:.83rem;cursor:pointer;transition:.15s ease;text-align:left}
.block-btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);transform:translateX(3px)}
.block-icon{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.1);flex-shrink:0;font-size:.72rem;font-weight:900;color:rgba(255,255,255,.8)}
.canvas-panel{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.22);height:100%;display:flex;flex-direction:column;overflow:hidden}
.canvas-toolbar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#f4f6f9;border-bottom:1px solid #e4e7ec;flex-wrap:wrap}
.tbtn{padding:6px 12px;border-radius:9px;border:1px solid #dde1e8;background:#fff;color:#374151;font-size:.76rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;transition:.12s}
.tbtn:hover{background:#eef0f4}
.canvas{padding:28px 32px;flex:1;overflow-y:auto;color:#374151}
.canvas-empty{text-align:center;padding:80px 40px;color:#b0b8c8;font-size:.92rem;font-weight:600;border:2px dashed #e4e7ec;border-radius:16px}
.canvas-submit{padding:20px 32px 32px;text-align:center}
.submit-btn-preview{padding:13px 52px;border-radius:999px;background:#8b5cf6;color:#fff;font-size:.95rem;font-weight:800;border:none;font-family:Inter,sans-serif;cursor:default;opacity:.8}
.c-block{position:relative;margin-bottom:12px;border-radius:12px;border:2px solid transparent;transition:.15s ease;cursor:pointer}
.c-block:hover{border-color:#e8ebf0}
.c-block.selected{border-color:#8b5cf6 !important;background:#faf5ff !important}
.c-block.drag-over{border-color:#8b5cf6;border-style:dashed}
.c-block-inner{padding:16px 18px}
.block-actions{display:none;position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:#1e293b;border-radius:10px;padding:4px 6px;gap:2px;z-index:200;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.c-block.selected .block-actions{display:flex}
.act-btn{width:26px;height:26px;border-radius:7px;border:none;background:transparent;color:#cbd5e1;cursor:pointer;display:grid;place-items:center;font-size:.72rem;transition:.1s}
.act-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.act-btn.danger:hover{background:rgba(239,68,68,.3);color:#fca5a5}
.act-divider{width:1px;background:rgba(255,255,255,.12);height:16px;margin:0 3px;align-self:center}
.cb-header{font-size:2rem;font-weight:800;color:#0f172a;line-height:1.2;outline:none;min-width:10px}
.cb-subheader{font-size:1.25rem;font-weight:700;color:#1e293b;outline:none;min-width:10px}
.cb-text{font-size:.93rem;color:#4b5563;line-height:1.7;outline:none;min-width:10px}
.q-icon{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#8b5cf6;color:#fff;font-size:.7rem;font-weight:900;align-items:center;justify-content:center;flex-shrink:0;margin-right:8px}
.q-label-row{display:flex;align-items:flex-start;margin-bottom:8px}
.q-label-text{font-size:.95rem;font-weight:700;color:#0f172a;outline:none;flex:1;min-width:10px}
.q-hint{font-size:.78rem;color:#9ca3af;font-style:italic;margin-bottom:10px;outline:none;min-width:10px}
.cb-input{width:100%;padding:10px 14px;border-radius:9px;border:1.5px solid #e0e3e8;font-family:Inter,sans-serif;font-size:.9rem;color:#374151;background:#fff;outline:none;pointer-events:none}
.cb-textarea{width:100%;padding:10px 14px;border-radius:9px;border:1.5px solid #e0e3e8;font-family:Inter,sans-serif;font-size:.9rem;color:#374151;background:#fff;min-height:90px;resize:none;outline:none;pointer-events:none}
.cb-select{width:100%;padding:10px 14px;border-radius:9px;border:1.5px solid #e0e3e8;font-family:Inter,sans-serif;font-size:.9rem;color:#6b7280;background:#fff;appearance:none;pointer-events:none}
.mc-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.mc-option{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;border:1.5px solid #e0e3e8;font-size:.88rem;color:#374151;background:#fff}
.mc-option input[type=radio]{accent-color:#8b5cf6;width:15px;height:15px;flex-shrink:0;pointer-events:none}
.mc-option-label{outline:none;flex:1;min-width:10px;font-size:.88rem;color:#374151}
.mc-add{margin-top:8px;padding:8px 14px;border-radius:9px;border:1.5px dashed #d1d5db;background:transparent;color:#9ca3af;font-size:.8rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;transition:.12s;display:block;width:100%;text-align:center}
.mc-add:hover{border-color:#8b5cf6;color:#8b5cf6}
.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.pc-item{border-radius:9px;border:1.5px solid #e0e3e8;overflow:hidden;text-align:center}
.pc-img-placeholder{height:80px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#d1d5db}
.pc-img-placeholder img{width:100%;height:100%;object-fit:cover}
.pc-item-label{padding:7px 8px;display:flex;align-items:center;gap:7px;font-size:.8rem;color:#374151}
.pc-item-label input{accent-color:#8b5cf6;flex-shrink:0;pointer-events:none}
.ma-btns{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.ma-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 18px;border-radius:10px;background:#8b5cf6;color:#fff;border:none;font-weight:800;font-size:.75rem;min-width:72px;font-family:Inter,sans-serif;cursor:default}
.ma-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.cb-date,.cb-number,.cb-url{width:100%;padding:10px 14px;border-radius:9px;border:1.5px solid #e0e3e8;font-family:Inter,sans-serif;font-size:.9rem;color:#9ca3af;background:#fff;pointer-events:none}
.file-zone{border:2px dashed #d1d5db;border-radius:10px;padding:28px;text-align:center;color:#9ca3af;font-size:.82rem;font-weight:600;margin-top:4px}
.impact-upload-filename{margin-top:10px;font-size:.78rem;font-weight:800;color:#06b6d4;display:none}
.impact-upload-filename.show{display:block}
.sig-pad{border:1.5px solid #e0e3e8;border-radius:9px;height:90px;margin-top:4px;background:#fafbfc;display:flex;align-items:center;justify-content:center;color:#d1d5db;font-size:.8rem}
.page-break-wrap{padding:16px 0}
.page-break-line{display:flex;align-items:center;gap:14px}
.page-break-line::before,.page-break-line::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,#8b5cf6 0,#8b5cf6 8px,transparent 8px,transparent 14px)}
.page-break-pill{padding:8px 28px;border-radius:999px;background:#8b5cf6;color:#fff;font-weight:800;font-size:.85rem;white-space:nowrap}
.page-break-label{font-size:.72rem;color:#9ca3af;text-align:center;margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
.settings-label{font-size:.72rem;font-weight:900;color:rgba(255,255,255,.55);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.05em}
.settings-input{width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;font-family:Inter,sans-serif;font-weight:700;font-size:.88rem;outline:none}
.settings-select{width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;font-family:Inter,sans-serif;font-weight:700;font-size:.88rem;outline:none}
.settings-select option{color:#111}
.settings-divider{height:1px;background:rgba(255,255,255,.09);margin:4px 0}
.ctrl-btn{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;font-family:Inter,sans-serif;font-weight:900;font-size:.86rem;cursor:pointer;transition:.15s}
.ctrl-btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.ctrl-btn.primary{background:rgba(139,92,246,.22);border-color:rgba(139,92,246,.45);color:#c4b5fd}
.ctrl-btn.primary:hover{background:rgba(139,92,246,.32)}
.save-tick{text-align:center;color:#86efac;font-weight:900;height:22px;opacity:0;transition:.2s;font-size:1rem}
.save-tick.show{opacity:1}
.panel-heading{font-family:"Sorts Mill Goudy",serif;font-size:1.05rem;font-weight:400;color:rgba(255,255,255,.88);margin-bottom:2px}
.legacy-notice{background:#fffbeb;border:1.5px solid #fcd34d;border-radius:10px;padding:14px;font-size:.8rem;color:#92400e;font-weight:700;margin-bottom:12px;line-height:1.5}
@media(max-width:1024px){.workspace{grid-template-columns:220px 1fr 200px}}
@media(max-width:800px){.workspace{grid-template-columns:1fr}.blocks-panel,.settings-panel{position:relative;top:auto;max-height:none}}

/* BLOCK ALIGN / RESIZE TOOLBAR — appears above selected block */
.block-toolbar{
  display:none;
  position:absolute;
  top:-42px;
  left:50%;
  transform:translateX(-50%);
  background:#1e293b;
  border-radius:12px;
  padding:5px 6px;
  gap:3px;
  z-index:150;
  white-space:nowrap;
  box-shadow:0 8px 28px rgba(0,0,0,.35);
  align-items:center;
}
.c-block.selected .block-toolbar{display:flex}
.bt-btn{
  width:30px;height:30px;border-radius:8px;border:none;background:transparent;
  color:#cbd5e1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;transition:.12s;
}
.bt-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.bt-btn.active{background:#8b5cf6;color:#fff}
.bt-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.bt-divider{width:1px;height:18px;background:rgba(255,255,255,.15);margin:0 3px;flex-shrink:0}
.bt-size-label{font-size:.68rem;font-weight:800;color:#cbd5e1;padding:0 4px;min-width:34px;text-align:center}

/* MEDIA FILE BLOCK */
.cb-media-empty{
  border:2px dashed #d1d5db;border-radius:12px;padding:40px 20px;text-align:center;
  color:#9ca3af;font-size:.86rem;font-weight:700;cursor:pointer;transition:.15s;
}
.cb-media-empty:hover{border-color:#8b5cf6;color:#8b5cf6}
.cb-media-empty svg{width:32px;height:32px;margin:0 auto 10px;display:block;stroke:currentColor;fill:none;stroke-width:1.6}
.cb-media-input{display:none}
.cb-media-preview{display:none;border-radius:12px;overflow:hidden;background:#f3f4f6}
.cb-media-preview.show{display:block}
.cb-media-preview img,.cb-media-preview video{width:100%;display:block;max-height:420px;object-fit:contain;background:#0a0c14}
.cb-media-replace{margin-top:8px;padding:6px 12px;border-radius:8px;border:1px solid #e0e3e8;background:#fff;color:#6b7280;font-size:.74rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif}
.cb-media-replace:hover{border-color:#8b5cf6;color:#8b5cf6}

/* Block width presets applied via inline style + these size classes */
.c-block.bw-small{max-width:340px;margin-left:auto;margin-right:auto}
.c-block.bw-medium{max-width:560px;margin-left:auto;margin-right:auto}
.c-block.bw-large{max-width:100%}

/* Block text alignment */
.c-block.align-left .c-block-inner{text-align:left}
.c-block.align-center .c-block-inner{text-align:center}
.c-block.align-right .c-block-inner{text-align:right}
.c-block.align-center .mc-options,.c-block.align-center .pc-grid{justify-content:center}
.c-block.align-right .mc-options,.c-block.align-right .pc-grid{justify-content:flex-end}
.impact-upload-text{color:#374151 !important;font-weight:700 !important}

.assign-levels-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.assign-level-chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);cursor:pointer;font-size:.8rem;font-weight:800;color:rgba(255,255,255,.7);transition:.15s}
.assign-level-chip:hover{background:rgba(255,255,255,.13)}
.assign-level-chip.checked{background:rgba(139,92,246,.22);border-color:rgba(139,92,246,.5);color:#fff}
.assign-level-chip input{display:none}</style>
</head>
<body>
<script src="/js/impact-global-bg.js"></script>
<nav class="lp-nav">
  <a class="lp-icon-btn" href="/teacher/dashboard.html" title="Dashboard">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>

  </a>
</nav>
<main class="page">
<section class="workspace">
<aside class="panel blocks-panel">
  <p class="panel-title">Basic</p>
  <div class="block-group">
    <button class="block-btn" data-block="mediafile" type="button"><span class="block-icon">🖼</span>Media File</button>
    <button class="block-btn" data-block="header" type="button"><span class="block-icon">H1</span>Header</button>
    <button class="block-btn" data-block="subheader" type="button"><span class="block-icon">H2</span>Subheader</button>
    <button class="block-btn" data-block="text" type="button"><span class="block-icon">T</span>Text</button>
    <button class="block-btn" data-block="pagebreak" type="button"><span class="block-icon">⋯</span>Page Break</button>
  </div>
  <p class="panel-title">Questions</p>
  <div class="block-group">
    <button class="block-btn" data-block="shorttext" type="button"><span class="block-icon">≡</span>Short Text</button>
    <button class="block-btn" data-block="longtext" type="button"><span class="block-icon">≣</span>Long Text</button>
    <button class="block-btn" data-block="multiplechoice" type="button"><span class="block-icon">◎</span>Multiple Choice</button>
    <button class="block-btn" data-block="picturechoice" type="button"><span class="block-icon">🖼</span>Picture Choice</button>
    <button class="block-btn" data-block="dropdown" type="button"><span class="block-icon">▾</span>Dropdown</button>
    <button class="block-btn" data-block="mediaanswer" type="button"><span class="block-icon">▶</span>Media Answer</button>
  </div>
  <p class="panel-title">Special</p>
  <div class="block-group">
    <button class="block-btn" data-block="date" type="button"><span class="block-icon">📅</span>Date</button>
    <button class="block-btn" data-block="number" type="button"><span class="block-icon">01</span>Number</button>
    <button class="block-btn" data-block="website" type="button"><span class="block-icon">🔗</span>Website</button>
    <button class="block-btn" data-block="fileupload" type="button"><span class="block-icon">📎</span>File Upload</button>
    <button class="block-btn" data-block="signature" type="button"><span class="block-icon">✍</span>Signature</button>
  </div>
</aside>
<section class="canvas-panel">
  <div class="canvas-toolbar">
    <button class="tbtn" id="undoBtn" type="button">↶ Undo</button>
    <button class="tbtn" id="selectAllBtn" type="button">Select All</button>
    <button class="tbtn" id="clearBtn" type="button">Clear Canvas</button>
  </div>
  <div class="canvas" id="canvas">
    <div class="canvas-empty" id="canvasEmpty">Click any block on the left to add it to your activity.</div>
  </div>
  <div class="canvas-submit"><button class="submit-btn-preview" type="button" disabled>Submit</button></div>
</section>
<aside class="panel settings-panel">
  <p class="panel-heading">Activity Builder</p>
  <div class="settings-divider"></div>
  <div>
    <label class="settings-label">Activity Title</label>
    <input class="settings-input" id="lessonTitle" type="text" placeholder="Enter activity title...">
  </div>
  <div>
    <label class="settings-label">Level</label>
    <select class="settings-select" id="lessonLevel">
      <option>Absolute Beginner</option>
      <option>A0</option><option>A1</option><option>A1.1</option>
      <option>A2</option><option>B1</option><option>B2</option>
    </select>
  </div>
  <div>
    <label class="settings-label">Assign to Learner Level(s)</label>
    <div class="assign-levels-group" id="assignLevelsGroup">
      <label class="assign-level-chip"><input type="checkbox" value="Absolute Beginner">Abs. Beginner</label>
      <label class="assign-level-chip"><input type="checkbox" value="A0">A0</label>
      <label class="assign-level-chip"><input type="checkbox" value="A1">A1</label>
      <label class="assign-level-chip"><input type="checkbox" value="A1.1">A1.1</label>
      <label class="assign-level-chip"><input type="checkbox" value="A2">A2</label>
      <label class="assign-level-chip"><input type="checkbox" value="B1">B1</label>
      <label class="assign-level-chip"><input type="checkbox" value="B2">B2</label>
    </div>

    <label class="settings-label" style="margin-top:14px">Assign to Specific Learner(s)</label>
    <input type="text" class="settings-input" id="learnerSearchInput" placeholder="Search learner by name..." autocomplete="off">
    <div class="learner-picker-list" id="learnerPickerList"></div>
    <div class="assign-learners-selected" id="assignLearnersSelected"></div>
  </div>
  <div class="settings-divider"></div>
  <button class="ctrl-btn primary" id="saveBtn" type="button">💾  Save</button>
  <button class="ctrl-btn" id="newBtn" type="button">＋  New Activity</button>
  <button class="ctrl-btn" id="viewBtn" type="button">👁  Preview</button>
  <span class="save-tick" id="saveTick">✓ Saved</span>
</aside>
</section>
</main>

<script>
document.addEventListener("DOMContentLoaded", function(){
const db=firebase.firestore();
const storage = firebase.storage();
const COLLECTION="activityPlans";
const VIEW_PAGE="/teacher/activity-view.html";
const canvas=document.getElementById("canvas");
const canvasEmpty=document.getElementById("canvasEmpty");
const titleInput=document.getElementById("lessonTitle");
const levelSelect=document.getElementById("lessonLevel");
const saveTick=document.getElementById("saveTick");
let currentId=new URLSearchParams(location.search).get("edit")||"";
let selectedBlock=null;
let undoStack=[];
let dragSrc=null;
let pageCount=1;
const assignLevelsGroup = document.getElementById("assignLevelsGroup");
if(assignLevelsGroup){
  assignLevelsGroup.addEventListener("change", function(e){
    const chip = e.target.closest(".assign-level-chip");
    if(chip) chip.classList.toggle("checked", e.target.checked);
  });
}

let allLearners = [];
let selectedLearners = [];
const learnerSearchInput = document.getElementById("learnerSearchInput");
const learnerPickerList = document.getElementById("learnerPickerList");
const assignLearnersSelected = document.getElementById("assignLearnersSelected");

async function loadLearnersList(){
  try{
    const snap = await db.collection("impactPasskeys").where("role","==","Learner").get();
    allLearners = snap.docs.map(d=>({name:d.data().name||"Unnamed",level:d.data().level||""}));
  }catch(e){ console.warn("Could not load learners list:", e); }
}

function renderSelectedLearnerChips(){
  if(!assignLearnersSelected) return;
  assignLearnersSelected.innerHTML = selectedLearners.map(name=>
    '<span class="assigned-learner-chip">'+name+'<button type="button" data-remove-learner="'+name+'">✕</button></span>'
  ).join("");
}

if(learnerSearchInput){
  loadLearnersList();

  learnerSearchInput.addEventListener("input", function(){
    const q = learnerSearchInput.value.trim().toLowerCase();
    if(!q){ learnerPickerList.classList.remove("show"); learnerPickerList.innerHTML=""; return; }
    const matches = allLearners.filter(l=>l.name.toLowerCase().includes(q) && !selectedLearners.includes(l.name));
    if(!matches.length){ learnerPickerList.classList.remove("show"); learnerPickerList.innerHTML=""; return; }
    learnerPickerList.innerHTML = matches.map(l=>
      '<div class="learner-picker-row" data-pick-learner="'+l.name+'">'+l.name+' <span style="opacity:.5">('+(l.level||"no level")+')</span></div>'
    ).join("");
    learnerPickerList.classList.add("show");
  });

  learnerPickerList.addEventListener("click", function(e){
    const row = e.target.closest("[data-pick-learner]");
    if(!row) return;
    const name = row.dataset.pickLearner;
    if(!selectedLearners.includes(name)) selectedLearners.push(name);
    renderSelectedLearnerChips();
    learnerSearchInput.value = "";
    learnerPickerList.classList.remove("show");
    learnerPickerList.innerHTML = "";
  });

  assignLearnersSelected.addEventListener("click", function(e){
    const btn = e.target.closest("[data-remove-learner]");
    if(!btn) return;
    selectedLearners = selectedLearners.filter(n=>n!==btn.dataset.removeLearner);
    renderSelectedLearnerChips();
  });
}
function showEmpty(){if(!canvas.querySelector(".c-block"))canvasEmpty.style.display="";}
function hideEmpty(){canvasEmpty.style.display="none";}
function allBlocks(){return Array.from(canvas.querySelectorAll(".c-block"));}
function tick(){saveTick.classList.add("show");setTimeout(()=>saveTick.classList.remove("show"),1600);}
function pushUndo(){undoStack.push(serializeBlocks());if(undoStack.length>40)undoStack.shift();}
function selectBlock(block){allBlocks().forEach(b=>b.classList.remove("selected"));if(block){block.classList.add("selected");selectedBlock=block;}else{selectedBlock=null;}}
canvas.addEventListener("click",function(e){if(e.target===canvas||e.target===canvasEmpty)selectBlock(null);});
function makeQ(label){return `<div class="q-label-row"><span class="q-icon">?</span><div class="q-label-text" contenteditable="true">${label}</div></div><div class="q-hint" contenteditable="true">Type in a description and fill-out hints</div>`;}
const TEMPLATES={
  mediafile:{render:(data)=>{
    const src=data&&data.src?data.src:"";
    const kind=data&&data.kind?data.kind:"";
    const mediaTag=kind==="video"
      ? `<video src="${src}" controls></video>`
      : `<img src="${src}" alt="">`;
    return `
      <div class="cb-media-empty" style="${src?'display:none':''}">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Click to upload an image or video
      </div>
      <input type="file" class="cb-media-input" accept="image/*,video/*">
      <div class="cb-media-preview ${src?'show':''}">${src?mediaTag:''}</div>
      ${src?`<button type="button" class="cb-media-replace">Replace file</button>`:''}
    `;
  }},
  header:{render:()=>`<div class="cb-header" contenteditable="true">Activity Title</div>`},
  subheader:{render:()=>`<div class="cb-subheader" contenteditable="true">Section A</div>`},
  text:{render:()=>`<div class="cb-text" contenteditable="true">Write your activity content here...</div>`},
  pagebreak:{render:(data)=>{const n=data&&data.pageNum?data.pageNum:++pageCount;return `<div class="page-break-wrap" data-page="${n}"><div style="font-size:.7rem;color:#9ca3af;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em">Page ${n-1}</div><div class="page-break-line"><span class="page-break-pill">Continue</span></div><div class="page-break-label">Page ${n}</div></div>`;}},
  shorttext:{render:()=>`${makeQ("e.g. What is your answer?")}<input class="cb-input" placeholder="Short answer..." readonly>`},
  longtext:{render:()=>`${makeQ("e.g. Describe your response.")}<textarea class="cb-textarea" placeholder="Long answer..." readonly></textarea>`},
  multiplechoice:{render:(data)=>{const opts=(data&&data.options)?data.options:["Option 1","Option 2","Option 3","Other"];const optHtml=opts.map(o=>`<div class="mc-option"><input type="radio" disabled><span class="mc-option-label" contenteditable="true">${o}</span></div>`).join("");return `${makeQ("e.g. Choose the correct answer.")}<div class="mc-options">${optHtml}</div><button class="mc-add" type="button">+ Add option</button>`;}},
  picturechoice:{render:(data)=>{const imgs=(data&&data.images)?data.images:[null,null,null];const itemHtml=imgs.map((src,i)=>`<div class="pc-item"><div class="pc-img-placeholder">${src?`<img src="${src}" alt="">`:''}</div><div class="pc-item-label"><input type="radio" disabled><span contenteditable="true">Option ${i+1}</span></div></div>`).join("");return `${makeQ("e.g. Choose the correct image.")}<div class="pc-grid">${itemHtml}</div><button class="pc-add-img" type="button" style="margin-top:8px;padding:7px 14px;border-radius:9px;border:1.5px dashed #d1d5db;background:transparent;color:#9ca3af;font-size:.78rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif">+ Add image</button>`;}},
  dropdown:{render:(data)=>{const opts=(data&&data.options)?data.options:["Option 1","Option 2","Option 3"];const optHtml=opts.map(o=>`<option>${o}</option>`).join("");return `${makeQ("e.g. Select the correct answer.")}<select class="cb-select" disabled><option value="">Choose an option...</option>${optHtml}</select>`;}},
  mediaanswer:{render:()=>`${makeQ("How would you like to answer?")}<div class="ma-btns"><button class="ma-btn" type="button"><svg viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0 1 21 8.723v6.554a1 1 0 0 1-1.447.894L15 14v-4z"/><rect x="2" y="6" width="13" height="12" rx="2"/></svg>VIDEO</button><button class="ma-btn" type="button"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>AUDIO</button><button class="ma-btn" type="button"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>SCREEN</button><button class="ma-btn" type="button"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>TEXT</button></div>`},
  date:{render:()=>`${makeQ("e.g. What is the date?")}<input class="cb-date" type="text" placeholder="DD / MM / YYYY" readonly>`},
  number:{render:()=>`${makeQ("e.g. How many?")}<input class="cb-number" type="text" placeholder="0" readonly>`},
  website:{render:()=>`${makeQ("e.g. Share a link.")}<input class="cb-url" type="text" placeholder="https://" readonly>`},
  fileupload:{render:()=>`${makeQ("Upload your file here.")}<div class="file-zone">📎 Click or drag file here</div>`},
  signature:{render:()=>`${makeQ("Please sign below.")}<div class="sig-pad">Sign here</div>`}
};
function createBlock(type,data){
  const tmpl=TEMPLATES[type];if(!tmpl)return null;
  const block=document.createElement("div");block.className="c-block";block.setAttribute("data-type",type);block.setAttribute("draggable","true");
  const actions=document.createElement("div");actions.className="block-actions";
  actions.innerHTML=`<button class="act-btn" data-act="up">↑</button><button class="act-btn" data-act="down">↓</button><div class="act-divider"></div><button class="act-btn" data-act="dupe">⧉</button><div class="act-divider"></div><button class="act-btn danger" data-act="del">✕</button>`;

  const toolbar=document.createElement("div");
  toolbar.className="block-toolbar";
  toolbar.innerHTML=`
    <button class="bt-btn" data-align="left" title="Align left" type="button"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="15" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/></svg></button>
    <button class="bt-btn active" data-align="center" title="Align center" type="button"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="18" y2="18"/></svg></button>
    <button class="bt-btn" data-align="right" title="Align right" type="button"><svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/></svg></button>
    <div class="bt-divider"></div>
    <button class="bt-btn" data-size="small" title="Small" type="button">S</button>
    <button class="bt-btn" data-size="medium" title="Medium" type="button">M</button>
    <button class="bt-btn active" data-size="large" title="Large (full width)" type="button">L</button>
  `;
  const inner=document.createElement("div");inner.className="c-block-inner";inner.innerHTML=tmpl.render(data);
  block.appendChild(actions);block.appendChild(toolbar);block.appendChild(inner);bindBlock(block);return block;
}
function bindBlock(block){
  // ── Align / resize toolbar ──
  const toolbar = block.querySelector(".block-toolbar");
  if(toolbar){
    toolbar.addEventListener("click", function(e){
      e.stopPropagation();
      const alignBtn = e.target.closest("[data-align]");
      if(alignBtn){
        pushUndo();
        block.classList.remove("align-left","align-center","align-right");
        block.classList.add("align-"+alignBtn.dataset.align);
        toolbar.querySelectorAll("[data-align]").forEach(b=>b.classList.remove("active"));
        alignBtn.classList.add("active");
      }
      const sizeBtn = e.target.closest("[data-size]");
      if(sizeBtn){
        pushUndo();
        block.classList.remove("bw-small","bw-medium","bw-large");
        block.classList.add("bw-"+sizeBtn.dataset.size);
        toolbar.querySelectorAll("[data-size]").forEach(b=>b.classList.remove("active"));
        sizeBtn.classList.add("active");
      }
    });
  }

  // ── Media File block: click to upload, preview immediately ──
  const mediaEmpty   = block.querySelector(".cb-media-empty");
  const mediaInput   = block.querySelector(".cb-media-input");
  const mediaPreview = block.querySelector(".cb-media-preview");
  const mediaReplace = block.querySelector(".cb-media-replace");

  async function handleMediaFile(file){
    if(!file) return;
    const isVideo = file.type.startsWith("video/");

    // Show a local preview immediately via a blob URL (instant, no upload wait)
    const localPreviewUrl = URL.createObjectURL(file);
    mediaPreview.innerHTML = isVideo
      ? `<video src="${localPreviewUrl}" controls></video>`
      : `<img src="${localPreviewUrl}" alt="">`;
    mediaPreview.classList.add("show");
    if(mediaEmpty) mediaEmpty.style.display = "none";

    let statusEl = block.querySelector(".cb-media-status");
    if(!statusEl){
      statusEl = document.createElement("div");
      statusEl.className = "cb-media-status";
      statusEl.style.cssText = "margin-top:8px;font-size:.76rem;font-weight:700;color:#9ca3af";
      mediaPreview.after(statusEl);
    }
    statusEl.textContent = "Uploading...";

    try{
      const ext = file.name.split(".").pop() || (isVideo ? "mp4" : "jpg");
      const path = `activityMedia/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const snap = await storage.ref(path).put(file);
      const downloadUrl = await snap.ref.getDownloadURL();

      block.dataset.mediaSrc  = downloadUrl;
      block.dataset.mediaKind = isVideo ? "video" : "image";
      statusEl.textContent = "";
      statusEl.remove();

      let replaceBtn = block.querySelector(".cb-media-replace");
      if(!replaceBtn){
        replaceBtn = document.createElement("button");
        replaceBtn.type = "button";
        replaceBtn.className = "cb-media-replace";
        replaceBtn.textContent = "Replace file";
        mediaPreview.after(replaceBtn);
        replaceBtn.addEventListener("click", function(e){
          e.stopPropagation();
          mediaInput.click();
        });
      }
    }catch(err){
      console.error("Media upload failed:", err);
      statusEl.textContent = "⚠️ Upload failed — try again";
      statusEl.style.color = "#dc2626";
      toast("⚠️ Could not upload file: " + err.message);
    }
  }

  if(mediaEmpty && mediaInput){
    mediaEmpty.addEventListener("click", function(e){
      e.stopPropagation();
      mediaInput.click();
    });
    mediaInput.addEventListener("click", function(e){ e.stopPropagation(); });
    mediaInput.addEventListener("change", function(e){
      e.stopPropagation();
      handleMediaFile(mediaInput.files[0]);
    });
  }
  if(mediaReplace && mediaInput){
    mediaReplace.addEventListener("click", function(e){
      e.stopPropagation();
      mediaInput.click();
    });
  }
  block.addEventListener("click",function(e){if(e.target.closest(".block-actions"))return;e.stopPropagation();selectBlock(block);});
  block.querySelector(".block-actions").addEventListener("click",function(e){
    e.stopPropagation();const btn=e.target.closest("[data-act]");if(!btn)return;const act=btn.dataset.act;
    if(act==="del"){pushUndo();block.remove();selectedBlock=null;showEmpty();}
    if(act==="up"){pushUndo();const prev=block.previousElementSibling;if(prev&&prev.classList.contains("c-block"))canvas.insertBefore(block,prev);}
    if(act==="down"){pushUndo();const next=block.nextElementSibling;if(next&&next.classList.contains("c-block"))canvas.insertBefore(next,block);}
    if(act==="dupe"){pushUndo();const dupe=createBlock(block.dataset.type,extractData(block));block.after(dupe);selectBlock(dupe);}
  });
  const mcAdd=block.querySelector(".mc-add");
  if(mcAdd)mcAdd.addEventListener("click",function(e){e.stopPropagation();pushUndo();const grid=block.querySelector(".mc-options");const opt=document.createElement("div");opt.className="mc-option";opt.innerHTML=`<input type="radio" disabled><span class="mc-option-label" contenteditable="true">Option ${grid.children.length+1}</span>`;grid.appendChild(opt);});
  const pcAdd=block.querySelector(".pc-add-img");
  if(pcAdd)pcAdd.addEventListener("click",function(e){e.stopPropagation();pcImageInput.click();pcImageInput.onchange=function(){Array.from(pcImageInput.files).forEach(file=>{const reader=new FileReader();reader.onload=function(ev){const item=document.createElement("div");item.className="pc-item";item.innerHTML=`<div class="pc-img-placeholder"><img src="${ev.target.result}" alt=""></div><div class="pc-item-label"><input type="radio" disabled><span contenteditable="true">Option</span></div>`;block.querySelector(".pc-grid").appendChild(item);};reader.readAsDataURL(file);});pcImageInput.value="";};});
  block.addEventListener("dragstart",function(e){dragSrc=block;e.dataTransfer.effectAllowed="move";setTimeout(()=>block.style.opacity=".4",0);});
  block.addEventListener("dragend",function(){block.style.opacity="";allBlocks().forEach(b=>b.classList.remove("drag-over"));dragSrc=null;});
  block.addEventListener("dragover",function(e){e.preventDefault();if(dragSrc&&dragSrc!==block)block.classList.add("drag-over");});
  block.addEventListener("dragleave",function(){block.classList.remove("drag-over");});
  block.addEventListener("drop",function(e){e.preventDefault();block.classList.remove("drag-over");if(!dragSrc||dragSrc===block)return;pushUndo();const rect=block.getBoundingClientRect();if(e.clientY<rect.top+rect.height/2)canvas.insertBefore(dragSrc,block);else block.after(dragSrc);});
}
document.querySelectorAll(".block-btn").forEach(btn=>{btn.addEventListener("click",function(){pushUndo();hideEmpty();const block=createBlock(btn.dataset.block);if(!block)return;if(selectedBlock&&canvas.contains(selectedBlock))selectedBlock.after(block);else canvas.appendChild(block);selectBlock(block);block.scrollIntoView({behavior:"smooth",block:"nearest"});});});
document.getElementById("undoBtn").addEventListener("click",function(){if(!undoStack.length)return;rebuildFromBlocks(undoStack.pop());});
document.getElementById("selectAllBtn").addEventListener("click",function(){allBlocks().forEach(b=>b.classList.add("selected"));});
document.getElementById("clearBtn").addEventListener("click",function(){if(!confirm("Clear the entire canvas?"))return;pushUndo();allBlocks().forEach(b=>b.remove());selectedBlock=null;pageCount=1;showEmpty();});
function extractData(block){
  const type=block.dataset.type;const data={type};
  if(type==="header"||type==="subheader"||type==="text"){data.content=block.querySelector("[contenteditable]").innerHTML;}
  if(type==="pagebreak"){const wrap=block.querySelector(".page-break-wrap");data.pageNum=wrap?parseInt(wrap.dataset.page)||2:2;}
  if(["shorttext","longtext","date","number","website","fileupload","signature","mediaanswer"].includes(type)){const lel=block.querySelector(".q-label-text");const hel=block.querySelector(".q-hint");data.label=lel?lel.innerHTML:"";data.hint=hel?hel.innerHTML:"";}
  if(type==="multiplechoice"){const lel=block.querySelector(".q-label-text");const hel=block.querySelector(".q-hint");data.label=lel?lel.innerHTML:"";data.hint=hel?hel.innerHTML:"";data.options=Array.from(block.querySelectorAll(".mc-option-label")).map(el=>el.innerHTML);}
  if(type==="picturechoice"){const lel=block.querySelector(".q-label-text");const hel=block.querySelector(".q-hint");data.label=lel?lel.innerHTML:"";data.hint=hel?hel.innerHTML:"";data.images=Array.from(block.querySelectorAll(".pc-img-placeholder img")).map(img=>img.src);}
  if(type==="dropdown"){const lel=block.querySelector(".q-label-text");const hel=block.querySelector(".q-hint");data.label=lel?lel.innerHTML:"";data.hint=hel?hel.innerHTML:"";data.options=Array.from(block.querySelectorAll("select option")).slice(1).map(o=>o.textContent);}
    // Persist media file data URL + block styling so it survives save/reload
  if(type==="mediafile"){
    data.src  = block.dataset.mediaSrc  || "";
    data.kind = block.dataset.mediaKind || "";
  }
  const alignClass = ["align-left","align-center","align-right"].find(c=>block.classList.contains(c));
  const sizeClass   = ["bw-small","bw-medium","bw-large"].find(c=>block.classList.contains(c));
  data.align = alignClass ? alignClass.replace("align-","") : "center";
  data.size  = sizeClass  ? sizeClass.replace("bw-","")     : "large";
  return data;
}
function serializeBlocks(){return allBlocks().map(extractData);}
function rebuildFromBlocks(blocks){
  allBlocks().forEach(b=>b.remove());selectedBlock=null;pageCount=1;
  if(!blocks||!blocks.length){showEmpty();return;}
  hideEmpty();
  blocks.forEach(data=>{const block=createBlock(data.type,data);if(!block)return;canvas.appendChild(block);if(data.content){const ce=block.querySelector("[contenteditable]");if(ce)ce.innerHTML=data.content;}if(data.label){const lel=block.querySelector(".q-label-text");if(lel)lel.innerHTML=data.label;}if(data.hint){const hel=block.querySelector(".q-hint");if(hel)hel.innerHTML=data.hint;}
    if(data.align){
      block.classList.remove("align-left","align-center","align-right");
      block.classList.add("align-"+data.align);
      const tb=block.querySelector(".block-toolbar");
      if(tb){tb.querySelectorAll("[data-align]").forEach(b=>b.classList.toggle("active",b.dataset.align===data.align));}
    }
    if(data.size){
      block.classList.remove("bw-small","bw-medium","bw-large");
      block.classList.add("bw-"+data.size);
      const tb=block.querySelector(".block-toolbar");
      if(tb){tb.querySelectorAll("[data-size]").forEach(b=>b.classList.toggle("active",b.dataset.size===data.size));}
    }
    if(data.type==="mediafile" && data.src){
      block.dataset.mediaSrc = data.src;
      block.dataset.mediaKind = data.kind || "image";
    }});
}
async function save(){
  const blocks=serializeBlocks();
  const assignedLevels=Array.from(document.querySelectorAll("#assignLevelsGroup input:checked")).map(c=>c.value);const payload={title:titleInput.value.trim()||"Untitled Activity",level:levelSelect.value,assignedLevels,assignedLearners:selectedLearners,createdByTeacher:(sessionStorage.getItem("impactAccessName")||sessionStorage.getItem("impactPersonnelName")||""),blocks,version:2,updatedAt:new Date().toISOString()};
  if(currentId){await db.collection(COLLECTION).doc(currentId).set(payload,{merge:true});}
  else{const ref=await db.collection(COLLECTION).add(payload);currentId=ref.id;history.replaceState(null,"","/teacher/activity-builder.html?edit="+currentId);}
  tick();return currentId;
}
document.getElementById("saveBtn").addEventListener("click",async function(e){e.preventDefault();await save();});
document.getElementById("newBtn").addEventListener("click",function(e){e.preventDefault();currentId="";titleInput.value="";levelSelect.value="Absolute Beginner";allBlocks().forEach(b=>b.remove());selectedBlock=null;pageCount=1;showEmpty();history.replaceState(null,"","/teacher/activity-builder.html");});
document.getElementById("viewBtn").addEventListener("click",async function(e){
  e.preventDefault();
  if(!titleInput.value.trim()){titleInput.focus();titleInput.style.border="1.5px solid #f87171";titleInput.placeholder="Please enter a title first";setTimeout(()=>{titleInput.style.border="";},2000);return;}
  const id=await save();
  if(id)window.open(VIEW_PAGE+"?id="+encodeURIComponent(id),"_blank");
});
let autoSaveTimer=null;
function scheduleAutoSave(){
  const hasTitle=titleInput.value.trim().length>0;
  const hasBlocks=allBlocks().length>0;
  const hasLevel=levelSelect.value.length>0;
  if(!hasTitle||!hasBlocks||!hasLevel)return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(async function(){await save();},1200);
}
titleInput.addEventListener("input",scheduleAutoSave);
levelSelect.addEventListener("change",scheduleAutoSave);
new MutationObserver(function(){scheduleAutoSave();}).observe(canvas,{childList:true,subtree:false});
async function load(){
  if(!currentId)return;
  const doc=await db.collection(COLLECTION).doc(currentId).get();
  if(!doc.exists)return;
  const d=doc.data();
  titleInput.value=d.title||"";
  if(d.level)levelSelect.value=d.level;
  if(d.version===2&&Array.isArray(d.blocks)){rebuildFromBlocks(d.blocks);return;}
  if(d.content){hideEmpty();const notice=document.createElement("div");notice.className="legacy-notice";notice.innerHTML="⚠️ Legacy activity — read-only. Use New + to create a fresh one.";canvas.insertBefore(notice,canvas.firstChild);const wrapper=document.createElement("div");wrapper.style.cssText="padding:12px;border-radius:10px;border:1.5px solid #e0e3e8;background:#fafbfc;color:#374151;font-size:.88rem;line-height:1.7;pointer-events:none";wrapper.innerHTML=d.content;canvas.appendChild(wrapper);}
}
load();
});
